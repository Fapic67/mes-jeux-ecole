<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quelle heure est-il ?</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ff;--fg:#22204a;--mut:#5f5b8a;--card:#fff;--bd:#d6def5;--math:#4a7cff;--ok:#22a861;--ko:#e5484d;--hh:#e5484d;--mh:#2f6fe0;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#171a2e;--fg:#eef0fb;--mut:#a9acd0;--card:#262a45;--bd:#3a3f63}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;user-select:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
[hidden]{display:none!important}
#inner{position:fixed;inset:0;max-width:560px;margin:0 auto;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
#top{display:flex;justify-content:flex-end}
#lvlb{min-height:52px;padding:0 16px;border:3px solid var(--bd);background:var(--card);color:var(--fg);border-radius:16px;font-size:18px;font-weight:700}
#q{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--bd);border-radius:22px;padding:10px 12px;min-height:84px}
#ear{flex:none;width:60px;height:60px;border:0;border-radius:18px;background:var(--math);color:#fff;font-size:28px;box-shadow:0 4px 0 #2b56c4}
#qt{flex:1;font-size:min(6.6vw,27px);font-weight:700;line-height:1.2}
#clockw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#clock{height:100%;max-height:100%;width:auto;max-width:100%;aspect-ratio:1;touch-action:none}
#clock.set{cursor:grab}
.face{fill:#fff;stroke:#22204a;stroke-width:5}
.tk{stroke:#22204a;stroke-linecap:round}
.num{font-size:19px;font-weight:700;fill:#22204a;text-anchor:middle;dominant-baseline:central;font-family:"Fredoka",system-ui,sans-serif}
#hh{stroke:var(--hh);stroke-width:9;stroke-linecap:round}
#mh{stroke:var(--mh);stroke-width:6;stroke-linecap:round}
#clock.set #hh,#clock.set #mh{filter:drop-shadow(0 0 3px rgba(0,0,0,.25))}
#clock.ok .face{stroke:var(--ok);stroke-width:8}
#clock.ko{animation:shake .35s}
#opts{display:flex;gap:10px}
#opts button{flex:1;min-height:68px;border:3px solid var(--bd);border-radius:20px;background:var(--card);color:var(--fg);font-size:min(7vw,28px);font-weight:700;box-shadow:0 4px 0 var(--bd);white-space:nowrap}
#opts button.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 0 #17804a}
#opts button.ko{background:#fde8e8;border-color:var(--ko);color:#b4232a;text-decoration:line-through;box-shadow:none;animation:shake .35s}
@media (prefers-color-scheme:dark){#opts button.ko{background:#4a1f24;color:#ffb3b6}}
#check{min-height:68px;border:0;border-radius:20px;background:var(--ok);color:#fff;font-size:28px;font-weight:700;box-shadow:0 5px 0 #17804a}
#msg{min-height:26px;text-align:center;font-size:20px;font-weight:700}
#cnt{text-align:center;color:var(--mut);font-size:17px;font-weight:600}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#end b{font-size:34px}#end p{font-size:22px;margin:0}
#again{min-width:220px;height:72px;border:0;border-radius:22px;background:var(--math);color:#fff;font-size:24px;font-weight:700;box-shadow:0 5px 0 #2b56c4}
.sheet{position:fixed;inset:0;background:rgba(10,8,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.panel{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0 0 4px;font-size:26px}
.opt{min-height:64px;border:3px solid var(--bd);background:var(--card);color:var(--fg);border-radius:18px;font-size:21px;font-weight:700;text-align:left;padding:8px 14px}
.opt small{display:block;font-size:16px;color:var(--mut);font-weight:600}.opt.on{border-color:var(--math);box-shadow:0 0 0 3px var(--math)}
#close{height:60px;border:0;border-radius:18px;background:var(--math);color:#fff;font-size:21px;font-weight:700}
</style>
</head>
<body>
<div id="inner">
  <div id="top"><button id="lvlb"></button></div>
  <div id="q"><button id="ear" aria-label="Réécouter">🔊</button><span id="qt"></span></div>
  <div id="clockw"><svg id="clock" viewBox="0 0 240 240"></svg></div>
  <div id="opts"></div>
  <button id="check" hidden>✓ C'est l'heure !</button>
  <div id="msg"></div>
  <div id="cnt"></div>
  <div id="end" hidden><b>🎉 Bravo !</b><p id="score"></p><button id="again">Encore</button></div>
</div>
<div class="sheet" id="sheet" hidden><div class="panel"><h2>Niveau</h2><div id="lvls" style="display:flex;flex-direction:column;gap:10px"></div><button id="close">Fermer</button></div></div>
<script>
(function(){
// Quelle heure est-il ? (Mathématiques) : horloge à aiguilles, petite aiguille rouge (heures), grande aiguille bleue (minutes).
// Questions en alternance : « Lire » (l'horloge affiche une heure, choisir parmi 3 heures écrites) et « Régler » (la voix dit une heure, tourner les aiguilles puis ✓).
// Niveaux : Facile = heures pile ; Moyen = + et demie ; Difficile = + et quart / moins le quart. Partie de 10 questions.
// Un message « answer » par question (juste du premier coup), roundEnd en fin de partie. Uniquement en français (à la demande de l'utilisateur).
var $=function(i){return document.getElementById(i)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function rnd(n){return Math.floor(Math.random()*n)}
function voiceFor(l){try{var v=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.indexOf(l)===0});return v.filter(function(x){return x.localService})[0]||v[0]||null}catch(e){return null}}
// voix d'homme (à la demande de l'utilisateur) : une voix masculine installée si son nom l'indique, sinon la voix habituelle rendue grave (pitch)
var MALE=/thomas|paul|henri|nicolas|daniel|mathieu|antoine|claude|male|homme|frb|frd/i,MV=null;
function maleVoice(){try{var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.indexOf("fr")===0&&MALE.test((x.name||"")+" "+(x.voiceURI||""))&&!/female|femme/i.test(x.name||"")});return v.filter(function(x){return x.localService})[0]||v[0]||null}catch(e){return null}}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";MV=MV||maleVoice();var v=MV||voiceFor("fr");if(v)u.voice=v;u.rate=.9;u.pitch=MV?.97:.78;speechSynthesis.speak(u)}catch(e){}}
// attendre la fin de la phrase en cours (et au moins ms) avant d'enchaîner : la question suivante ne coupe plus la voix (signalé par l'utilisateur)
function afterSay(fn,ms){var t0=Date.now(),quiet=0;(function w(){var s=window.speechSynthesis,busy=s&&(s.speaking||s.pending),now=Date.now();if(busy)quiet=0;else if(!quiet)quiet=now;if((now-t0>=ms&&quiet&&now-quiet>=250)||now-t0>15000)fn();else setTimeout(w,120)})()}
var ac=null;function tone(f,t,d){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C()}if(ac.state==="suspended")ac.resume();var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.18,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
var PK="@"+(window.PROFILE||"p1");function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var LV=[null,{t:"Facile",d:"Les heures pile : 3 h, 7 h…",m:[0],x:1},{t:"Moyen",d:"Et demie : 3 h 30",m:[0,30],x:1.25},{t:"Difficile",d:"Et quart, moins le quart : 3 h 15, 2 h 45",m:[0,15,30,45],x:1.5}];
var level=Math.min(3,Math.max(1,parseInt(ls("heure_lvl"+PK))||1));
var NB=["douze","une","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze"];
function hw(h){return NB[h]+(h===1?" heure":" heures")}
function speak(t){var h=t.h,m=t.m;if(m===0)return hw(h);if(m===30)return hw(h)+" et demie";if(m===15)return hw(h)+" et quart";if(m===45)return hw(h%12+1)+" moins le quart";return hw(h)+" "+m}
function written(t){return t.h+"\u00a0h"+(t.m?"\u00a0"+(t.m<10?"0":"")+t.m:"")} // espaces insécables : l'heure ne se coupe jamais
function same(a,b){return a.h===b.h&&a.m===b.m}
function rt(){var L=LV[level];var m=L.m[rnd(L.m.length)];if(level>1&&Math.random()<.6)m=L.m.filter(function(x){return x})[rnd(L.m.length-1)];return{h:1+rnd(12),m:m}}
/* horloge */
var C=120,clock=$("clock");
(function face(){var s='<circle class="face" cx="120" cy="120" r="112"/>';
 for(var i=0;i<60;i++){var a=i*6*Math.PI/180,big=i%5===0,r1=big?98:103;s+='<line class="tk" x1="'+(C+r1*Math.sin(a))+'" y1="'+(C-r1*Math.cos(a))+'" x2="'+(C+107*Math.sin(a))+'" y2="'+(C-107*Math.cos(a))+'" stroke-width="'+(big?3.5:1.5)+'"/>'}
 for(var n=1;n<=12;n++){var b=n*30*Math.PI/180;s+='<text class="num" x="'+(C+82*Math.sin(b))+'" y="'+(C-82*Math.cos(b))+'">'+n+"</text>"}
 s+='<line id="hh" x1="120" y1="120" x2="120" y2="70"/><line id="mh" x1="120" y1="120" x2="120" y2="35"/><circle cx="120" cy="120" r="7" fill="#22204a"/>';
 clock.innerHTML=s})();
var T={h:12,m:0}; // heure affichée
function hands(t){var ma=t.m*6,ha=((t.h%12)+t.m/60)*30;function set(id,a,r){var e=$(id),x=a*Math.PI/180;e.setAttribute("x2",C+r*Math.sin(x));e.setAttribute("y2",C-r*Math.cos(x))}set("hh",ha,52);set("mh",ma,70)} // la grande aiguille s'arrête avant les chiffres
/* partie */
var N=window.PATHN||10,qs,qi,good,cur,miss,busy,mode;
function start(){qs=[];var used={};for(var i=0;i<N;i++){var t,k=0;do{t=rt();k++}while(used[t.h+":"+t.m]&&k<20);used[t.h+":"+t.m]=1;qs.push({t:t,mode:i%2?"set":"read"})}
 qi=0;good=0;$("lvlb").textContent="Niveau : "+LV[level].t;$("end").hidden=true;["q","clockw","msg","cnt"].forEach(function(i){$(i).hidden=false});show()}
function show(){var Q=qs[qi];cur=Q.t;mode=Q.mode;miss=0;busy=false;$("msg").textContent="";clock.classList.remove("ok","set");$("cnt").textContent=(qi+1)+" / "+N;
 if(mode==="read"){T={h:cur.h,m:cur.m};hands(T);$("qt").textContent="Quelle heure est-il ?";$("check").hidden=true;$("opts").hidden=false;
  // propositions : la bonne, l'erreur classique (heure d'à côté) et une autre
  var c=[cur],L=LV[level];var near={h:cur.m>=30?cur.h%12+1:(cur.h+10)%12+1,m:cur.m};
  if(cur.m===0&&level>1)near={h:cur.h,m:30};
  [near].concat(shuffle([0,1,2,3,4,5].map(function(){return rt()}))).forEach(function(t){if(c.length<3&&!c.some(function(x){return same(x,t)}))c.push(t)});
  $("opts").innerHTML=shuffle(c).map(function(t){return '<button data-h="'+t.h+'" data-m="'+t.m+'">'+written(t)+"</button>"}).join("");
  setTimeout(function(){if(!busy&&!miss)say("Quelle heure est-il ?")},250)}
 else{T={h:12,m:0};hands(T);clock.classList.add("set");$("opts").hidden=true;$("check").hidden=false;
  $("qt").innerHTML="Mets l'horloge à "+speak(cur)+' <span style="white-space:nowrap">('+written(cur)+")</span>";
  $("msg").textContent=level===1?"Tourne la petite aiguille rouge":"Tourne les aiguilles avec ton doigt";
  setTimeout(function(){if(!busy&&!miss)say("Mets l'horloge à "+speak(cur))},250)}}
$("ear").onclick=function(){if(!cur)return;say(mode==="read"?"Quelle heure est-il ?":"Mets l'horloge à "+speak(cur))};
function answer(ok){try{if(parent!==window)parent.postMessage({type:"answer",game:"heure",ok:ok,diff:LV[level].x,k:mode==="read"?"Lire l'heure":"Régler l'horloge",item:written(cur)},"*")}catch(e){}}
function win(){busy=true;if(!miss)good++;answer(!miss);clock.classList.add("ok");tone(660,0,.12);tone(880,.1,.2);say("Bravo ! Il est "+speak(cur));$("msg").textContent="✅ Il est "+speak(cur);
 afterSay(function(){qi++;if(qi<N)show();else end()},2200)}
$("opts").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||busy||b.classList.contains("ko"))return;
 var t={h:+b.dataset.h,m:+b.dataset.m};if(same(t,cur)){b.classList.add("ok");win()}else{miss++;b.classList.add("ko");tone(220,0,.25)}});
/* réglage des aiguilles au doigt : on attrape l'aiguille la plus proche du doigt (en Facile, seulement la petite) */
var drag=null;
function ang(e){var r=clock.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;return(Math.atan2(x,-y)*180/Math.PI+360)%360}
function dif(a,b){var d=Math.abs(a-b)%360;return d>180?360-d:d}
clock.addEventListener("pointerdown",function(e){if(mode!=="set"||busy)return;var a=ang(e),ma=T.m*6,ha=((T.h%12)+T.m/60)*30;
 var r=clock.getBoundingClientRect(),d=Math.hypot(e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2)*240/r.width; // distance au centre (unités de l'horloge)
 // aiguilles proches l'une de l'autre (ex. toutes deux sur 12) : près du centre = petite aiguille, plus loin = grande
 drag=level===1?"h":Math.abs(dif(a,ha)-dif(a,ma))<25?(d<58?"h":"m"):dif(a,ha)<dif(a,ma)?"h":"m";try{clock.setPointerCapture(e.pointerId)}catch(er){}move(e)});
clock.addEventListener("pointermove",function(e){if(drag)move(e)});
function stop(){if(drag){drag=null;tone(520,0,.05)}}
clock.addEventListener("pointerup",stop);clock.addEventListener("pointercancel",stop);
function move(e){var a=ang(e);if(drag==="m"){var st=level===2?30:15,m=Math.round(a/6/st)*st%60;if(LV[level].m.indexOf(m)<0)m=0;T.m=m}
 else{var h=Math.round(a/30-T.m/60);h=((h%12)+12)%12;T.h=h===0?12:h}hands(T)}
$("check").onclick=function(){if(busy||mode!=="set")return;
 if(same(T,cur))win();
 else{miss++;clock.classList.remove("ko");void clock.offsetWidth;clock.classList.add("ko");tone(220,0,.25);
  if(miss>=2){busy=true;T={h:cur.h,m:cur.m};hands(T);$("msg").textContent="Regarde : il est "+speak(cur);say("Regarde, il est "+speak(cur));answer(false);
   afterSay(function(){qi++;if(qi<N)show();else end()},3000)}
  else{$("msg").textContent="Pas tout à fait, essaie encore !";say("Pas tout à fait. "+speak(cur))}}};
function end(){["q","clockw","opts","check","msg","cnt"].forEach(function(i){$(i).hidden=true});$("end").hidden=false;$("score").textContent=good+" / "+N+" du premier coup";cur=null;
 [523,659,784,1047].forEach(function(f,k){tone(f,k*.1,.25)});
 try{if(parent!==window)parent.postMessage({type:"roundEnd"},"*")}catch(e){}}
$("again").onclick=start;
$("lvlb").onclick=function(){$("lvls").innerHTML=[1,2,3].map(function(i){return '<button class="opt'+(i===level?" on":"")+'" data-l="'+i+'">'+LV[i].t+"<small>"+LV[i].d+"</small></button>"}).join("");$("sheet").hidden=false};
$("lvls").onclick=function(e){var b=e.target.closest("[data-l]");if(!b)return;level=+b.dataset.l;ls("heure_lvl"+PK,level);$("sheet").hidden=true;start()};
$("close").onclick=function(){$("sheet").hidden=true};
window.hubBack=function(){if(!$("sheet").hidden){$("sheet").hidden=true;return true}return false};
window.__H={cur:function(){return cur},mode:function(){return mode},set:function(h,m){T={h:h,m:m};hands(T)}};
start();
})();
</script>
</body>
</html>
