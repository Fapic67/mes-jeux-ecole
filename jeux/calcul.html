<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calcul malin</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f3ff;--card:#fff;--ink:#1d2b4f;--soft:#6b7aa0;--key:#fff;--key-b:#c9d9f2;--sun:#ffc93c;--ok:#2bb673;--ko:#e5484d;--blue:#4a7cff;--slot:#fff3c4;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b33;--card:#1f2850;--ink:#f1f4ff;--soft:#9aa8d6;--key:#2a3563;--key-b:#3c4a85;--slot:#3a3a1f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:10px 16px 14px;user-select:none;touch-action:manipulation}
header{display:flex;justify-content:space-between;align-items:center;min-height:48px}
.score{font-size:22px;font-weight:700}
.gear{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);font-size:24px;color:var(--ink)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;min-height:0}
.op{display:flex;align-items:center;justify-content:center;gap:.12em;font-size:clamp(48px,15vw,78px);font-weight:500;line-height:1;white-space:nowrap}
.slot{min-width:1.35em;height:1.25em;border-radius:.25em;background:var(--slot);border:3px dashed var(--sun);display:inline-flex;align-items:center;justify-content:center;padding:0 .12em}
.slot.fill{border-style:solid}
.sym{color:var(--blue)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{height:clamp(52px,9.5vh,70px);border-radius:18px;border:0;border-bottom:4px solid var(--key-b);background:var(--key);color:var(--ink);font:500 30px "Fredoka",sans-serif}
.k:active{transform:translateY(2px);border-bottom-width:2px}
.k.del{font-size:26px}
.k.go{background:var(--blue);color:#fff;border-bottom-color:#2f5ad1;display:flex;align-items:center;justify-content:center}
.k.go svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.k.go.ok{background:var(--ok);border-bottom-color:#1c8a55;animation:shake .5s}
.k.go.ko{background:var(--ko);border-bottom-color:#b02f34}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg) scale(1.1)}35%{transform:rotate(12deg) scale(1.1)}55%{transform:rotate(-8deg)}75%{transform:rotate(5deg)}}
.sheet{position:fixed;inset:0;background:rgba(10,15,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 20px 22px}
.panel h2{margin:0 0 14px;font-size:26px}
.panel label{display:block;font-size:18px;color:var(--soft);margin:14px 0 8px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t{padding:12px 6px;border-radius:14px;border:3px solid var(--key-b);background:var(--key);color:var(--ink);font:500 18px "Fredoka",sans-serif}
.t.on{border-color:var(--blue);background:var(--blue);color:#fff}
input[type=range]{width:100%;accent-color:var(--blue);height:36px}
.mx{font-size:34px;font-weight:700;text-align:center}
.done{margin-top:18px;width:100%;height:54px;border:0;border-radius:16px;background:var(--ok);color:#fff;font:700 22px "Fredoka",sans-serif}
.run{position:fixed;left:0;top:0;width:120px;z-index:4;pointer-events:none;will-change:transform}
.run svg{width:100%;height:auto;display:block;animation:hop .28s ease-in-out infinite alternate}
.run b{position:absolute;left:50%;top:-34px;transform:translateX(-50%);white-space:nowrap;background:var(--card);color:var(--ink);padding:4px 12px;border-radius:14px;font:700 18px "Fredoka",sans-serif}
@keyframes hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-22px) rotate(6deg)}}
#ends{grid-template-columns:repeat(3,1fr)}#ends .t{font-size:16px;padding:12px 2px}
.score{display:flex;gap:12px;align-items:center}#timer{color:var(--blue)}
@media (prefers-reduced-motion:reduce){.k.go.ok{animation:none}}
</style>
</head>
<body>
<header><div class="score"><span id="score">⭐ 0</span><span id="timer"></span></div><button class="gear" id="gear" aria-label="Réglages">⚙️</button></header>
<main><div class="op" id="op"></div></main>
<div class="pad" id="pad"></div>

<div class="sheet" id="sheet"><div class="panel">
<h2>Réglages</h2>
<label>Type d’opération</label>
<div class="types" id="types"></div>
<label>Résultat maximum : <b id="mxv"></b></label>
<input type="range" id="mx" min="5" max="100" step="1">
<label>Fin de la partie</label>
<div class="types" id="ends"></div>
<div id="endopt"><label id="endl"></label><input type="range" id="ev" step="1"></div>
<label>Voix allemande : <b id="vs"></b></label>
<button class="t" id="vt" style="width:100%">🔊 Tester la voix</button>
<button class="done" id="done">Jouer</button>
</div></div>

<div class="sheet" id="end"><div class="panel" style="text-align:center"><h2 id="endt"></h2><div class="mx" id="endsc"></div><button class="done" id="again">Rejouer</button></div></div>

for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=nb;h.type="highpass";h.frequency.value=3000;ng.gain.value=.12;n.connect(h);h.connect(ng);ng.connect(c.destination);n.start(T-.02)}
function laugh(){for(var i=0;i<5;i++)ha(.45+i*.17,720-i*35+rnd(-12,12),i===4?.24:.12)}
function runner(){var n;do{n=rnd(0,CH.length-1)}while(n===lastCh);lastCh=n;var d=document.createElement("div");d.className="run";var W=window.innerWidth,H=window.innerHeight,dir=Math.random()<.5?1:-1,k=rnd(0,5),y0=rnd(Math.round(H*.15),Math.round(H*.5)),fr=[],i,t,x,y,dur=rnd(4200,5400);
for(i=0;i<=16;i++){t=i/16;x=dir>0?-140+t*(W+280):W+20-t*(W+280);
y=[y0,y0+50*Math.sin(t*12.57),y0-90*Math.sin(t*3.14),H*.1+t*H*.5,H*.65-t*H*.5,y0+60*(Math.abs((t*4)%2-1)*2-1)][k];
y=Math.max(50,Math.min(H-160,y));fr.push({transform:"translate("+Math.round(x)+"px,"+Math.round(y)+"px)"})}
d.innerHTML='<i style="display:block;transform:scaleX('+dir+')">'+CH[n]+"</i><b>Ha ha ha !</b>";
document.body.appendChild(d);laugh();var an=d.animate(fr,{duration:dur,easing:"linear",fill:"forwards"});an.onfinish=function(){d.remove()};setTimeout(function(){d.remove()},dur+500)}
var VOICE=null,spoke=false;
function pickVoice(){var v=window.speechSynthesis?speechSynthesis.getVoices():[];VOICE=null;for(var i=0;i<v.length;i++)if(/^de/i.test(v[i].lang)){VOICE=v[i];break}}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(txt,cb,op,q){var done=false,t0=Date.now(),fin=function(){if(!done){done=true;if(cb)cb()}};
if(!window.speechSynthesis){setTimeout(fin,1300);return}
try{if(!VOICE)pickVoice();var S2=speechSynthesis;if(!q&&(S2.speaking||S2.pending))S2.cancel();if(S2.resume)S2.resume();setTimeout(function(){var u=new SpeechSynthesisUtterance(txt);u.lang="de-DE";if(VOICE)u.voice=VOICE;u.rate=.85;u.pitch=1.1;
u.onstart=function(){spoke=true;if(op)op.spoken=true};u.onend=function(){setTimeout(fin,Math.max(300,1300-(Date.now()-t0)))};u.onerror=function(e){setTimeout(fin,1300);var v=$("vs");if(v)v.textContent="erreur : "+((e&&e.error)||"?")};S2.speak(u)},120);setTimeout(fin,5000)}catch(e){setTimeout(fin,1300)}}
function textOp(full,c){c=c||cur;if(c.t==="add")return c.a+" plus "+c.b+" ist gleich"+(full?" "+c.ans:"");if(c.t==="sub")return c.a+" minus "+c.b+" ist gleich"+(full?" "+c.ans:"");return c.a+" plus "+(full?c.ans:"wie viel")+" ist gleich "+c.r}
function gen(){
var t=S.type==="mix"?["add","sub","comp"][rnd(0,2)]:S.type,m=S.max,a,b,r;
if(t==="add"){r=rnd(2,m);a=rnd(1,r-1);b=r-a;return{t:t,a:a,b:b,ans:r}}
if(t==="sub"){a=rnd(2,m);b=rnd(1,a);return{t:t,a:a,b:b,ans:a-b}}
r=rnd(2,m);a=rnd(1,r-1);return{t:t,a:a,r:r,ans:r-a}}

function show(o){
cur=o||gen();ans="";locked=false;
var sl='<span class="slot" id="slot"></span>',h;
if(cur.t==="add")h=cur.a+' <span class="sym">+</span> '+cur.b+' <span class="sym">=</span> '+sl;
else if(cur.t==="sub")h=cur.a+' <span class="sym">−</span> '+cur.b+' <span class="sym">=</span> '+sl;
else h=cur.a+' <span class="sym">+</span> '+sl+' <span class="sym">=</span> '+cur.r;
$("op").innerHTML=h;resetGo();if(!o)say(textOp(false),null,cur)}
function paint(){var s=$("slot");s.textContent=ans;s.className="slot"+(ans?" fill":"")}
function resetGo(){var g=$("go");g.className="k go";g.innerHTML=CHECK}

var CHECK='<svg viewBox="0 0 40 40"><path d="M7 21l9 9L33 10"/></svg>';
var CROSS='<svg viewBox="0 0 40 40"><path d="M10 10l20 20M30 10L10 30"/></svg>';

function build(){
var p=$("pad"),h="";
for(var i=1;i<=9;i++)h+='<button class="k" data-n="'+i+'">'+i+'</button>';
h+='<button class="k del" data-d="1" aria-label="Effacer">⌫</button><button class="k" data-n="0">0</button><button class="k go" id="go" aria-label="Valider"></button>';
p.innerHTML=h;
p.addEventListener("click",function(e){
var b=e.target.closest("button");if(!b||locked)return;ctx();
if(b.dataset.n!==undefined){startTimer();if(ans.length<3){ans=(ans==="0"?"":ans)+b.dataset.n;paint()}}
else if(b.dataset.d){ans=ans.slice(0,-1);paint()}
else if(b.id==="go")check()})}

function check(){
if(ans==="")return;locked=true;var g=$("go");
if(+ans===cur.ans){g.className="k go ok";win();score++;renderScore();if(score>=nextRun){runner();nextRun=score+rnd(6,8)};var over=(S.end==="stars"&&score>=S.stars)||timeUp,nx=gen();say(textOp(true),function(){if(over||timeUp)endGame();else show(nx)});if(!over)say(textOp(false,nx),null,nx,true)}
else{g.className="k go ko";g.innerHTML=CROSS;lose();setTimeout(function(){ans="";paint();resetGo();locked=false},1000)}}

function settings(){
var t=$("types"),h="";
TYPES.forEach(function(x){h+='<button class="t'+(S.type===x[0]?" on":"")+'" data-t="'+x[0]+'">'+x[1]+'</button>'});
t.innerHTML=h;$("mx").value=S.max;$("mxv").textContent=S.max;
var E=[["none","Sans fin"],["stars","Étoiles"],["time","Minuteur"]],e="";
E.forEach(function(x){e+='<button class="t'+(S.end===x[0]?" on":"")+'" data-e="'+x[0]+'">'+x[1]+'</button>'});
$("ends").innerHTML=e;$("endopt").style.display=S.end==="none"?"none":"block";
var r=$("ev");if(S.end==="stars"){r.min=1;r.max=50;r.value=S.stars}else{r.min=1;r.max=15;r.value=S.mins}
endLabel();pickVoice();$("vs").textContent=window.speechSynthesis?(VOICE?VOICE.name+" ("+VOICE.lang+")":"aucune trouvée"):"non disponible"}
$("types").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;S.type=b.dataset.t;settings()});
$("ends").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;S.end=b.dataset.e;settings()});
$("ev").addEventListener("input",function(){if(S.end==="stars")S.stars=+this.value;else S.mins=+this.value;endLabel()});
$("again").addEventListener("click",restart);
$("mx").addEventListener("input",function(){S.max=+this.value;$("mxv").textContent=S.max});
$("gear").addEventListener("click",function(){settings();$("sheet").classList.add("open")});
$("done").addEventListener("click",function(){$("sheet").classList.remove("open");save();restart()});

$("vt").addEventListener("click",function(){say("Fünf plus acht ist gleich dreizehn")});
document.addEventListener("pointerdown",function(e){if(cur&&!cur.spoken&&!locked&&!e.target.closest(".sheet"))say(textOp(false),null,cur)},true);
$("op").addEventListener("click",function(){if(cur&&!locked)say(textOp(false))});
build();restart();
})();
</script>
</body>
