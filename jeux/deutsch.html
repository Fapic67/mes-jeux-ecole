<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch</title>
<style>
:root{--bg:#faf8f5;--fg:#1d1d1f;--mut:#6b6b70;--card:#fff;--bd:#e3e0da;--der:#2f6fed;--die:#e0457b;--das:#1f9d6b;--bad:#d64545;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#f2f2f4;--mut:#9a9aa2;--card:#222227;--bd:#34343b}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
#app{width:100%;max-width:420px;display:flex;flex-direction:column;gap:24px;align-items:center}
.bar{width:100%;height:14px;background:var(--bd);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--der);transition:width .3s}
.cnt{color:var(--mut);font-size:19px;font-weight:600}
.word{font-size:clamp(40px,13vw,64px);font-weight:700;word-break:break-word;margin:8px 0}
.pic{font-size:110px;line-height:1.1;min-height:150px;display:flex;align-items:center;justify-content:center}
.pic svg{width:160px;height:160px}
.pills{display:flex;gap:12px;width:100%}
.pills.col{flex-direction:column}
.pill{flex:1;font-size:27px;font-weight:700;min-height:68px;padding:14px 8px;border-radius:999px;border:4px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
.col .pill{flex:none}
.pill[data-a=der]{border-color:var(--der)}.pill[data-a=die]{border-color:var(--die)}.pill[data-a=das]{border-color:var(--das)}
.pill.ok{color:#fff;background:var(--das);border-color:var(--das)}
.pill.ok[data-a=der]{background:var(--der)}.pill.ok[data-a=die]{background:var(--die)}
.pill.no{opacity:.4;border-color:var(--bad);text-decoration:line-through}
.pill:disabled{cursor:default}
.shake{animation:sh .25s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{font-size:22px;font-weight:700;min-height:64px;padding:16px 36px;border-radius:999px;border:0;background:var(--der);color:#fff;cursor:pointer}
.btn2{background:var(--card);color:var(--fg);border:3px solid var(--bd)}
.menu .btn{width:100%}
.big{font-size:72px;font-weight:800}
h1{margin:0;font-size:34px}
.ear{background:var(--card);border:3px solid var(--bd);border-radius:50%;width:68px;height:68px;font-size:32px;cursor:pointer;color:var(--fg)}
/* Schreib das Wort */
body.withkb{justify-content:flex-start;padding-top:24px;padding-bottom:300px}
body.withkb .pic{min-height:0;font-size:90px}body.withkb .pic svg{width:120px;height:120px}
/* un trait par lettre, un espace visible entre l'article et le mot */
.typed{display:flex;justify-content:center;align-items:flex-end;gap:var(--g,5px);flex-wrap:nowrap;min-height:58px;color:var(--der);font-weight:700;font-size:var(--fs,34px)}
.typed .l{width:var(--sw,30px);border-bottom:4px solid var(--fg);text-align:center;line-height:1.25;min-height:1.3em;opacity:.95}
.typed .l.cur{border-bottom-color:var(--der);animation:blink 1s infinite}
.typed .sp{width:calc(var(--sw,30px) * .9)}
.typed.ok{color:var(--das)}.typed.ok .l{border-bottom-color:var(--das)}
.typed.ko{color:var(--bad)}.typed.ko .l{border-bottom-color:var(--bad)}
@keyframes blink{50%{border-bottom-color:transparent}}
.hint{color:var(--mut);font-size:19px;min-height:24px;font-weight:600}
.copy{font-size:22px;color:var(--mut)}.copy b{color:var(--fg)}
.back{position:fixed;top:10px;left:12px;min-height:52px;padding:0 16px;background:var(--card);border:3px solid var(--bd);border-radius:16px;font-size:18px;font-weight:700;color:var(--fg);cursor:pointer}
</style>
<script src="jeux/allemand-mots.js"></script>
<script src="jeux/clavier.js"></script>
</head>

opacity=\".08\"/><rect x=\"8\" y=\"34\" width=\"84\" height=\"12\" rx=\"4\" fill=\"#c58b4c\"/><rect x=\"8\" y=\"34\" width=\"84\" height=\"5\" rx=\"2.5\" fill=\"#dca76a\"/><rect x=\"16\" y=\"46\" width=\"8\" height=\"46\" rx=\"2\" fill=\"#a86f34\"/><rect x=\"76\" y=\"46\" width=\"8\" height=\"46\" rx=\"2\" fill=\"#a86f34\"/><rect x=\"24\" y=\"46\" width=\"52\" height=\"6\" fill=\"#a86f34\"/></svg>","Klasse":"<svg viewBox=\"0 0 100 100\"><rect x=\"0\" y=\"0\" width=\"100\" height=\"100\" fill=\"#fff4dc\"/><rect x=\"16\" y=\"8\" width=\"68\" height=\"34\" rx=\"3\" fill=\"#2f6b4f\" stroke=\"#a86f34\" stroke-width=\"4\"/><path d=\"M26 22q4-6 8 0t8 0M50 18h20M50 28h14\" stroke=\"#fff\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><g><circle cx=\"24\" cy=\"60\" r=\"7\" fill=\"#f2c094\"/><path d=\"M17 58q7-10 14 0\" fill=\"#6b3d1f\"/><rect x=\"12\" y=\"68\" width=\"24\" height=\"6\" rx=\"2\" fill=\"#c58b4c\"/><circle cx=\"50\" cy=\"60\" r=\"7\" fill=\"#c98b5b\"/><path d=\"M43 58q7-10 14 0\" fill=\"#1f1f2e\"/><rect x=\"38\" y=\"68\" width=\"24\" height=\"6\" rx=\"2\" fill=\"#c58b4c\"/><circle cx=\"76\" cy=\"60\" r=\"7\" fill=\"#f6d2b0\"/><path d=\"M69 58q7-10 14 0\" fill=\"#e0a43a\"/><rect x=\"64\" y=\"68\" width=\"24\" height=\"6\" rx=\"2\" fill=\"#c58b4c\"/><circle cx=\"37\" cy=\"84\" r=\"7\" fill=\"#f2c094\"/><path d=\"M30 82q7-10 14 0\" fill=\"#c4502a\"/><rect x=\"25\" y=\"92\" width=\"24\" height=\"6\" rx=\"2\" fill=\"#c58b4c\"/><circle cx=\"63\" cy=\"84\" r=\"7\" fill=\"#e8b48a\"/><path d=\"M56 82q7-10 14 0\" fill=\"#3b2a1a\"/><rect x=\"51\" y=\"92\" width=\"24\" height=\"6\" rx=\"2\" fill=\"#c58b4c\"/></g></svg>","Radiergummi":"<svg viewBox=\"0 0 100 100\"><ellipse cx=\"50\" cy=\"84\" rx=\"38\" ry=\"5\" fill=\"#000\" opacity=\".08\"/><g transform=\"rotate(-18 50 55)\"><path d=\"M14 44h36v26H14z\" fill=\"#ff8fab\"/><path d=\"M50 44h36v26H50z\" fill=\"#4a7cff\"/><path d=\"M14 44l8-8h72l-8 8z\" fill=\"#ffb3c6\"/><path d=\"M50 44l8-8h36l-8 8z\" fill=\"#7f 8\" fill=\"#c98b5b\"/><path d=\"M30 38q8-12 16 0\" fill=\"#1f1f2e\"/><rect x=\"30\" y=\"50\" width=\"16\" height=\"22\" rx=\"6\" fill=\"#ff5c7a\"/><path d=\"M34 72v14M42 72v14\" stroke=\"#22204a\" stroke-width=\"4\" stroke-linecap=\"round\"/></g><g><circle cx=\"62\" cy=\"36\" r=\"8\" fill=\"#f6d2b0\"/><path d=\"M54 34q8-12 16 0\" fill=\"#e0a43a\"/><rect x=\"54\" y=\"46\" width=\"16\" height=\"26\" rx=\"6\" fill=\"#4cc261\"/><path d=\"M58 72v14M66 72v14\" stroke=\"#22204a\" stroke-width=\"4\" stroke-linecap=\"round\"/></g><g><circle cx=\"86\" cy=\"42\" r=\"8\" fill=\"#e8b48a\"/><path d=\"M78 40q8-12 16 0\" fill=\"#c4502a\"/><rect x=\"78\" y=\"52\" width=\"16\" height=\"20\" rx=\"6\" fill=\"#ffb800\"/><path d=\"M82 72v14M90 72v14\" stroke=\"#22204a\" stroke-width=\"4\" stroke-linecap=\"round\"/></g></svg>","Spitzer":"<svg viewBox=\"0 0 100 100\"><ellipse cx=\"50\" cy=\"84\" rx=\"34\" ry=\"4\" fill=\"#000\" opacity=\".08\"/><rect x=\"40\" y=\"46\" width=\"44\" height=\"36\" rx=\"6\" fill=\"#e5484d\"/><rect x=\"40\" y=\"46\" width=\"44\" height=\"8\" rx=\"4\" fill=\"#ff7a7e\"/><rect x=\"62\" y=\"56\" width=\"16\" height=\"20\" rx=\"2\" fill=\"#c9d3e3\"/><circle cx=\"48\" cy=\"64\" r=\"7\" fill=\"#7a1f22\"/><g transform=\"rotate(-25 48 64)\"><rect x=\"-4\" y=\"59\" width=\"44\" height=\"10\" fill=\"#ffd166\"/><rect x=\"-4\" y=\"59\" width=\"44\" height=\"3\" fill=\"#ffe08a\"/><path d=\"M40 59l10 5-10 5z\" fill=\"#f2c094\"/><path d=\"M47 62.5l3 1.5-3 1.5z\" fill=\"#22204a\"/></g></svg>"};
var ALL=ALL0.map(function(x){if(!x.e&&PIC[x.w])x.e=PIC[x.w];return x});
var TOTAL=20,app=document.getElementById("app"),voice=null,msg=document.createElement("div");
msg.style.cssText="position:fixed;bottom:12px;left:12px;right:12px;font-size:16px;color:#d64545";document.body.appendChild(msg);
var bk=document.createElement("button");bk.className="back";bk.textContent="← Menü";bk.style.display="none";bk.onclick=function(){home()};if(!window.START)document.body.appendChild(bk);
function pickVoice(){var v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];voice=v.find(function(x){return x.lang&&x.lang.indexOf("de")===0})||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){try{if(!window.speechSynthesis){msg.textContent="Synthèse vocale indisponible : ouvre le lien dans le navigateur du téléphone";return}pickVoice();speechSynthesis.cancel();setTimeout(function(){var u=new SpeechSynthesisUtterance(t);u.lang="de-DE";if(voice)u.voice=voice;u.rate=.9;u.onstart=function(){msg.textContent=""};u.onerror=function(e){if(e.error==="interrupted"||e.error==="canceled")return;msg.textContent="Erreur voix : "+e.error};speechSynthesis.resume();speechSynthesis.speak(u)},60)}catch(e){msg.textContent="Erreur voix : "+e}}
// Étoiles : bonne réponse du premier coup = série ; un peu plus de difficulté si beaucoup de leçons sont cochées
function star(ok,w){var g=mode===3?"sdw":mode===2?"fdw":"dde",d=deSelected(g,window.PROFILE).length>8?1.25:1;try{if(parent!==window)parent.postMessage({type:"answer",game:g,ok:ok!==false,diff:d,k:w?(mode>=2?"L"+w.n:w.a):null,item:w?(w.a?w.a+" ":"")+w.w:null},"*")}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function bar(){return '<div class="cnt">'+(i+1)+' / '+deck.length+'</div><div class="bar"><i style="width:'+(i/deck.length*100)+'%"></i></div>'}
var deck,i,good,missed,mode=0;
function home(){nokb();if(window.START){parent.postMessage("hub-back","*");return}mode=0;bk.style.display="none";app.innerHTML='<h1>Deutsch</h1><div class="pills col menu"><button class="btn" id="m1">Der · Die · Das</button><button class="btn" id="m2">Finde das Wort</button></div>';document.getElementById("m1").onclick=start;document.getElementById("m2").onclick=start2}
// Exercice 1 : article
// Leçons cochées dans les Paramètres (par profil)
function pool(game,f){var sel=deSelected(game,window.PROFILE);return ALL.filter(function(x){return sel.indexOf(x.n)>=0&&f(x)})}
function tooFew(){app.innerHTML='<h1>Pas assez de mots</h1><div class="cnt">Demande à un parent de cocher plus de leçons dans ⚙️ Paramètres → Réglages des jeux.</div><button class="btn" id="mn">Retour</button>';document.getElementById("mn").onclick=home}
function start(){mode=1;bk.style.display="block";var P=pool("dde",function(x){return x.a});if(P.length<3){tooFew();return}deck=shuffle(P).slice(0,TOTAL);i=0;good=0;showWord()}
function showWord(){
  var w=deck[i];missed=false;
  app.innerHTML=bar()+'<div class="word">'+w.w+'</div><button class="ear" id="ear" aria-label="Wiederholen">🔊</button><div class="pills"><button class="pill" data-a="der">der</button><button class="pill" data-a="die">die</button><button class="pill" data-a="das">das</button></div>';
  document.getElementById("ear").onclick=function(){say(w.w)};
  say(w.w);
  app.querySelectorAll(".pill").forEach(function(p){p.onclick=function(){
    if(p.dataset.a===w.a){if(!missed){good++;star(true,w)}app.querySelectorAll(".pill").forEach(function(x){x.disabled=true});p.classList.add("ok");say(w.a+" "+w.w);setTimeout(function(){i++;i<deck.length?showWord():end()},1500)}
    else{if(!missed)star(false,w);missed=true;p.classList.add("no","shake");p.disabled=true}}});
}
// Exercice 2 : trouve le mot
var POOL2=[];
function start2(){mode=2;bk.style.display="block";POOL2=pool("fdw",function(x){return x.e});if(POOL2.length<3){tooFew();return}deck=shuffle(POOL2).slice(0,TOTAL);i=0;good=0;show2()}
function show2(){
  var w=deck[i];missed=false;
  // propositions : d'abord des mots cochés du même type, sinon d'autres mots cochés, sinon le reste
  var ok=function(x){return x.e&&x.w!==w.w&&x.e!==w.e},others=[];
  [shuffle(POOL2.filter(function(x){return ok(x)&&!x.a===!w.a})),shuffle(POOL2.filter(function(x){return ok(x)&&!x.a!==!w.a})),shuffle(ALL.filter(ok))].forEach(function(L){L.forEach(function(x){if(others.length<2&&others.indexOf(x)<0)others.push(x)})});
  var ch=shuffle([w].concat(others));
  app.innerHTML=bar()+'<div class="pic">'+w.e+'</div><div class="pills col">'+ch.map(function(c){return '<button class="pill" data-w="'+c.w+'">'+(c.a?c.a+' ':'')+c.w+'</button>'}).join("")+'</div>';
  app.querySelectorAll(".pill").forEach(function(p){p.onclick=function(){
    if(p.dataset.w===w.w){if(!missed){good++;star(true,w)}app.querySelectorAll(".pill").forEach(function(x){x.disabled=true});p.classList.add("ok");say((w.a?w.a+" ":"")+w.w);setTimeout(function(){i++;i<deck.length?show2():end()},1500)}
    else{if(!missed)star(false,w);missed=true;p.classList.add("no","shake");p.disabled=true}}});
}
// Exercice 3 : écrire le mot (avec l'article pour les noms) au clavier
var KB=null;
function kb(o){if(KB)KB.destroy();KB=Clavier(o);document.body.classList.add("withkb")}
function nokb(){if(KB){KB.destroy();KB=null}document.body.classList.remove("withkb")}
function norm(t){return t.trim().replace(/\s+/g," ").toLowerCase()}
// affichage : majuscule au nom après l'article (en allemand, les noms prennent une majuscule)
function pretty(t,w){if(!w.a)return t;var m=t.match(/^(\s*\S+\s+)(\S)(.*)$/);return m?m[1]+m[2].toUpperCase()+m[3]:t}
function start3(){mode=3;bk.style.display="block";var P=pool("sdw",function(x){return x.e});if(P.length<3){tooFew();return}deck=shuffle(P).slice(0,10);i=0;good=0;show3()}
function show3(){
  var w=deck[i],full=(w.a?w.a+" ":"")+w.w,val="",tries=0,lock=false;missed=false;
  app.innerHTML=bar()+'<div class="pic">'+w.e+'</div><div class="typed" id="ty"> </div><div class="hint" id="hint">'+(w.a?"Écris le mot avec son article (der, die, das)":"Écris le mot")+'</div><div class="copy" id="copy"></div>';
  var ty=document.getElementById("ty"),hint=document.getElementById("hint");
  // taille des traits selon la longueur du mot (tout tient sur une ligne)
  var sw=Math.max(16,Math.min(34,Math.floor((Math.min(innerWidth,420)-30)/full.length)-5));
  ty.style.setProperty("--sw",sw+"px");ty.style.setProperty("--fs",Math.round(sw*1.05)+"px");ty.style.setProperty("--g",(sw<22?3:5)+"px");
  function paint(cls){var pv=pretty(val,w),h="";
   for(var k=0;k<full.length;k++)h+=full[k]===" "?'<span class="sp"></span>':'<span class="l'+(!cls&&k===val.length?" cur":"")+'">'+(k<pv.length?pv[k]:"")+"</span>";
   ty.className="typed"+(cls?" "+cls:"");ty.innerHTML=h}
  paint();
  kb({acc:"äöüß",space:true,
    // l'espace se place tout seul quand on arrive au trou entre l'article et le mot
    onKey:function(k){if(lock||val.length>=full.length)return;
      if(k===" "){if(full[val.length]===" ")val+=" ";paint();return}
      if(full[val.length]===" ")val+=" ";val+=k;paint()},
    onDel:function(){if(lock)return;val=val.slice(0,-1);if(val.slice(-1)===" ")val=val.slice(0,-1);paint()},
    onOk:function(){if(lock||!val.trim())return;var v=norm(val),t=norm(full);
      if(v===t){lock=true;KB.enable(false);if(!missed){good++;star(true,w)}val=full.toLowerCase();paint("ok");hint.textContent="Super!";document.getElementById("copy").textContent="";
        say(full);setTimeout(function(){i++;i<deck.length?show3():end()},1800);return}
      if(!missed)star(false,w);missed=true;tries++;lock=true;paint("ko shake");
      var p=v.split(" "),noun=norm(w.w);
      hint.textContent=w.a&&p.length===1&&p[0]===noun?"Le mot est juste : n'oublie pas l'article !":w.a&&p.length>1&&p.slice(1).join(" ")===noun?"Le mot est juste, mais pas l'article !":w.a&&p[0]===w.a?"Bon article ! Vérifie le mot.":"Essaie encore !";
      if(tries>=2)say(full);
      if(tries>=3)document.getElementById("copy").innerHTML="Recopie : <b>"+full+"</b>";
      setTimeout(function(){lock=false;val="";paint()},900)}});
}
function end(){nokb();try{if(parent!==window)parent.postMessage({type:"roundEnd"},"*")}catch(e){}
  var n=Math.round(good/deck.length*10*2)/2,s=String(n).replace(".",",");
  app.innerHTML='<h1>Fertig!</h1><div class="big">'+s+' / 10</div><div class="cnt">'+good+' / '+deck.length+'</div><button class="btn" id="re">Nochmal</button><button class="btn btn2" id="mn">Menü</button>';
  document.getElementById("re").onclick=function(){mode==3?start3():mode==2?start2():start()};
  document.getElementById("mn").onclick=home;
  say("Fertig! "+s+" von zehn");
}
window.START==3?start3():window.START==2?start2():window.START==1?start():home();
</script>
