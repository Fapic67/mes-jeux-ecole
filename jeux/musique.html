<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trouve la note</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eefaf9;--fg:#173b3a;--mut:#4f7a78;--card:#fff;--bd:#cdeae7;--mu:#13a8a8;--cur:#7a4dff;--ok:#22a861;--bad:#e5484d;--ink:#173b3a;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#10201f;--fg:#e8fbf9;--mut:#9cc7c3;--card:#1a2e2d;--bd:#2c4a48;--ink:#e8fbf9}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;user-select:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#wrap{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#inner{max-width:480px;min-height:100%;margin:0 auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:20px}
#cnt{color:var(--mut);font-size:18px}
.bar{height:14px;background:var(--bd);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mu);transition:width .3s}
#staff{background:var(--card);border:3px solid var(--bd);border-radius:22px;padding:6px 4px}
#staff svg{display:block;width:100%;height:auto}
#msg{min-height:30px;text-align:center;font-size:22px;font-weight:700}
#pills{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#pills button{height:68px;border:4px solid var(--bd);border-radius:999px;background:var(--card);color:var(--fg);font-size:26px;font-weight:700;box-shadow:0 4px 0 var(--bd)}
#pills button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
#pills button.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:none}
#pills button.no{border-color:var(--bad);color:var(--bad);opacity:.5;box-shadow:none;animation:sh .3s}
#pills button:disabled{cursor:default}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#end{display:flex;flex-direction:column;gap:12px;text-align:center}
#title{font-size:28px;font-weight:700;color:var(--mu)}
.btn{height:64px;border:0;border-radius:18px;font-size:22px;font-weight:700;color:#fff;background:var(--mu);box-shadow:0 5px 0 #0c7d7d}
.btn.alt{background:var(--card);color:var(--fg);border:3px solid var(--bd);box-shadow:none}
#hd{display:flex;align-items:center;gap:10px}
.gear{width:56px;height:56px;border:3px solid var(--bd);border-radius:16px;background:var(--card);color:var(--fg);font-size:26px;line-height:1;padding:0}
.sheet{position:fixed;inset:0;background:rgba(10,8,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.panel{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:26px}
.panel h3{margin:0;font-size:19px;color:var(--mut)}
.opt{min-height:72px;border:3px solid var(--bd);background:var(--card);color:var(--fg);border-radius:20px;padding:10px 16px;text-align:left;font-size:22px;font-weight:700}
.opt small{display:block;font-size:16px;font-weight:500;color:var(--mut)}
.opt.on{border-color:var(--mu);background:var(--mu);color:#fff}.opt.on small{color:#fff}
.btn:disabled{opacity:.5}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="wrap"><div id="inner">
<header><span>🎵 Morceau mystère</span><span id="hd"><span id="cnt"></span><button class="gear" id="gear" aria-label="Réglages">⚙️</button></span></header>
<div class="bar"><i id="prog"></i></div>
<div id="staff"></div>
<div id="msg"></div>
<div id="pills"></div>
<div id="end" hidden>
  <div id="title"></div>
  <button class="btn" id="replay">▶ Réécouter</button>
  <button class="btn alt" id="next">Morceau suivant ➜</button>
</div>
</div></div>
<div class="sheet" id="sheet" hidden><div class="panel">
  <h2>Réglages</h2>
  <h3>Difficulté</h3>
  <div id="nivs" style="display:flex;flex-direction:column;gap:10px"></div>
  <h3>Clé principale</h3>
  <div id="opts" style="display:flex;flex-direction:column;gap:10px"></div>
  <button class="btn" id="close">Jouer</button>
</div></div>

// Difficulté : facile = début de l'air (version d'origine), moyen = air complet (2 à 4 fois plus long)

var CLES={sol:{base:4*7+2,tr:0},fa:{base:2*7+4,tr:-1}};
var cle=ls("mus_cle")==="fa"?"fa":"sol";
function pos(n){return n.o*7+ORDER.indexOf(n.l)-CLES[cle].base} // 0 = ligne du bas de la clé active

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

/* son façon piano */
var ac=null;function ctx(){if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}if(ac&&ac.state==="suspended")ac.resume();return ac}

 g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.35,s+.01);g.gain.exponentialRampToValueAtTime(.12,s+.25);g.gain.exponentialRampToValueAtTime(.0001,s+Math.max(.4,d));

function drawStaff(notes,from,cur,showAll){

/* partie */
var order=JSON.parse(ls("mus_order")||"null"),song,idx,errs,missed,lock,playing=false,tk=0;
if(!order||order.length!==SONGS.length){order=SONGS.map(function(_,i){return i}).sort(function(){return Math.random()-.5})}

var csi=si;function startSong(i){csi=i===undefined?si:i;var S=SONGS[order[csi]],tr=CLES[cle].tr;song={t:S.t,n:(niv==="moyen"?S.m:S.n).map(function(n){return{l:n.l,o:n.o+tr,d:n.d}})};idx=0;errs=0;lock=false;$("end").hidden=true;$("pills").hidden=false;msg("Quelle est cette note ?");show()}

$("pills").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||lock||b.disabled)return;var n=song.n[idx];
 if(b.dataset.l===n.l){lock=true;if(!missed)answer(true,n);b.classList.add("ok");play(freq(n),0,.6);msg("Bravo, c'est un "+NAME[n.l]+" !");var my=tk;
  setTimeout(function(){if(my!==tk)return;idx++;lock=false;if(idx<song.n.length){msg("Quelle est cette note ?");show()}else finish()},750)}
 else{errs++;if(!missed)answer(false,n);missed=true;b.classList.add("no");b.disabled=true;buzz();msg("Essaie encore !")}});
function finish(){$("prog").style.width="100%";$("pills").hidden=true;$("end").hidden=false;$("title").textContent="🎶 "+song.t;
 msg(errs?"Tu as trouvé toutes les notes !":"Parfait, aucune erreur !");
 si=(si+1)%SONGS.length;ls("mus_i",si);ls("mus_order",JSON.stringify(order));
 lockReplay(true);var my=tk;setTimeout(function(){if(my===tk)playSong()},700)} // pas de voix : le titre est seulement affiché
// « Réécouter » est bloqué tant que le morceau joue
function lockReplay(on){var b=$("replay");b.disabled=on;b.textContent=on?"🎵 Écoute…":"▶ Réécouter"}
function playSong(){if(playing&&tk)return;var my=++tk,beat=.5,t=0,k=0;playing=true;lockReplay(true);
 song.n.forEach(function(n){play(freq(n),t,n.d*beat*.95);t+=n.d*beat});
 (function hl(){if(my!==tk||k>=song.n.length){if(my===tk){playing=false;lockReplay(false);drawStaff(song.n,Math.max(0,song.n.length-WIN),-1,true)}return}
  drawStaff(song.n,Math.max(0,k-WIN+1),k,true);var d=song.n[k].d*beat*1000;k++;setTimeout(hl,d)})()}
$("replay").onclick=function(){if(playing||this.disabled)return;ctx();playSong()};
$("next").onclick=function(){tk++;playing=false;lockReplay(false);startSong()};
/* réglages : clé principale */
var CLE_TXT={sol:["Clé de sol","Notes aiguës"],fa:["Clé de fa","Notes graves"]};
function opts(){$("opts").innerHTML=["sol","fa"].map(function(c){return '<button class="opt'+(c===cle?" on":"")+'" data-c="'+c+'">'+CLE_TXT[c][0]+"<small>"+CLE_TXT[c][1]+"</small></button>"}).join("")}
var NIV_TXT={facile:["Facile","Le début de l'air"],moyen:["Moyen","L'air en entier (2 à 4 fois plus long)"]};
function nivs(){$("nivs").innerHTML=["facile","moyen"].map(function(c){return '<button class="opt'+(c===niv?" on":"")+'" data-n="'+c+'">'+NIV_TXT[c][0]+"<small>"+NIV_TXT[c][1]+"</small></button>"}).join("")}
$("nivs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||b.dataset.n===niv)return;niv=b.dataset.n;ls("mus_niv",niv);nivs();tk++;playing=false;lockReplay(false);startSong(csi)});
$("gear").onclick=function(){opts();nivs();$("sheet").hidden=false};
$("opts").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||b.dataset.c===cle)return;
 cle=b.dataset.c;ls("mus_cle",cle);opts();tk++;startSong(csi)});
$("close").onclick=function(){$("sheet").hidden=true};
startSong();
})();
// Bouton retour du téléphone : ferme d'abord les réglages
window.hubBack=function(){var s=document.getElementById("sheet");if(s&&!s.hidden){s.hidden=true;return true}return false};
