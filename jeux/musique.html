<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trouve la note</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eefaf9;--fg:#173b3a;--mut:#4f7a78;--card:#fff;--bd:#cdeae7;--mu:#13a8a8;--cur:#7a4dff;--ok:#22a861;--bad:#e5484d;--ink:#173b3a;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#10201f;--fg:#e8fbf9;--mut:#9cc7c3;--card:#1a2e2d;--bd:#2c4a48;--ink:#e8fbf9}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;user-select:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#wrap{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#inner{max-width:480px;min-height:100%;margin:0 auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:20px}
#cnt{color:var(--mut);font-size:18px}
.bar{height:14px;background:var(--bd);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mu);transition:width .3s}
#staff{background:var(--card);border:3px solid var(--bd);border-radius:22px;padding:6px 4px}
#staff svg{display:block;width:100%;height:auto}
#msg{min-height:30px;text-align:center;font-size:22px;font-weight:700}
#pills{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#pills button{height:68px;border:4px solid var(--bd);border-radius:999px;background:var(--card);color:var(--fg);font-size:26px;font-weight:700;box-shadow:0 4px 0 var(--bd)}
#pills button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
#pills button.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:none}
#pills button.no{border-color:var(--bad);color:var(--bad);opacity:.5;box-shadow:none;animation:sh .3s}
#pills button:disabled{cursor:default}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#end{display:flex;flex-direction:column;gap:12px;text-align:center}
#title{font-size:28px;font-weight:700;color:var(--mu)}
.btn{height:64px;border:0;border-radius:18px;font-size:22px;font-weight:700;color:#fff;background:var(--mu);box-shadow:0 5px 0 #0c7d7d}
.btn.alt{background:var(--card);color:var(--fg);border:3px solid var(--bd);box-shadow:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="wrap"><div id="inner">
<header><span>🎵 Morceau mystère</span><span id="cnt"></span></header>
<div class="bar"><i id="prog"></i></div>
<div id="staff"></div>
<div id="msg"></div>
<div id="pills"></div>
<div id="end" hidden>
  <div id="title"></div>
  <button class="btn" id="replay">▶ Réécouter</button>
  <button class="btn alt" id="next">Morceau suivant ➜</button>
</div>
</div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
/* Airs traditionnels / domaine public. Format : note+octave:durée (en temps) */
var SONGS=[
 {t:"Au clair de la lune",n:"C4:1 C4:1 C4:1 D4:1 E4:2 D4:2 C4:1 E4:1 D4:1 D4:1 C4:4"},
 {t:"Frère Jacques",n:"C4:1 D4:1 E4:1 C4:1 C4:1 D4:1 E4:1 C4:1 E4:1 F4:1 G4:2 E4:1 F4:1 G4:2"},
 {t:"Ah ! vous dirai-je, maman",n:"C4:1 C4:1 G4:1 G4:1 A4:1 A4:1 G4:2 F4:1 F4:1 E4:1 E4:1 D4:1 D4:1 C4:2"},
 {t:"Joyeux anniversaire",n:"G4:0.75 G4:0.25 A4:1 G4:1 C5:1 B4:2 G4:0.75 G4:0.25 A4:1 G4:1 D5:1 C5:2"},
 {t:"L'Ode à la joie",n:"E4:1 E4:1 F4:1 G4:1 G4:1 F4:1 E4:1 D4:1 C4:1 C4:1 D4:1 E4:1 E4:1.5 D4:0.5 D4:2"}
].map(function(s){return{t:s.t,n:s.n.split(" ").map(function(x){var p=x.split(":");return{l:p[0][0],o:+p[0][1],d:+p[1]}})}});
var NAME={C:"do",D:"ré",E:"mi",F:"fa",G:"sol",A:"la",B:"si"},ORDER="CDEFGAB",SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function pos(n){return(n.o-4)*7+ORDER.indexOf(n.l)-2} // 0 = mi (ligne du bas)
function freq(n){return 440*Math.pow(2,((n.o+1)*12+SEMI[n.l]-69)/12)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

/* son façon piano */
var ac=null;function ctx(){if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}if(ac&&ac.state==="suspended")ac.resume();return ac}
function play(f,t,d){var a=ctx();if(!a)return;var s=a.currentTime+t,g=a.createGain();g.connect(a.destination);
 g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.35,s+.01);g.gain.exponentialRampToValueAtTime(.12,s+.25);g.gain.exponentialRampToValueAtTime(.0001,s+Math.max(.4,d));
 [[1,"triangle",1],[2,"sine",.35],[3,"sine",.12]].forEach(function(h){var o=a.createOscillator(),og=a.createGain();o.type=h[1];o.frequency.value=f*h[0];og.gain.value=h[2];o.connect(og);og.connect(g);o.start(s);o.stop(s+Math.max(.4,d)+.05)})}
function buzz(){var a=ctx();if(!a)return;var o=a.createOscillator(),g=a.createGain(),s=a.currentTime;o.type="sawtooth";o.frequency.value=140;g.gain.setValueAtTime(.12,s);g.gain.exponentialRampToValueAtTime(.0001,s+.25);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+.3)}
var voice=null;function pick(){try{voice=speechSynthesis.getVoices().filter(function(v){return /^fr/i.test(v.lang)})[0]||null}catch(e){}}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voice)u.voice=voice;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function star(n){try{if(parent!==window)parent.postMessage({type:"stars",n:n},"*")}catch(e){}}

/* portée (clé de sol), fenêtre de 6 notes */
var W=360,H=150,G=12,BOT=96,X0=64,STEP=50,WIN=6;
function y(p){return BOT-p*G/2}
var CLEF='<path transform="translate(0 11)" d="M31 112c-6 4-13 0-12-6 1-5 8-6 10-1M29 106 30 20c0-7 9-11 11-3 3 11-6 21-16 30C15 56 11 64 13 74c3 12 20 16 28 7 7-8 2-21-9-21-8 0-13 8-9 14" fill="none" stroke="var(--ink)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>';
function noteSvg(n,x,col,label){var p=pos(n),cy=y(p),h="";
 for(var lp=-2;lp>=p;lp-=2)h+='<line x1="'+(x-15)+'" x2="'+(x+15)+'" y1="'+y(lp)+'" y2="'+y(lp)+'" stroke="var(--ink)" stroke-width="2"/>';
 for(lp=10;lp<=p;lp+=2)h+='<line x1="'+(x-15)+'" x2="'+(x+15)+'" y1="'+y(lp)+'" y2="'+y(lp)+'" stroke="var(--ink)" stroke-width="2"/>';
 var up=p<4;h+='<line x1="'+(up?x+7.6:x-7.6)+'" x2="'+(up?x+7.6:x-7.6)+'" y1="'+cy+'" y2="'+(up?cy-38:cy+38)+'" stroke="'+col+'" stroke-width="2.6"/>';
 h+='<ellipse cx="'+x+'" cy="'+cy+'" rx="8.6" ry="6.2" transform="rotate(-20 '+x+' '+cy+')" fill="'+col+'"/>';
 if(label)h+='<text x="'+x+'" y="'+(H-6)+'" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="16" fill="'+col+'">'+label+'</text>';
 return h}
function drawStaff(notes,from,cur,showAll){
 var h='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Portée">';
 for(var l=0;l<5;l++)h+='<line x1="6" x2="'+(W-6)+'" y1="'+y(l*2)+'" y2="'+y(l*2)+'" stroke="var(--ink)" stroke-width="1.6" opacity=".75"/>';
 h+=CLEF;
 for(var k=from,i=0;k<notes.length&&i<WIN;k++,i++){var n=notes[k],isCur=k===cur;if(!showAll&&k>cur)break;
  h+=noteSvg(n,X0+i*STEP+10,isCur?"var(--cur)":"var(--ok)",(k<cur||showAll)?NAME[n.l]:"")}
 $("staff").innerHTML=h+"</svg>"}

/* partie */
var order=JSON.parse(ls("mus_order")||"null"),song,idx,errs,missed,lock,playing=false,tk=0;
if(!order||order.length!==SONGS.length){order=SONGS.map(function(_,i){return i}).sort(function(){return Math.random()-.5})}
var si=Math.max(0,parseInt(ls("mus_i"))||0)%SONGS.length;
function startSong(){song=SONGS[order[si]];idx=0;errs=0;lock=false;$("end").hidden=true;$("pills").hidden=false;msg("Quelle est cette note ?");show()}
function msg(t){$("msg").textContent=t}
function show(){missed=false;$("cnt").textContent=(idx+1)+" / "+song.n.length;$("prog").style.width=(idx/song.n.length*100)+"%";
 drawStaff(song.n,Math.max(0,idx-WIN+1),idx,false);
 $("pills").innerHTML=ORDER.split("").map(function(l){return '<button data-l="'+l+'">'+NAME[l]+"</button>"}).join("")}
$("pills").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||lock||b.disabled)return;var n=song.n[idx];
 if(b.dataset.l===n.l){lock=true;b.classList.add("ok");play(freq(n),0,.6);msg("Bravo, c'est un "+NAME[n.l]+" !");
  setTimeout(function(){idx++;lock=false;if(idx<song.n.length){msg("Quelle est cette note ?");show()}else finish()},750)}
 else{errs++;b.classList.add("no");b.disabled=true;buzz();msg("Essaie encore !")}});
function finish(){$("prog").style.width="100%";$("pills").hidden=true;$("end").hidden=false;$("title").textContent="🎶 "+song.t;
 msg(errs?"Tu as trouvé toutes les notes !":"Parfait, aucune erreur !");star(errs?3:5);
 si=(si+1)%SONGS.length;ls("mus_i",si);ls("mus_order",JSON.stringify(order));
 say("C'était "+song.t+" !");setTimeout(playSong,1600)}
function playSong(){var my=++tk,beat=.5,t=0,k=0;playing=true;
 song.n.forEach(function(n){play(freq(n),t,n.d*beat*.95);t+=n.d*beat});
 (function hl(){if(my!==tk||k>=song.n.length){if(my===tk){playing=false;drawStaff(song.n,Math.max(0,song.n.length-WIN),-1,true)}return}
  drawStaff(song.n,Math.max(0,k-WIN+1),k,true);var d=song.n[k].d*beat*1000;k++;setTimeout(hl,d)})()}
$("replay").onclick=function(){ctx();playSong()};
$("next").onclick=function(){tk++;startSong()};
startSong();
})();
</script>
</body>
</html>
