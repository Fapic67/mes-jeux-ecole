<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le jardin glissant</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef8f1;--fg:#1d3326;--mut:#5a7564;--card:#fff;--bd:#cfe6d6;--ice:#dff3ff;--ice2:#c6e8fb;--jx:#ff8a3d;--ok:#22a861;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#122019;--fg:#eaf7ef;--mut:#9fbfab;--card:#1c2e24;--bd:#2f4a3a;--ice:#22394a;--ice2:#2a4558}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;user-select:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;color:inherit}
#wrap{position:fixed;inset:0;overflow-y:auto;touch-action:pan-y}
#inner{max-width:480px;margin:0 auto;padding:10px 12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:8px}
#info{flex:1;font-size:17px;color:var(--mut);font-weight:600}
.hb{min-height:56px;padding:0 14px;border:3px solid var(--bd);background:var(--card);border-radius:16px;font-weight:700;font-size:18px;white-space:nowrap}
#board{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:1;border-radius:18px;background:var(--ice);padding:6px;display:grid;gap:4px;touch-action:none;box-shadow:inset 0 0 0 3px var(--bd)}
.c{border-radius:10px;background:var(--ice2);display:flex;align-items:center;justify-content:center;font-size:var(--fs);line-height:1}
.c.rock{background:transparent}
.c.trail{background:color-mix(in srgb,var(--ice2) 60%,#ffd447)}
#hog{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs);line-height:1;pointer-events:none;z-index:2;transition:transform .2s cubic-bezier(.3,.1,.5,1)}
#hog.win{animation:win .8s}
@keyframes win{30%{scale:1.4;rotate:-15deg}60%{scale:1.2;rotate:15deg}}
#hog.bump{animation:bump .25s}
@keyframes bump{50%{scale:1.15 .85}}
#msg{min-height:30px;text-align:center;font-size:21px;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,64px);gap:8px;max-width:300px;margin:0 auto;width:100%}
.pad button{border:0;border-radius:18px;background:var(--jx);color:#fff;font-size:34px;font-weight:700;box-shadow:0 5px 0 #d9601a}
.pad button:active{transform:translateY(3px);box-shadow:0 2px 0 #d9601a}
.pad [data-d=U]{grid-column:2}.pad [data-d=L]{grid-column:1;grid-row:2}.pad [data-d=D]{grid-column:2;grid-row:2}.pad [data-d=R]{grid-column:3;grid-row:2}
.tools{display:flex;gap:8px}.tools button{flex:1;min-height:56px;border:3px solid var(--bd);border-radius:16px;background:var(--card);font-size:18px;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(10,30,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.panel{background:var(--bg);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.panel h2{margin:0;font-size:28px}
.stars{font-size:46px;letter-spacing:4px}.stars i{font-style:normal;opacity:.2}.stars i.on{opacity:1}
.big{width:100%;min-height:62px;border:0;border-radius:999px;background:var(--jx);color:#fff!important;font-size:22px;font-weight:700;box-shadow:0 5px 0 #d9601a}
.big.alt{background:var(--card);color:var(--fg)!important;border:3px solid var(--bd);box-shadow:none}
#lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
#lvls button{height:56px;border:3px solid var(--bd);border-radius:14px;background:var(--card);font-size:20px;font-weight:700}
#lvls button.on{background:var(--jx);border-color:var(--jx);color:#fff}
#lvls small{display:block;font-size:11px;color:#ffb800}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="wrap"><div id="inner">
<header><div id="info"></div><button class="hb" id="lvlb">Niveau 1</button></header>
<div id="board"></div>
<div id="msg"></div>
<div class="pad"><button data-d="U" aria-label="Haut">↑</button><button data-d="L" aria-label="Gauche">←</button><button data-d="D" aria-label="Bas">↓</button><button data-d="R" aria-label="Droite">→</button></div>
<div class="tools"><button id="undo">↶ Recommencer</button><button id="hint">💡 Indice</button></div>
</div></div>

<div class="sheet" id="won" hidden><div class="panel">
  <h2>🍓 Miam !</h2><div class="stars" id="w-st"></div><div id="w-t" style="font-size:19px;color:var(--mut);font-weight:600"></div>
  <button class="big" id="w-next">Niveau suivant ➜</button><button class="big alt" id="w-re">Refaire en moins de coups</button>
</div></div>
<div class="sheet" id="pick" hidden><div class="panel">
  <h2>Choisis un niveau</h2><div id="lvls"></div><button class="big alt" id="p-close">Fermer</button>
</div></div>
<script>
(function(){
// Jeu à gagner dans les cadeaux (matière Jeux : pas d'étoiles). Le hérisson glisse sur la glace jusqu'à un obstacle :
// il faut l'arrêter sur la fraise. Fait travailler l'anticipation et la planification (niveaux générés, toujours faisables, nombre minimal de coups calculé).
var $=function(i){return document.getElementById(i)};
var PK=window.PROFILE?"@"+window.PROFILE:"";
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function rnd(n){return Math.floor(Math.random()*n)}
var ac=null;function tone(f,t,d,v){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C()}if(ac.state==="suspended")ac.resume();var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+(t||0);o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.18,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+(d||.15));o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+(d||.15)+.05)}catch(e){}}
var DIR={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]},ARW={U:"↑",D:"↓",L:"←",R:"→"};
var level=Math.max(1,parseInt(ls("glissant_lvl"+PK))||1),best=Math.max(level,parseInt(ls("glissant_best"+PK))||1);
var rate=JSON.parse(ls("glissant_rate"+PK)||"{}");
var N,rock,start,goal,pos,moves,opt,busy=false,done=false,hints=0;
function key(x,y){return x+","+y}
function blocked(x,y){return x<0||y<0||x>=N||y>=N||rock[key(x,y)]}
function slide(x,y,d){var v=DIR[d],n=0;while(!blocked(x+v[0],y+v[1])){x+=v[0];y+=v[1];n++}return{x:x,y:y,n:n}}
// plus court chemin en glissades (BFS) ; renvoie {dist, first} depuis (x,y)
function solve(sx,sy){var q=[[sx,sy]],prev={},k0=key(sx,sy);prev[k0]=null;
 while(q.length){var p=q.shift(),k=key(p[0],p[1]);if(p[0]===goal[0]&&p[1]===goal[1]){var path=[],c=k;while(prev[c]){path.unshift(prev[c].d);c=prev[c].k}return{dist:path.length,path:path}}
  for(var d in DIR){var s=slide(p[0],p[1],d);if(!s.n)continue;var nk=key(s.x,s.y);if(nk in prev)continue;prev[nk]={k:k,d:d};q.push([s.x,s.y])}}return null}
function want(L){return L<=2?2:L<=5?3:L<=9?4:L<=14?5:L<=20?6:7}
function gen(L){N=L<=4?5:L<=10?6:7;var dens=L<=2?.12:L<=8?.17:.2,w=want(L),bestTry=null;
 for(var t=0;t<4000;t++){rock={};var nr=Math.round(N*N*dens);for(var i=0;i<nr;i++)rock[key(rnd(N),rnd(N))]=1;
  start=[rnd(N),rnd(N)];goal=[rnd(N),rnd(N)];if(rock[key(start[0],start[1])]||rock[key(goal[0],goal[1])]||key(start[0],start[1])===key(goal[0],goal[1]))continue;
  var s=solve(start[0],start[1]);if(!s||s.dist<2)continue;
  if(s.dist===w||s.dist===w+1&&t>2500){opt=s.dist;return}
  if(!bestTry||Math.abs(s.dist-w)<Math.abs(bestTry.d-w))bestTry={d:s.dist,rock:rock,start:start,goal:goal}}
 rock=bestTry.rock;start=bestTry.start;goal=bestTry.goal;opt=bestTry.d}
// taille d'une case : plateau (marge 6 px) avec 4 px entre les cases
function cell(){return ($("board").clientWidth-12-4*(N-1))/N}
function placeHog(x,y,ms){var c=cell(),st=c+4,h=$("hog");h.style.transition=ms?"transform "+ms+"ms cubic-bezier(.3,.1,.5,1)":"none";h.style.width=h.style.height=c+"px";h.style.transform="translate("+(6+x*st)+"px,"+(6+y*st)+"px)"}
function draw(){var b=$("board"),h="";b.style.gridTemplateColumns=b.style.gridTemplateRows="repeat("+N+",minmax(0,1fr))";b.style.setProperty("--fs",(N<=5?40:N===6?34:30)+"px");
 for(var y=0;y<N;y++)for(var x=0;x<N;x++){var k=key(x,y);h+='<div class="c'+(rock[k]?" rock":"")+'" data-k="'+k+'">'+(rock[k]?"🪨":(x===goal[0]&&y===goal[1])?"🍓":"")+"</div>"}
 b.innerHTML=h+'<div id="hog">🦔</div>';requestAnimationFrame(function(){placeHog(pos[0],pos[1],0)})}
function info(){$("info").textContent="Coups : "+moves+" · le meilleur : "+opt;$("lvlb").textContent="Niveau "+level}
function newLevel(){gen(level);restart()}
function restart(){pos=start.slice();moves=0;done=false;busy=false;hints=0;$("msg").textContent=level===1?"Le hérisson glisse jusqu'à un rocher. Arrête-le sur la fraise !":"";draw();info()}
function go(d){if(busy||done)return;var s=slide(pos[0],pos[1],d),h=$("hog");
 if(!s.n){h.classList.remove("bump");void h.offsetWidth;h.classList.add("bump");tone(200,0,.1,.12);return}
 busy=true;moves++;info();$("msg").textContent="";
 for(var i=1;i<=s.n;i++){var c=document.querySelector('.c[data-k="'+key(pos[0]+DIR[d][0]*i,pos[1]+DIR[d][1]*i)+'"]');if(c)c.classList.add("trail")}
 var ms=Math.min(600,90*s.n+80);placeHog(s.x,s.y,ms);tone(520,0,ms/1000,.08);
 setTimeout(function(){pos=[s.x,s.y];busy=false;document.querySelectorAll(".c.trail").forEach(function(c){c.classList.remove("trail")});
  if(pos[0]===goal[0]&&pos[1]===goal[1])win();else{h.classList.remove("bump");void h.offsetWidth;h.classList.add("bump")}},ms)}
function win(){done=true;var h=$("hog");h.classList.add("win");[523,659,784,1047].forEach(function(f,k){tone(f,k*.1,.25,.2)});
 var st=moves<=opt?3:moves<=opt+2?2:1;if(hints)st=Math.min(st,2);
 rate[level]=Math.max(rate[level]||0,st);ls("glissant_rate"+PK,JSON.stringify(rate));
 if(level>=best){best=level+1;ls("glissant_best"+PK,best)}
 $("w-st").innerHTML=[1,2,3].map(function(i){return'<i class="'+(i<=st?"on":"")+'">⭐</i>'}).join("");
 $("w-t").textContent=st===3?"Parfait : "+moves+" coup"+(moves>1?"s":"")+", le minimum !":"En "+moves+" coups. C'est possible en "+opt+" !";
 $("w-re").hidden=st===3;setTimeout(function(){$("won").hidden=false},700);
 try{if(parent!==window)parent.postMessage({type:"roundEnd"},"*")}catch(e){}}
$("w-next").onclick=function(){$("won").hidden=true;level++;ls("glissant_lvl"+PK,level);newLevel()};
$("w-re").onclick=function(){$("won").hidden=true;restart()};
document.querySelector(".pad").addEventListener("click",function(e){var b=e.target.closest("[data-d]");if(b)go(b.dataset.d)});
$("undo").onclick=function(){if(!busy)restart()};
$("hint").onclick=function(){if(busy||done)return;var s=solve(pos[0],pos[1]);if(!s)return;hints++;var d=s.path[0];$("msg").textContent="💡 Essaie : "+ARW[d];
 var b=document.querySelector('.pad [data-d="'+d+'"]');b.animate([{transform:"scale(1)"},{transform:"scale(1.2)"},{transform:"scale(1)"}],{duration:500,iterations:2})};
// glisser le doigt sur le plateau
(function(){var sx=null,sy=null,b=$("board");b.addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY});
 b.addEventListener("pointerup",function(e){if(sx==null)return;var dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;go(Math.abs(dx)>Math.abs(dy)?(dx>0?"R":"L"):(dy>0?"D":"U"))})})();
document.addEventListener("keydown",function(e){var m={ArrowUp:"U",ArrowDown:"D",ArrowLeft:"L",ArrowRight:"R"}[e.key];if(m){e.preventDefault();go(m)}});
window.addEventListener("resize",function(){if(pos)placeHog(pos[0],pos[1],0)});
// choix du niveau
$("lvlb").onclick=function(){var h="";for(var i=1;i<=best;i++)h+='<button data-l="'+i+'" class="'+(i===level?"on":"")+'">'+i+(rate[i]?"<small>"+"★".repeat(rate[i])+"</small>":"")+"</button>";$("lvls").innerHTML=h;$("pick").hidden=false};
$("lvls").onclick=function(e){var b=e.target.closest("[data-l]");if(!b)return;level=+b.dataset.l;ls("glissant_lvl"+PK,level);$("pick").hidden=true;newLevel()};
$("p-close").onclick=function(){$("pick").hidden=true};
window.hubBack=function(){if(!$("pick").hidden){$("pick").hidden=true;return true}if(!$("won").hidden){$("won").hidden=true;return true}return false};
newLevel();
})();
</script>
</body>
</html>
