<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lerne neue Wörter</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="jeux/allemand-mots.js"></script>
<style>
:root{--bg:#fff8ec;--fg:#2b2440;--mut:#6c6487;--card:#fff;--bd:#eadfc8;--de:#e0a100;--der:#3f7de0;--die:#e0457b;--das:#2aa36b;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a2b;--fg:#f3effa;--mut:#b4abcc;--card:#2a2640;--bd:#3d3758}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;user-select:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#inner{position:fixed;inset:0;max-width:560px;margin:0 auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
#card{flex:1;min-height:0;border:3px solid var(--bd);background:var(--card);border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;padding:16px;color:var(--fg)}
#pic{font-size:min(38vw,30vh,190px);line-height:1}
#pic img,#pic svg{display:block}
#word{font-size:min(11vw,48px);font-weight:700;text-align:center;line-height:1.15;overflow-wrap:anywhere}
#word i{font-style:normal;margin-right:.25em}
#word i.der{color:var(--der)}#word i.die{color:var(--die)}#word i.das{color:var(--das)}
#card.pop{animation:pop .35s}
@keyframes pop{0%{transform:translateX(40px);opacity:0}100%{transform:none;opacity:1}}
.row{display:flex;align-items:center;gap:12px}
#cnt{flex:1;color:var(--mut);font-size:18px;font-weight:600;padding-left:6px}
#next{width:96px;height:72px;border:0;border-radius:22px;background:var(--de);color:#fff;box-shadow:0 5px 0 #a87800;display:flex;align-items:center;justify-content:center}
#next:active{transform:translateY(3px);box-shadow:0 2px 0 #a87800}
#next svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
#empty{margin:auto;text-align:center;font-size:20px;color:var(--mut)}
</style>
</head>
<body>
<div id="inner">
  <button id="card" aria-label="Noch einmal hören"><div id="pic"></div><div id="word"></div></button>
  <div class="row"><span id="cnt"></span><button id="next" aria-label="Weiter"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 5.5 19.5 12 13 18.5"/></svg></button></div>
</div>
<script>
(function(){
// Lerne neue Wörter : apprentissage (sans étoiles) des mots du dictionnaire hors manuel illustrés (DE_NEW, allemand-mots.js).
// L'image, le mot avec son article, la voix allemande ; → mot suivant. Ordre mélangé une fois et position gardés par profil.
var $=function(i){return document.getElementById(i)};
var PK="@"+(window.PROFILE||"p1");
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function voiceFor(l){try{return speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.indexOf(l)===0})[0]||null}catch(e){return null}}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="de-DE";var v=voiceFor("de");if(v)u.voice=v;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
var W={};DE_NEW.forEach(function(x){W[x.w]=x});
// ordre : mots déjà mélangés gardés, mots nouveaux ajoutés au hasard à la fin
var ord=[];try{ord=JSON.parse(ls("lerne_ord"+PK))||[]}catch(e){}
ord=ord.filter(function(w){return W[w]});var inO={};ord.forEach(function(w){inO[w]=1});
ord=ord.concat(shuffle(DE_NEW.filter(function(x){return !inO[x.w]}).map(function(x){return x.w})));
ls("lerne_ord"+PK,JSON.stringify(ord));
var i=(parseInt(ls("lerne_i"+PK))||0)%Math.max(1,ord.length);
function full(x){return(x.a?x.a+" ":"")+x.w}
function show(){
 if(!ord.length){$("card").innerHTML='<div id="empty">Keine Wörter</div>';$("next").hidden=true;return}
 var x=W[ord[i]];$("pic").innerHTML=x.e;
 $("word").innerHTML=(x.a?'<i class="'+x.a+'">'+x.a+"</i>":"")+x.w;
 $("cnt").textContent=(i+1)+" / "+ord.length;
 var c=$("card");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");
 setTimeout(function(){say(full(x))},250)}
$("card").onclick=function(){if(ord.length)say(full(W[ord[i]]))};
$("next").onclick=function(){i=(i+1)%ord.length;ls("lerne_i"+PK,i);
 try{if(parent!==window)parent.postMessage({type:"roundEnd"},"*")}catch(e){} // un mot vu = une manche (parcours, fin du temps)
 show()};
window.__L={ord:function(){return ord},i:function(){return i}};
if(window.speechSynthesis&&speechSynthesis.getVoices().length===0)try{speechSynthesis.onvoiceschanged=function(){speechSynthesis.onvoiceschanged=null}}catch(e){}
show();
})();
</script>
</body>
</html>
