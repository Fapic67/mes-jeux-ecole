<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lerne neue Wörter</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="jeux/allemand-mots.js"></script>
<style>
:root{--bg:#fff8ec;--fg:#2b2440;--mut:#6c6487;--card:#fff;--bd:#eadfc8;--de:#e0a100;--der:#3f7de0;--die:#e0457b;--das:#2aa36b;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a2b;--fg:#f3effa;--mut:#b4abcc;--card:#2a2640;--bd:#3d3758}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;user-select:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#inner{position:fixed;inset:0;max-width:560px;margin:0 auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
#card{flex:1;min-height:0;border:3px solid var(--bd);background:var(--card);border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;padding:16px;color:var(--fg)}
.spk{display:flex;gap:14px;width:100%}
.spk button{flex:1;height:72px;border:3px solid var(--bd);border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.spk button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
#sde{background:linear-gradient(#1a1a1a 0 33.3%,#dd0000 33.3% 66.6%,#ffce00 66.6%)}
#sfr{background:linear-gradient(90deg,#0055a4 0 33.3%,#fff 33.3% 66.6%,#ef4135 66.6%)}
.spk svg{width:52px;height:52px;padding:8px;border-radius:50%;background:rgba(20,20,30,.55)}
.spk svg path{fill:#fff;stroke:#fff;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.spk svg path.w{fill:none}
#pic{font-size:min(38vw,30vh,190px);line-height:1}
#pic img,#pic svg{display:block}
#word{font-size:min(11vw,48px);font-weight:700;text-align:center;line-height:1.15;max-width:100%}
#word b{font-weight:700;white-space:nowrap}
#word i{font-style:normal}
#word i.der{color:var(--der)}#word i.die{color:var(--die)}#word i.das{color:var(--das)}
#card.pop{animation:pop .35s}
@keyframes pop{0%{transform:translateX(40px);opacity:0}100%{transform:none;opacity:1}}
.row{display:flex;align-items:center;gap:12px}
#cnt{flex:1;color:var(--mut);font-size:18px;font-weight:600;padding-left:6px}
#next{width:96px;height:72px;border:0;border-radius:22px;background:var(--de);color:#fff;box-shadow:0 5px 0 #a87800;display:flex;align-items:center;justify-content:center}
#next:active{transform:translateY(3px);box-shadow:0 2px 0 #a87800}
#next svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
#empty{margin:auto;text-align:center;font-size:20px;color:var(--mut)}
</style>
</head>
<body>
<div id="inner">
  <div id="card"><div id="pic"></div><div id="word"></div></div>
  <div class="spk"><button id="sde" aria-label="Deutsch"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button><button id="sfr" aria-label="Français"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button></div>
  <div class="row"><span id="cnt"></span><button id="next" aria-label="Weiter"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 5.5 19.5 12 13 18.5"/></svg></button></div>
</div>
<script>
(function(){
// Lerne neue Wörter : apprentissage (sans étoiles) des mots du dictionnaire hors manuel illustrés (DE_NEW, allemand-mots.js).
// L'image, le mot avec son article, la voix allemande ; 🔊 sur drapeau allemand = réécouter, 🔊 sur drapeau français = la traduction (DE_FR) ; → mot suivant. Ordre mélangé une fois et position gardés par profil.
var $=function(i){return document.getElementById(i)};
var PK="@"+(window.PROFILE||"p1");
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function voiceFor(l){try{var v=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.indexOf(l)===0});return v.filter(function(x){return x.localService})[0]||v[0]||null}catch(e){return null}} // voix locale d'abord (une voix réseau démarre lentement)
function say(t,l){l=l||"de";try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=l==="de"?"de-DE":"fr-FR";var v=voiceFor(l);if(v)u.voice=v;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
var W={};DE_NEW.forEach(function(x){W[x.w]=x});
// ordre : mots déjà mélangés gardés, mots nouveaux ajoutés au hasard à la fin
var ord=[];try{ord=JSON.parse(ls("lerne_ord"+PK))||[]}catch(e){}
ord=ord.filter(function(w){return W[w]});var inO={};ord.forEach(function(w){inO[w]=1});
ord=ord.concat(shuffle(DE_NEW.filter(function(x){return !inO[x.w]}).map(function(x){return x.w})));
ls("lerne_ord"+PK,JSON.stringify(ord));
var i=(parseInt(ls("lerne_i"+PK))||0)%Math.max(1,ord.length);
function full(x){return(x.a?x.a+" ":"")+x.w}
function show(){
 if(!ord.length){$("card").innerHTML='<div id="empty">Keine Wörter</div>';$("next").hidden=true;document.querySelector(".spk").hidden=true;return}
 var x=W[ord[i]];$("pic").innerHTML=x.e;
 var wd=$("word");wd.style.fontSize="";wd.innerHTML=(x.a?'<i class="'+x.a+'">'+x.a+"</i> ":"")+"<b>"+x.w+"</b>";
 // un mot d'un seul tenant reste sur une ligne : on réduit la taille jusqu'à ce qu'il tienne dans la carte
 var fs=parseFloat(getComputedStyle(wd).fontSize),mw=$("card").clientWidth-36,b=wd.querySelector("b");
 while(wd.offsetHeight>fs*1.5&&fs>30){fs-=1;wd.style.fontSize=fs+"px"} // si possible l'article reste sur la même ligne
 while(b.offsetWidth>mw&&fs>14){fs-=1;wd.style.fontSize=fs+"px"}
 $("cnt").textContent=(i+1)+" / "+ord.length;$("sfr").style.visibility=x.fr?"":"hidden";
 var c=$("card");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");
 setTimeout(function(){say(full(x))},250)}
$("sde").onclick=function(){if(ord.length)say(full(W[ord[i]]),"de")};
$("sfr").onclick=function(){var x=ord.length&&W[ord[i]];if(x&&x.fr)say(x.fr,"fr")};
$("next").onclick=function(){i=(i+1)%ord.length;ls("lerne_i"+PK,i);
 try{if(parent!==window)parent.postMessage({type:"roundEnd"},"*")}catch(e){} // un mot vu = une manche (parcours, fin du temps)
 show()};
window.__L={ord:function(){return ord},i:function(){return i}};
if(window.speechSynthesis&&speechSynthesis.getVoices().length===0)try{speechSynthesis.onvoiceschanged=function(){speechSynthesis.onvoiceschanged=null}}catch(e){}
show();
})();
</script>
</body>
</html>
