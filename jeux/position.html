<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>À gauche, à droite</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ea;--fg:#2b2440;--mut:#6c6487;--card:#fff;--bd:#eadfc8;--geo:#c08a1e;--ok:#22a861;--ko:#e5484d;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a2b;--fg:#f3effa;--mut:#b4abcc;--card:#2a2640;--bd:#3d3758}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;user-select:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;color:var(--fg)}
[hidden]{display:none!important}
#inner{position:fixed;inset:0;max-width:560px;margin:0 auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
#top{display:flex;justify-content:flex-end}
#lvlb{min-height:52px;padding:0 16px;border:3px solid var(--bd);background:var(--card);border-radius:16px;font-size:18px;font-weight:700}
#ask{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--bd);border-radius:22px;padding:10px 12px}
#ear{flex:none;width:64px;height:64px;border:0;border-radius:18px;background:var(--geo);color:#fff;font-size:30px;box-shadow:0 4px 0 #8a6210}
#name{flex:1;font-size:min(6.5vw,26px);font-weight:700;line-height:1.25}
#name span{white-space:nowrap}
#scw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#scene{position:relative;height:100%;max-height:100%;aspect-ratio:1;max-width:100%;background:linear-gradient(#eaf4ff 0 72%,#e6d2b0 72%);border:3px solid var(--bd);border-radius:22px;overflow:hidden}
@media (prefers-color-scheme:dark){#scene{background:linear-gradient(#2e3550 0 72%,#5a4a36 72%)}}
#box{position:absolute;left:33%;top:45%;width:34%;height:34%;z-index:2;pointer-events:none}
.ob{position:absolute;border:0;padding:0;background:none;transform:translate(-50%,-50%);border-radius:14px}
.ob img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.ob.ok{outline:5px solid var(--ok);background:rgba(34,168,97,.15)}
.ob.ko{outline:5px solid var(--ko);animation:shake .35s}
@keyframes shake{25%{margin-left:-8px}75%{margin-left:8px}}
.hand{position:absolute;bottom:4%;font-size:20px;font-weight:700;background:var(--card);border:3px solid var(--bd);border-radius:14px;padding:4px 10px;z-index:5}
#words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#words button{min-height:58px;padding:0 18px;border:3px solid var(--bd);border-radius:18px;background:var(--card);font-size:21px;font-weight:700;box-shadow:0 4px 0 var(--bd)}
#words button.ok{border-color:var(--ok);background:#e8f8ee;color:#17804a}
#words button.ko{border-color:var(--ko);opacity:.45;text-decoration:line-through}
#msg{min-height:28px;text-align:center;font-size:20px;font-weight:700}
#cnt{text-align:center;color:var(--mut);font-size:18px;font-weight:600}
#end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#end b{font-size:34px}#end p{font-size:22px;margin:0}
#again{min-width:220px;height:72px;border:0;border-radius:22px;background:var(--geo);color:#fff;font-size:24px;font-weight:700;box-shadow:0 5px 0 #8a6210}
.sheet{position:fixed;inset:0;background:rgba(10,8,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.panel{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0 0 4px;font-size:26px}
.opt{min-height:64px;border:3px solid var(--bd);background:var(--card);border-radius:18px;font-size:21px;font-weight:700;text-align:left;padding:8px 14px}
.opt small{display:block;font-size:16px;color:var(--mut);font-weight:600}.opt.on{border-color:var(--geo);box-shadow:0 0 0 3px var(--geo)}
#close{height:60px;border:0;border-radius:18px;background:var(--geo);color:#fff;font-size:21px;font-weight:700}
</style>
</head>
<body>
<div id="inner">
  <div id="top"><button id="lvlb"></button></div>
  <div id="ask"><button id="ear" aria-label="Réécouter">🔊</button><span id="name"></span></div>
  <div id="scw"><div id="scene"></div></div>
  <div id="words"></div>
  <div id="msg"></div>
  <div id="cnt"></div>
  <div id="end" hidden><b>🎉 Bravo !</b><p id="score"></p><button id="again">Encore</button></div>
</div>
<div class="sheet" id="sheet" hidden><div class="panel"><h2>Niveau</h2><div id="lvls" style="display:flex;flex-direction:column;gap:10px"></div><button id="close">Fermer</button></div></div>
<script>
(function(){
// À gauche, à droite (Géographie : se repérer, à la demande de l'utilisateur). Une boîte au milieu, des objets autour.
// Deux sortes de questions, en alternance : « Touche l'objet qui est à gauche de la boîte » (on touche l'objet) et « Où est le chat ? » (on choisit les mots).
// Niveaux : Facile = à gauche / à droite ; Moyen = + sur ; Difficile = + devant / derrière (l'objet derrière est en partie caché par la boîte).
var $=function(i){return document.getElementById(i)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function voiceFor(l){try{var v=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.indexOf(l)===0});return v.filter(function(x){return x.localService})[0]||v[0]||null}catch(e){return null}}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";var v=voiceFor("fr");if(v)u.voice=v;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
// attendre la fin de la phrase en cours (et au moins ms) avant d'enchaîner : la question suivante ne coupe plus la voix (signalé par l'utilisateur)
function afterSay(fn,ms){var t0=Date.now(),quiet=0;(function w(){var s=window.speechSynthesis,busy=s&&(s.speaking||s.pending),now=Date.now();if(busy)quiet=0;else if(!quiet)quiet=now;if((now-t0>=ms&&quiet&&now-quiet>=250)||now-t0>15000)fn();else setTimeout(w,120)})()}
var ac=null;function tone(f,t,d){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C()}if(ac.state==="suspended")ac.resume();var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.16,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
// objets (images détourées des mots d'allemand) : [image, nom avec article]
var OBJ=[["Teddybaer","le nounours"],["Auto","la voiture"],["Buch","le livre"],["Banane","la banane"],["Katze","le chat"],["Hund","le chien"],["Ente","le canard"],["Stern","l'étoile"],["Tasse","la tasse"],["Schuh","la chaussure"],["Hut","le chapeau"],["Fisch","le poisson"],["Erdbeere","la fraise"]];
// places autour de la boîte (centre x, y et taille en % de la scène ; z = devant ou derrière la boîte)
var POS={g:{x:15,y:66,s:23,z:3,t:"à gauche",de:"à gauche de la boîte"},d:{x:85,y:66,s:23,z:3,t:"à droite",de:"à droite de la boîte"},
 s:{x:38,y:34,s:22,z:3,t:"sur",de:"sur la boîte"},v:{x:46,y:76,s:25,z:3,t:"devant",de:"devant la boîte"},r:{x:60,y:48,s:24,z:1,t:"derrière",de:"derrière la boîte"}};
var LV=[null,{t:"Facile",d:"À gauche, à droite",p:["g","d"],x:1},{t:"Moyen",d:"À gauche, à droite, sur",p:["g","d","s"],x:1.25},{t:"Difficile",d:"À gauche, à droite, sur, devant, derrière",p:["g","d","s","v","r"],x:1.5}];
var BOX='<svg id="box" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="0,14 12,0 100,0 88,14" fill="#e2b77a" stroke="#8a5a26" stroke-width="2"/><polygon points="88,14 100,0 100,86 88,100" fill="#b98447" stroke="#8a5a26" stroke-width="2"/><rect x="0" y="14" width="88" height="86" fill="#d39b58" stroke="#8a5a26" stroke-width="2"/><rect x="38" y="14" width="12" height="86" fill="#efd3a2" opacity=".8"/></svg>';
var PK="@"+(window.PROFILE||"p1");function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var level=Math.min(3,Math.max(1,parseInt(ls("position_lvl"+PK))||1));
var N=window.PATHN||10,deck,qi,good,Q,miss,busy,place;
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function nb(t){return t.split(" ").map(function(w){return"<span>"+w+"</span>"}).join(" ")}
function start(){var L=LV[level],d=[];while(d.length<N)d=d.concat(shuffle(L.p).map(function(p,i){return{p:p,type:(d.length+i)%2}}));deck=d.slice(0,N);qi=0;good=0;
 $("lvlb").textContent="Niveau : "+L.t;$("end").hidden=true;$("ask").hidden=$("scw").hidden=$("cnt").hidden=$("msg").hidden=false;show()}
function qtext(){return Q.type===0?"Touche l'objet qui est "+POS[Q.p].de+".":"Où est "+place[Q.p][1]+" ?"}
function show(){var L=LV[level];Q=deck[qi];miss=0;busy=false;$("msg").textContent="";
 var objs=shuffle(OBJ);place={};L.p.forEach(function(p,i){place[p]=objs[i]});
 $("scene").innerHTML=BOX+L.p.map(function(p){var P=POS[p],o=place[p];return '<button class="ob" data-p="'+p+'" style="left:'+P.x+'%;top:'+P.y+'%;width:'+P.s+'%;height:'+P.s+'%;z-index:'+P.z+'" aria-label="'+o[1]+'"><img src="jeux/img/de/'+o[0]+'.webp" alt="" draggable="false"></button>'}).join("");
 $("words").innerHTML=Q.type===1?L.p.map(function(p){return '<button data-w="'+p+'">'+POS[p].t+"</button>"}).join(""):"";
 $("name").innerHTML=nb(qtext());$("cnt").textContent=(qi+1)+" / "+deck.length;setTimeout(function(){if(!busy&&!miss)say(qtext())},250)}
$("ear").onclick=function(){if(Q)say(qtext())};
function answer(ok){try{if(parent!==window)parent.postMessage({type:"answer",game:"position",ok:ok,diff:LV[level].x,k:cap(POS[Q.p].t),item:cap(POS[Q.p].de)},"*")}catch(e){}}
function good1(el){busy=true;el.classList.add("ok");tone(660,0,.12);tone(880,.1,.2);if(!miss){good++;answer(true)}
 var t=cap(place[Q.p][1])+" est "+POS[Q.p].de+".";$("msg").textContent="✅ "+t;say("Bravo ! "+t);afterSay(function(){qi++;if(qi<deck.length)show();else end()},2400)}
// après une erreur sur gauche / droite, on montre de quel côté est la gauche
function bad(el,t){if(!miss)answer(false);miss++;el.classList.add("ko");tone(220,0,.25);$("msg").textContent=t;say(t);
 if(!$("scene").querySelector(".hand")&&/gauche|droite/.test(POS[Q.p].t+t))$("scene").insertAdjacentHTML("beforeend",'<span class="hand" style="left:3%">👈 gauche</span><span class="hand" style="right:3%">droite 👉</span>');
 setTimeout(function(){el.classList.remove("ko")},900)}
$("scene").addEventListener("click",function(e){var b=e.target.closest(".ob");if(!b||busy||!Q||Q.type!==0)return;var p=b.dataset.p;
 if(p===Q.p)good1(b);else bad(b,"Non, "+place[p][1]+" est "+POS[p].de+".")});
$("words").addEventListener("click",function(e){var b=e.target.closest("[data-w]");if(!b||busy||!Q||b.classList.contains("ko"))return;
 if(b.dataset.w===Q.p)good1(b);else{bad(b,"Regarde bien où est "+place[Q.p][1]+".");b.disabled=true}});
function end(){$("ask").hidden=$("scw").hidden=$("cnt").hidden=$("msg").hidden=true;$("words").innerHTML="";$("end").hidden=false;$("score").textContent=good+" / "+deck.length+" du premier coup";Q=null;
 [523,659,784,1047].forEach(function(f,k){tone(f,k*.1,.25)});
 try{if(parent!==window)parent.postMessage({type:"roundEnd"},"*")}catch(e){}}
$("again").onclick=start;
$("lvlb").onclick=function(){$("lvls").innerHTML=[1,2,3].map(function(i){return '<button class="opt'+(i===level?" on":"")+'" data-l="'+i+'">'+LV[i].t+"<small>"+LV[i].d+"</small></button>"}).join("");$("sheet").hidden=false};
$("lvls").onclick=function(e){var b=e.target.closest("[data-l]");if(!b)return;level=+b.dataset.l;ls("position_lvl"+PK,level);$("sheet").hidden=true;start()};
$("close").onclick=function(){$("sheet").hidden=true};
window.hubBack=function(){if(!$("sheet").hidden){$("sheet").hidden=true;return true}return false};
window.__P={q:function(){return Q&&{p:Q.p,type:Q.type}}};
start();
})();
</script>
</body>
</html>
