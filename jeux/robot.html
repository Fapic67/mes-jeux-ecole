<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le petit robot</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ff;--fg:#26204a;--mut:#665f93;--card:#fff;--bd:#ddd3f7;--lo:#9b6bff;--ok:#22a861;--bad:#e5484d;--cell:#efe9ff;--trail:#c9b6ff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#17142b;--fg:#f1eeff;--mut:#aaa3d6;--card:#241f42;--bd:#3c3566;--cell:#2c2650;--trail:#5b4a9e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;user-select:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#wrap{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y}
#inner{max-width:480px;margin:0 auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:10px}
#hint{flex:1;font-size:17px;color:var(--mut);font-weight:600}
.lvl{min-height:56px;padding:0 14px;border:3px solid var(--bd);background:var(--card);color:var(--fg);border-radius:16px;font-weight:700;font-size:18px;white-space:nowrap}
#grid{position:relative;display:grid;gap:5px;width:100%;max-width:400px;margin:0 auto;aspect-ratio:1}
.c{background:var(--cell);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:var(--fs);line-height:1}
.c.t{background:var(--trail)}
#bot{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs);line-height:1;transition:transform .32s ease;pointer-events:none;z-index:2}
#bot.bump{animation:bump .4s}
#bot.win{animation:win .7s}
@keyframes bump{20%{translate:-6px 0}40%{translate:6px 0}60%{translate:-4px 0}80%{translate:4px 0}}
@keyframes win{30%{scale:1.4}60%{scale:.9}}
#msg{min-height:30px;text-align:center;font-size:21px;font-weight:700}
#prog{display:flex;flex-wrap:wrap;gap:6px;min-height:64px;background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:8px;align-content:flex-start}
#prog:empty::before{content:"Ton programme";color:var(--mut);font-size:18px;padding:10px 6px}
#prog span{width:42px;height:42px;border-radius:12px;background:var(--cell);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--lo)}
#prog span.run{background:var(--lo);color:#fff}
#prog span.ko{background:var(--bad);color:#fff}
.arrows{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.arrows button{height:70px;border:0;border-radius:18px;background:var(--lo);color:#fff;font-size:38px;font-weight:700;box-shadow:0 5px 0 #6c43d1}
.arrows button:active{transform:translateY(3px);box-shadow:0 2px 0 #6c43d1}
.acts{display:flex;gap:8px}
.acts button{height:64px;border:0;border-radius:18px;font-size:24px;font-weight:700}
#del,#clr{flex:0 0 22%;background:var(--bd);color:var(--fg)}
#go{flex:1;background:var(--ok);color:#fff;box-shadow:0 5px 0 #17804a}
#next{flex:1;background:var(--lo);color:#fff;box-shadow:0 5px 0 #6c43d1}
button:disabled{opacity:.4}
.sheet{position:fixed;inset:0;background:rgba(10,8,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.panel{background:var(--bg);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:26px}
#lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
#lvls button{height:58px;border:3px solid var(--bd);border-radius:16px;background:var(--card);color:var(--fg);font-size:22px;font-weight:700}
#lvls button.on{background:var(--lo);border-color:var(--lo);color:#fff}
.big{height:64px;border:0;border-radius:18px;background:var(--lo);color:#fff;font-size:22px;font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="wrap"><div id="inner">
<header><div id="hint">Guide le robot jusqu'à l'étoile ⭐</div><button class="lvl" id="lvlb">Niveau 1</button></header>
<div id="grid"></div>
<div id="msg"></div>
<div id="prog"></div>
<div id="edit">
  <div class="arrows"><button data-d="L" aria-label="Gauche">←</button><button data-d="U" aria-label="Haut">↑</button><button data-d="D" aria-label="Bas">↓</button><button data-d="R" aria-label="Droite">→</button></div>
  <div class="acts" style="margin-top:8px"><button id="del" aria-label="Effacer la dernière flèche">⌫</button><button id="clr" aria-label="Tout effacer">🗑️</button><button id="go" aria-label="Lancer">▶ Go</button></div>
</div>
<div id="after" hidden><div class="acts"><button id="next">Niveau suivant ➜</button></div></div>
</div></div>

<div class="sheet" id="sheet" hidden><div class="panel">
  <h2>Choisis un niveau</h2>
  <div id="lvls"></div>
  <button class="big" id="close">Fermer</button>
</div></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var DIR={L:[-1,0],R:[1,0],U:[0,-1],D:[0,1]},ARW={L:"←",R:"→",U:"↑",D:"↓"},MAXP=24;
// progression propre à chaque profil (identifiant fourni par l'accueil)
var PK=window.PROFILE?"@"+window.PROFILE:"";
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var level=Math.max(1,parseInt(ls("robot_lvl"+PK))||1),best=Math.max(level,parseInt(ls("robot_best"+PK))||1);
var N,rocks,start,goal,prog=[],running=false,fails=0,done=false;

/* sons et voix */
var ac=null;
function tone(f,t,d,v){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C()}if(ac.state==="suspended")ac.resume();var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.2,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d+.05)}catch(e){}}
var voice=null;function pick(){try{voice=speechSynthesis.getVoices().filter(function(v){return /^fr/i.test(v.lang)})[0]||null}catch(e){}}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voice)u.voice=voice;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function star(n){try{if(parent!==window)parent.postMessage({type:"stars",n:n},"*")}catch(e){}}

/* génération d'un niveau toujours faisable */
function key(x,y){return x+","+y}
function shortest(){var q=[[start[0],start[1],0]],seen={};seen[key(start[0],start[1])]=1;
 while(q.length){var p=q.shift();if(p[0]===goal[0]&&p[1]===goal[1])return p[2];
  for(var d in DIR){var x=p[0]+DIR[d][0],y=p[1]+DIR[d][1],k=key(x,y);if(x<0||y<0||x>=N||y>=N||rocks[k]||seen[k])continue;seen[k]=1;q.push([x,y,p[2]+1])}}return -1}
function gen(n){
 N=n<=3?4:n<=8?5:6;
 var nr=n<=2?0:Math.min(n-1,N*N/3|0),minL=Math.min(n+1,N*2+2),maxL=minL+3;
 for(var tries=0;tries<3000;tries++){
  rocks={};var r=function(){return Math.floor(Math.random()*N)};
  start=[r(),r()];goal=[r(),r()];if(key(start[0],start[1])===key(goal[0],goal[1]))continue;
  for(var i=0;i<nr;i++){var x=r(),y=r(),k=key(x,y);if(k!==key(start[0],start[1])&&k!==key(goal[0],goal[1]))rocks[k]=1}
  var L=shortest();if(L>=minL&&L<=maxL)return;
  if(tries>2500&&L>0)return}
}
/* affichage */
function cellSize(){return $("grid").clientWidth/N}
function placeBot(x,y){var s=cellSize();$("bot").style.width=$("bot").style.height=s+"px";$("bot").style.transform="translate("+(x*s)+"px,"+(y*s)+"px)"}
function drawGrid(){
 var g=$("grid"),h="";g.style.gridTemplateColumns="repeat("+N+",1fr)";g.style.setProperty("--fs",(N<=4?44:N===5?36:30)+"px");
 for(var y=0;y<N;y++)for(var x=0;x<N;x++){var k=key(x,y);h+='<div class="c" data-k="'+k+'">'+(rocks[k]?"🪨":(x===goal[0]&&y===goal[1])?"⭐":"")+"</div>"}
 g.innerHTML=h+'<div id="bot">🤖</div>';requestAnimationFrame(function(){$("bot").style.transition="none";placeBot(start[0],start[1]);void $("bot").offsetWidth;$("bot").style.transition=""})}
function drawProg(cur,ko){$("prog").innerHTML=prog.map(function(d,i){return '<span class="'+(i===ko?"ko":i===cur?"run":"")+'">'+ARW[d]+"</span>"}).join("");refresh()}
function refresh(){var b=running||done;document.querySelectorAll(".arrows button").forEach(function(x){x.disabled=b||prog.length>=MAXP});$("del").disabled=b||!prog.length;$("clr").disabled=b||!prog.length;$("go").disabled=b||!prog.length}
function msg(t){$("msg").textContent=t}
function newLevel(){gen(level);prog=[];fails=0;done=false;running=false;$("lvlb").textContent="Niveau "+level;$("edit").hidden=false;$("after").hidden=true;
 msg("");drawGrid();drawProg()}
function keepVisible(){setTimeout(function(){var w=$("wrap"),el=done?$("after"):$("edit"),r=el.getBoundingClientRect();if(r.bottom>w.clientHeight)w.scrollBy({top:r.bottom-w.clientHeight+12,behavior:"smooth"})},60)}

/* exécution */
function run(){
 if(running||!prog.length)return;running=true;refresh();msg("");
 document.querySelectorAll(".c.t").forEach(function(c){c.classList.remove("t")});
 var x=start[0],y=start[1],i=0;placeBot(x,y);
 function step(){
  if(i>=prog.length){finish(x===goal[0]&&y===goal[1],-1);return}
  drawProg(i);var d=DIR[prog[i]],nx=x+d[0],ny=y+d[1];
  if(nx<0||ny<0||nx>=N||ny>=N||rocks[key(nx,ny)]){var b=$("bot");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump");tone(160,0,.25,.25);drawProg(-1,i);
   msg(rocks[key(nx,ny)]?"Oups ! Le robot s'est cogné contre un rocher.":"Oups ! Le robot est sorti du chemin.");say("Oups !");setTimeout(function(){reset()},1300);return}
  var c=document.querySelector('.c[data-k="'+key(x,y)+'"]');if(c)c.classList.add("t");
  x=nx;y=ny;placeBot(x,y);tone(500+i*25,0,.08,.12);i++;
  if(x===goal[0]&&y===goal[1]&&i<prog.length){setTimeout(function(){finish(true,i)},380);return}
  setTimeout(step,420)}
 setTimeout(step,250)}
function finish(ok,extra){
 if(ok){done=true;running=false;var b=$("bot");b.classList.add("win");[523,659,784,1047].forEach(function(f,k){tone(f,k*.1,.25,.22)});
  star(fails===0?2:1);msg(fails===0?"🎉 Bravo ! Du premier coup !":"🎉 Bravo, tu as réussi !");say("Bravo !");
  level++;best=Math.max(best,level);ls("robot_lvl"+PK,level);ls("robot_best"+PK,best);
  $("edit").hidden=true;$("after").hidden=false;refresh();keepVisible()}
 else{tone(260,0,.3,.18);msg("Le robot n'est pas arrivé sur l'étoile. Essaie encore !");setTimeout(reset,1300)}}
function reset(){fails++;running=false;var b=$("bot");b.classList.remove("bump");b.style.transition="none";placeBot(start[0],start[1]);void b.offsetWidth;b.style.transition="";
 document.querySelectorAll(".c.t").forEach(function(c){c.classList.remove("t")});drawProg()}

/* commandes */
document.querySelector(".arrows").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||running||done||prog.length>=MAXP)return;tone(700,0,.05,.1);prog.push(b.dataset.d);msg("");drawProg()});
$("del").onclick=function(){if(running||done)return;prog.pop();msg("");drawProg()};
$("clr").onclick=function(){if(running||done)return;prog=[];msg("");drawProg()};
$("go").onclick=run;
$("next").onclick=newLevel;
window.addEventListener("resize",function(){if(!running)placeBot(start[0],start[1])});
/* choix du niveau (parmi ceux déjà atteints) */
function lvls(){var h="";for(var i=1;i<=best;i++)h+='<button data-l="'+i+'" class="'+(i===level?"on":"")+'">'+i+"</button>";$("lvls").innerHTML=h}
$("lvlb").onclick=function(){if(running)return;lvls();$("sheet").hidden=false};
$("lvls").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;level=+b.dataset.l;ls("robot_lvl"+PK,level);$("sheet").hidden=true;newLevel()});
$("close").onclick=function(){$("sheet").hidden=true};
newLevel();
})();
// Bouton retour du téléphone : ferme d'abord le choix du niveau
window.hubBack=function(){var s=document.getElementById("sheet");if(s&&!s.hidden){s.hidden=true;return true}return false};
</script>
</body>
</html>
