<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les tuyaux magiques</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef6ff;--fg:#1b2b40;--mut:#5a6f88;--card:#fff;--bd:#d2e1f3;--pipe:#8a94a6;--water:#2f8cff;--jx:#ff8a3d;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#121a26;--fg:#eaf2ff;--mut:#9fb2c9;--card:#1c2737;--bd:#2f4057;--pipe:#6e7a8e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;user-select:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;color:inherit}
#wrap{position:fixed;inset:0;overflow-y:auto}
#inner{max-width:480px;margin:0 auto;padding:10px 12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:8px}
#info{flex:1;font-size:17px;color:var(--mut);font-weight:600}
.hb{min-height:56px;padding:0 14px;border:3px solid var(--bd);background:var(--card);border-radius:16px;font-weight:700;font-size:18px;white-space:nowrap}
#field{display:flex;align-items:center;gap:4px;width:100%;max-width:440px;margin:0 auto}
.end{font-size:34px;line-height:1;flex:none;width:36px;text-align:center;display:flex;flex-direction:column;align-self:stretch}
#board{flex:1;display:grid;gap:3px;aspect-ratio:1;background:var(--bd);padding:3px;border-radius:14px}
.t{background:var(--card);border-radius:8px;border:0;padding:0;position:relative;transition:transform .18s}
.t svg{width:100%;height:100%;display:block;transition:transform .18s ease}
.t .p{stroke:var(--pipe);stroke-width:22;stroke-linecap:butt;fill:none}
.t.wet .p{stroke:var(--water)}
.t.wet{background:#dcecff}
@media (prefers-color-scheme:dark){.t.wet{background:#1f3550}}
.t:active{transform:scale(.94)}
#msg{min-height:30px;text-align:center;font-size:21px;font-weight:700}
.tools{display:flex;gap:8px}.tools button{flex:1;min-height:56px;border:3px solid var(--bd);border-radius:16px;background:var(--card);font-size:18px;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.panel{background:var(--bg);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.panel h2{margin:0;font-size:28px}
.big{width:100%;min-height:62px;border:0;border-radius:999px;background:var(--jx);color:#fff!important;font-size:22px;font-weight:700;box-shadow:0 5px 0 #d9601a}
.big.alt{background:var(--card);color:var(--fg)!important;border:3px solid var(--bd);box-shadow:none}
#lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
#lvls button{height:56px;border:3px solid var(--bd);border-radius:14px;background:var(--card);font-size:20px;font-weight:700}
#lvls button.on{background:var(--jx);border-color:var(--jx);color:#fff}
#flower.bloom{animation:bloom 1s}
@keyframes bloom{40%{transform:scale(1.6) rotate(15deg)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="wrap"><div id="inner">
<header><div id="info"></div><button class="hb" id="lvlb">Niveau 1</button></header>
<div id="field"><div class="end" id="src"></div><div id="board"></div><div class="end" id="dst"></div></div>
<div id="msg"></div>
<div class="tools"><button id="re">↶ Mélanger à nouveau</button></div>
</div></div>
<div class="sheet" id="won" hidden><div class="panel">
  <h2>🌸 La fleur a de l'eau !</h2><div id="w-t" style="font-size:19px;color:var(--mut);font-weight:600"></div>
  <button class="big" id="w-next">Niveau suivant ➜</button>
</div></div>
<div class="sheet" id="pick" hidden><div class="panel">
  <h2>Choisis un niveau</h2><div id="lvls"></div><button class="big alt" id="p-close">Fermer</button>
</div></div>
<script>
(function(){
// Jeu de la boutique (matière Jeux : pas d'étoiles). On tourne les tuyaux pour amener l'eau de la source 💧 (à gauche) à la fleur 🌱 (à droite).
// Fait travailler le repérage dans l'espace et les rotations. Niveaux générés : un chemin existe toujours.
var $=function(i){return document.getElementById(i)};
var PK=window.PROFILE?"@"+window.PROFILE:"";
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function rnd(n){return Math.floor(Math.random()*n)}
var ac=null;function tone(f,t,d,v){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C()}if(ac.state==="suspended")ac.resume();var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+(t||0);o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.16,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+(d||.12));o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+(d||.12)+.05)}catch(e){}}
// côtés : N=1, E=2, S=4, O=8
var DX={1:[0,-1],2:[1,0],4:[0,1],8:[-1,0]},OPP={1:4,2:8,4:1,8:2};
function rot(m){return((m<<1)|(m>>3))&15}
var level=Math.max(1,parseInt(ls("tuyaux_lvl"+PK))||1),best=Math.max(level,parseInt(ls("tuyaux_best"+PK))||1);
var N,cells,sr,gr,moves,done,ang,SOL;
function key(x,y){return y*N+x}
// chemin aléatoire (sans croisement) de la colonne 0 à la colonne N-1
function path(minLen){for(var t=0;t<500;t++){var s=rnd(N),g=rnd(N),seen={},p=[[0,s]];seen[key(0,s)]=1;
 (function dfs(){var c=p[p.length-1];if(c[0]===N-1&&c[1]===g)return true;var ds=[1,2,4,8].sort(function(){return Math.random()-.5});
  for(var i=0;i<4;i++){var d=DX[ds[i]],x=c[0]+d[0],y=c[1]+d[1];if(x<0||y<0||x>=N||y>=N||seen[key(x,y)])continue;seen[key(x,y)]=1;p.push([x,y]);if(dfs())return true;p.pop()}return false})();
 if(p.length>=minLen&&p[p.length-1][0]===N-1){sr=s;gr=p[p.length-1][1];return p}}return null}
function gen(L){N=L<=3?4:L<=8?5:6;var minLen=N+Math.min(N+2,Math.floor(L/2)),p=null;while(!p){p=path(minLen);if(!p)minLen--}
 cells=[];for(var i=0;i<N*N;i++)cells.push(0);
 p.forEach(function(c,i){var m=0;function link(a,b){for(var d in DX)if(a[0]+DX[d][0]===b[0]&&a[1]+DX[d][1]===b[1])return +d;return 0}
  if(i===0)m|=8;else m|=link(c,p[i-1]);if(i===p.length-1)m|=2;else m|=link(c,p[i+1]);cells[key(c[0],c[1])]=m});
 var shapes=[5,3,3,7,5,3];for(var k=0;k<N*N;k++)if(!cells[k])cells[k]=shapes[rnd(shapes.length)];
 SOL=cells.slice(); // solution (pour les tests)
 // on mélange : chaque tuile tourne au hasard (au moins une partie du chemin n'est pas bien placée)
 do{for(var j=0;j<N*N;j++){var r=rnd(4);for(var q=0;q<r;q++)cells[j]=rot(cells[j])}}while(flow().win)}
// l'eau part de la gauche de la ligne sr et suit les tuyaux reliés
function flow(){var wet={},q=[],win=false;if(cells[key(0,sr)]&8){wet[key(0,sr)]=1;q.push([0,sr])}
 while(q.length){var c=q.shift(),m=cells[key(c[0],c[1])];if(c[0]===N-1&&c[1]===gr&&(m&2))win=true;
  for(var d in DX){if(!(m&d))continue;var x=c[0]+DX[d][0],y=c[1]+DX[d][1];if(x<0||y<0||x>=N||y>=N)continue;var k=key(x,y);if(wet[k]||!(cells[k]&OPP[d]))continue;wet[k]=1;q.push([x,y])}}
 return{wet:wet,win:win}}
function svg(m){var h='<svg viewBox="0 0 100 100">';var c={1:"M50 50V0",2:"M50 50H100",4:"M50 50V100",8:"M50 50H0"};
 for(var d in c)if(m&d)h+='<path class="p" d="'+c[d]+'"/>';return h+'<circle cx="50" cy="50" r="11" class="p" style="fill:currentColor;stroke-width:0"/></svg>'}
function draw(){var b=$("board"),h="";b.style.gridTemplateColumns=b.style.gridTemplateRows="repeat("+N+",minmax(0,1fr))";
 for(var y=0;y<N;y++)for(var x=0;x<N;x++)h+='<button class="t" data-k="'+key(x,y)+'" aria-label="tuyau">'+svg(cells[key(x,y)])+"</button>";b.innerHTML=h;
 function col(r,ic,id){var s="";for(var y=0;y<N;y++)s+='<div style="flex:1;display:flex;align-items:center;justify-content:center"'+(y===r&&id?' id="'+id+'"':"")+">"+(y===r?ic:"")+"</div>";return s}
 $("src").innerHTML=col(sr,"💧");$("dst").innerHTML=col(gr,"🌱","flower");paintWet()}
function paintWet(){var f=flow();document.querySelectorAll(".t").forEach(function(t){t.classList.toggle("wet",!!f.wet[+t.dataset.k]);t.style.color=f.wet[+t.dataset.k]?"var(--water)":"var(--pipe)"});return f}
function info(){$("info").textContent="Tours : "+moves;$("lvlb").textContent="Niveau "+level}
function newLevel(){gen(level);moves=0;done=false;$("msg").textContent=level===1?"Touche un tuyau pour le tourner. Amène l'eau jusqu'à la plante !":"";draw();info()}
$("board").addEventListener("click",function(e){var t=e.target.closest(".t");if(!t||done)return;var k=+t.dataset.k;cells[k]=rot(cells[k]);moves++;info();$("msg").textContent="";
 t.innerHTML=svg(cells[k]);tone(700,0,.05,.1);var f=paintWet();
 if(f.win){done=true;$("flower").textContent="🌸";$("flower").classList.add("bloom");[523,659,784,1047].forEach(function(fq,i){tone(fq,.15+i*.1,.25,.2)});
  if(level>=best){best=level+1;ls("tuyaux_best"+PK,best)}$("w-t").textContent="Bravo ! En "+moves+" tours.";setTimeout(function(){$("won").hidden=false},900);
  try{if(parent!==window)parent.postMessage({type:"roundEnd"},"*")}catch(er){}}});
$("w-next").onclick=function(){$("won").hidden=true;level++;ls("tuyaux_lvl"+PK,level);newLevel()};
$("re").onclick=function(){if(!done)newLevel()};
$("lvlb").onclick=function(){var h="";for(var i=1;i<=best;i++)h+='<button data-l="'+i+'" class="'+(i===level?"on":"")+'">'+i+"</button>";$("lvls").innerHTML=h;$("pick").hidden=false};
$("lvls").onclick=function(e){var b=e.target.closest("[data-l]");if(!b)return;level=+b.dataset.l;ls("tuyaux_lvl"+PK,level);$("pick").hidden=true;newLevel()};
$("p-close").onclick=function(){$("pick").hidden=true};
window.hubBack=function(){if(!$("pick").hidden){$("pick").hidden=true;return true}if(!$("won").hidden){$("won").hidden=true;return true}return false};
window.__T={flow:flow,cells:function(){return cells},sol:function(){return SOL},N:function(){return N}};
newLevel();
})();
</script>
</body>
</html>
