<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Français</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3fbf6;--fg:#1d2b24;--mut:#5b6e64;--card:#fff;--bd:#d5e8dc;--fr:#22a861;--ok:#22a861;--bad:#e5484d;--syl:#9b6bff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b16;--fg:#eef6f1;--mut:#a3b8ad;--card:#1d2a23;--bd:#30453a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;user-select:none;touch-action:manipulation}
#app{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px;align-items:center}
.bar{width:100%;height:14px;background:var(--bd);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--fr);transition:width .3s}
.cnt{color:var(--mut);font-size:19px;font-weight:600}
.shake{animation:sh .25s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{font:700 22px "Fredoka",sans-serif;min-height:64px;padding:16px 36px;border-radius:999px;border:0;background:var(--fr);color:#fff;cursor:pointer}
.btn2{background:var(--card);color:var(--fg);border:3px solid var(--bd)}
.menu .btn{width:100%}
.big{font-size:72px;font-weight:700}
h1{margin:0;font-size:34px}
.ear{background:var(--card);border:3px solid var(--bd);border-radius:50%;width:68px;height:68px;font-size:32px;cursor:pointer;color:var(--fg)}
.phr{font-size:30px;font-weight:600;line-height:1.45}
.gap{display:inline-block;min-width:3.2em;padding:0 .2em;border-bottom:4px solid var(--syl);color:var(--syl);font-weight:700}
.gap.ok{color:var(--ok);border-color:var(--ok)}
.gap.ko{color:var(--bad);border-color:var(--bad)}
.hint{color:var(--mut);font-size:19px;min-height:24px}
body.withkb{justify-content:flex-start;padding-top:28px;padding-bottom:300px}
.back{position:fixed;top:10px;left:12px;min-height:52px;padding:0 16px;background:var(--card);border:3px solid var(--bd);border-radius:16px;font:700 18px "Fredoka",sans-serif;color:var(--fg);cursor:pointer}
</style>
<script src="jeux/clavier.js"></script>
</head>
<body>
<div id="app"></div>
<script>
// Phrases « qui / que » : le mot manquant est entre accolades
var QQ=["Le chat {qui} dort est tout noir.","Le gâteau {que} je mange est au chocolat.","La fille {qui} chante est ma sœur.","Le livre {que} tu lis est très drôle.","J'ai un chien {qui} aboie fort.","La pomme {que} maman achète est rouge.","Le garçon {qui} court vite s'appelle Tom.","Le dessin {que} je fais est pour papa.","C'est la maîtresse {qui} lit une histoire.","La robe {que} Léa porte est bleue.","Je vois un oiseau {qui} vole dans le ciel.","Le jeu {que} nous aimons est caché.","Le bébé {qui} pleure a faim.","La chanson {que} tu chantes est jolie.","Il y a une souris {qui} mange du fromage.","Le vélo {que} papa répare est rouge.","Le lapin {qui} saute est tout blanc.","La glace {que} je préfère est à la fraise.","Mon ami {qui} habite ici a un chat.","Le ballon {que} Paul lance va très loin.","La poule {qui} picore est dans le jardin.","Le film {que} nous regardons fait peur.","Le bus {qui} arrive est jaune.","La lettre {que} je donne est pour mamie.","J'aime le soleil {qui} brille.","Le cadeau {que} tu ouvres est très grand.","La tortue {qui} marche est très lente.","Le pain {que} le boulanger fait est chaud.","Les enfants {qui} jouent rient fort.","La fleur {que} je cueille sent bon.","Le chat {que} je caresse ronronne.","Le chien {qui} mord est méchant."].map(function(t){var m=t.match(/^(.*)\{(qui|que)\}(.*)$/);return{a:m[1],w:m[2],b:m[3],full:m[1]+m[2]+m[3]}});
var TOTAL=15,app=document.getElementById("app"),voice=null;
var bk=document.createElement("button");bk.className="back";bk.textContent="← Menu";bk.style.display="none";bk.onclick=function(){home()};if(!window.START)document.body.appendChild(bk);
function pickVoice(){var v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];voice=v.find(function(x){return x.lang&&/^fr/i.test(x.lang)})||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,cb){var done=false,fin=function(){if(!done){done=true;cb&&cb()}};setTimeout(fin,1200+t.length*90);try{if(!window.speechSynthesis)return;pickVoice();speechSynthesis.cancel();setTimeout(function(){var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voice)u.voice=voice;u.rate=.85;u.onend=function(){setTimeout(fin,500)};speechSynthesis.resume();speechSynthesis.speak(u)},60)}catch(e){}}
function star(){try{if(parent!==window)parent.postMessage({type:"stars",n:1},"*")}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function bar(){return '<div class="cnt">'+(i+1)+' / '+deck.length+'</div><div class="bar"><i style="width:'+(i/deck.length*100)+'%"></i></div>'}
var deck,i,good,missed;
function home(){nokb();if(window.START){parent.postMessage("hub-back","*");return}bk.style.display="none";app.innerHTML='<h1>Français</h1><div class="menu" style="width:100%"><button class="btn" id="m3">Complète la phrase : qui ou que ?</button></div>';document.getElementById("m3").onclick=start3}
// Complète la phrase : écrire qui / que au clavier, de mémoire
function start3(){bk.style.display="block";deck=shuffle(QQ).slice(0,TOTAL);i=0;good=0;show3()}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
var KB=null;
function kb(o){if(KB)KB.destroy();KB=Clavier(o);document.body.classList.add("withkb")}
function nokb(){if(KB){KB.destroy();KB=null}document.body.classList.remove("withkb")}
function show3(){
  var q=deck[i],tries=0,lock=false,val="";missed=false;
  app.innerHTML=bar()+'<div class="phr">'+esc(q.a)+'<span class="gap" id="gap">&nbsp;</span>'+esc(q.b)+'</div><button class="ear" id="ear" aria-label="Réécouter">🔊</button><div class="hint" id="hint"></div>';
  var gap=document.getElementById("gap"),hint=document.getElementById("hint");
  function paint(){gap.className="gap";gap.textContent=val||" "}
  document.getElementById("ear").onclick=function(){say(q.full)};
  kb({
    onKey:function(k){if(lock||val.length>=8)return;val+=k;hint.textContent="";paint()},
    onDel:function(){if(lock)return;val=val.slice(0,-1);paint()},
    onOk:function(){if(lock||!val)return;
      if(val===q.w){lock=true;KB.enable(false);if(!missed){good++;star()}gap.className="gap ok";gap.textContent=q.w;hint.textContent="Bravo !";
        say(q.full,function(){i++;i<deck.length?show3():end()})}
      else{missed=true;tries++;lock=true;gap.className="gap ko shake";hint.textContent="Essaie encore ! Écoute bien la phrase.";if(tries>=2)say(q.full);
        setTimeout(function(){val="";paint();lock=false},700)}}
  });
  say(q.full);
}
function end(){
  nokb();
  var n=Math.round(good/deck.length*10*2)/2,s=String(n).replace(".",",");
  app.innerHTML='<h1>Bravo !</h1><div class="big">'+s+' / 10</div><div class="cnt">'+good+' / '+deck.length+' du premier coup</div><button class="btn" id="re">Rejouer</button><button class="btn btn2" id="mn">Menu</button>';
  document.getElementById("re").onclick=function(){start3()};
  document.getElementById("mn").onclick=home;
  say("Bravo ! "+s+" sur dix");
}
window.START?start3():home();
</script>
</body>
</html>
