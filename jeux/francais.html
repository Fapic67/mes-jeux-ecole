<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Français</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3fbf6;--fg:#1d2b24;--mut:#5b6e64;--card:#fff;--bd:#d5e8dc;--fr:#22a861;--ok:#22a861;--bad:#e5484d;--syl:#9b6bff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b16;--fg:#eef6f1;--mut:#a3b8ad;--card:#1d2a23;--bd:#30453a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;user-select:none;touch-action:manipulation}
#app{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px;align-items:center}
.bar{width:100%;height:14px;background:var(--bd);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--fr);transition:width .3s}
.cnt{color:var(--mut);font-size:19px;font-weight:600}
.shake{animation:sh .25s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{font:700 22px "Fredoka",sans-serif;min-height:64px;padding:16px 36px;border-radius:999px;border:0;background:var(--fr);color:#fff;cursor:pointer}
.btn2{background:var(--card);color:var(--fg);border:3px solid var(--bd)}
.menu .btn{width:100%}
.big{font-size:72px;font-weight:700}
h1{margin:0;font-size:34px}
.ear{background:var(--card);border:3px solid var(--bd);border-radius:50%;width:68px;height:68px;font-size:32px;cursor:pointer;color:var(--fg)}
.phr{font-size:30px;font-weight:600;line-height:1.45}
.gap{display:inline-block;min-width:3.2em;padding:0 .2em;border-bottom:4px solid var(--syl);color:var(--syl);font-weight:700}
.gap.ok{color:var(--ok);border-color:var(--ok)}
.gap.ko{color:var(--bad);border-color:var(--bad)}
.hint{color:var(--mut);font-size:19px;min-height:24px}
body.withkb{justify-content:flex-start;padding-top:28px;padding-bottom:300px}
/* conjugaison */
.cj{width:100%;display:flex;flex-direction:column;gap:8px}
.cj .r{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:600;min-height:54px;padding:2px 12px;border-radius:16px;border:3px solid transparent}
.cj .r.on{border-color:var(--syl);background:var(--card)}
.cj .p{flex:0 0 40%;text-align:right;color:var(--mut)}
.cj .v{flex:1;text-align:left;min-height:42px;border-bottom:4px solid var(--bd);color:var(--syl);font-weight:700;padding:0 4px}
.cj .r.on .v{border-color:var(--syl)}
.cj .r.ok .v{color:var(--ok);border-color:var(--ok)}
.cj .r.ko .v{color:var(--bad);border-color:var(--bad)}
.vt{font-size:26px;font-weight:700;margin:0}
.vt b{color:var(--syl)}
.back{position:fixed;top:10px;left:12px;min-height:52px;padding:0 16px;background:var(--card);border:3px solid var(--bd);border-radius:16px;font:700 18px "Fredoka",sans-serif;color:var(--fg);cursor:pointer}
</style>
<script src="jeux/clavier.js"></script>
</head>
<body>
<div id="app"></div>
<script>
// Le mot manquant est entre accolades
function parse(t){var m=t.match(/^(.*)\{([^}]+)\}(.*)$/);return{a:m[1],w:m[2],b:m[3],full:m[1]+m[2]+m[3]}}
// Phrases « qui / que »
var QQ=["Le chat {qui} dort est tout noir.","Le gâteau {que} je mange est au chocolat.","La fille {qui} chante est ma sœur.","Le livre {que} tu lis est très drôle.","J'ai un chien {qui} aboie fort.","La pomme {que} maman achète est rouge.","Le garçon {qui} court vite s'appelle Tom.","Le dessin {que} je fais est pour papa.","C'est la maîtresse {qui} lit une histoire.","La robe {que} Léa porte est bleue.","Je vois un oiseau {qui} vole dans le ciel.","Le jeu {que} nous aimons est caché.","Le bébé {qui} pleure a faim.","La chanson {que} tu chantes est jolie.","Il y a une souris {qui} mange du fromage.","Le vélo {que} papa répare est rouge.","Le lapin {qui} saute est tout blanc.","La glace {que} je préfère est à la fraise.","Mon ami {qui} habite ici a un chat.","Le ballon {que} Paul lance va très loin.","La poule {qui} picore est dans le jardin.","Le film {que} nous regardons fait peur.","Le bus {qui} arrive est jaune.","La lettre {que} je donne est pour mamie.","J'aime le soleil {qui} brille.","Le cadeau {que} tu ouvres est très grand.","La tortue {qui} marche est très lente.","Le pain {que} le boulanger fait est chaud.","Les enfants {qui} jouent rient fort.","La fleur {que} je cueille sent bon.","Le chat {que} je caresse ronronne.","Le chien {qui} mord est méchant."].map(parse);
// Phrases « mots simples » (mots qui s'écrivent comme ils se prononcent)
var MOTS=["La {lune} brille dans le ciel.", "Maman a planté une {tulipe} rouge.", "Papa roule vite avec sa {moto}.", "Je fais du {vélo} dans la cour.", "Je mange une {tomate} bien rouge.", "Il y a de la {salade} dans mon assiette.", "Le singe mange une {banane}.", "Le {pirate} cherche un trésor.", "Léa porte une jolie {robe}.", "La {mule} porte un gros sac.", "Le {lama} vit dans la montagne.", "Je pose un {domino} sur la table.", "Les enfants construisent une {cabane}.", "Je me lave les mains au {lavabo}.", "Le {kiwi} est un fruit vert.", "Mon frère fait du {judo}.", "Le chat saute sur le {mur}.", "Je range mes livres dans mon {sac}.", "Je bois mon lait dans un {bol}.", "Mamie coud avec du {fil}.", "Papa met du {sel} sur les frites.", "Les abeilles vivent dans la {ruche}.", "Aujourd'hui, nous sommes {mardi}.", "À {midi}, je mange à la cantine.", "Le {samedi}, je vais à la piscine.", "La {tortue} marche très lentement.", "Pour faire un gâteau, il faut de la {farine}.", "Je mets ma trousse dans mon {cartable}.", "Je suis {malade}, je reste au lit.", "Le {pilote} conduit l'avion.", "Mon {numéro} de maillot est le sept.", "Le {bébé} dort dans son berceau.", "Papa boit un {café} chaud.", "En {été}, il fait très chaud.", "Je regarde un dessin animé à la {télé}.", "Mamie met une {olive} sur la pizza.", "Le chien est mon {animal} préféré.", "Nous jouons au {parc} après la classe.", "Les canards nagent sur le {lac}.", "Le pont est très {solide}.", "Je mets une pièce dans ma {tirelire}.", "J'écoute de la musique à la {radio}.", "Il est tard, c'est l'heure de faire {dodo}.", "Attends une {minute}, j'arrive !", "La rose a une {épine} qui pique.", "Mon {école} est près de chez moi.", "Deux moins deux, ça fait {zéro}.", "J'appuie sur la {pédale} pour avancer.", "Nous aimons nous promener dans la {nature}.", "J'aime {lire} des histoires."].map(parse);
var TOTAL=15,app=document.getElementById("app"),voice=null;
var bk=document.createElement("button");bk.className="back";bk.textContent="← Menu";bk.style.display="none";bk.onclick=function(){home()};if(!window.START)document.body.appendChild(bk);
function pickVoice(){var v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];voice=v.find(function(x){return x.lang&&/^fr/i.test(x.lang)})||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,cb){var done=false,fin=function(){if(!done){done=true;cb&&cb()}};setTimeout(fin,1200+t.length*90);try{if(!window.speechSynthesis)return;pickVoice();speechSynthesis.cancel();setTimeout(function(){var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voice)u.voice=voice;u.rate=.85;u.onend=function(){setTimeout(fin,500)};speechSynthesis.resume();speechSynthesis.speak(u)},60)}catch(e){}}
// Étoiles : phrase juste du premier coup = série ; les mots simples (plus longs à écrire) comptent un peu plus
function star(ok,q){var g=cur===4?"phrase":"quique";try{if(parent!==window)parent.postMessage({type:"answer",game:g,ok:ok!==false,diff:cur===4?1.25:1,k:q&&cur!==4?q.w:null,item:q?(cur===4?q.w:q.full):null},"*")}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function bar(){return '<div class="cnt">'+(i+1)+' / '+deck.length+'</div><div class="bar"><i style="width:'+(i/deck.length*100)+'%"></i></div>'}
var deck,i,good,missed,cur=3;
function home(){nokb();if(window.START){parent.postMessage("hub-back","*");return}bk.style.display="none";app.innerHTML='<h1>Français</h1><div class="menu" style="width:100%"><button class="btn" id="m4">Complète la phrase</button><button class="btn" id="m3">Complète la phrase : qui ou que ?</button><button class="btn" id="m5">Conjugue être et avoir</button></div>';document.getElementById("m5").onclick=conjMenu;document.getElementById("m3").onclick=function(){startQ(3)};document.getElementById("m4").onclick=function(){startQ(4)}}
// Complète la phrase : écrire qui / que au clavier, de mémoire
// 3 = qui / que, 4 = mots simples
function startQ(m){cur=m;bk.style.display="block";deck=shuffle(m===4?MOTS:QQ).slice(0,TOTAL);i=0;good=0;show3()}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
var KB=null;
function kb(o){if(KB)KB.destroy();KB=Clavier(o);document.body.classList.add("withkb")}
function nokb(){if(KB){KB.destroy();KB=null}document.body.classList.remove("withkb")}
function show3(){
  var q=deck[i],tries=0,lock=false,val="";missed=false;
  app.innerHTML=bar()+'<div class="phr">'+esc(q.a)+'<span class="gap" id="gap">&nbsp;</span>'+esc(q.b)+'</div><button class="ear" id="ear" aria-label="Réécouter">🔊</button><div class="hint" id="hint"></div>';
  var gap=document.getElementById("gap"),hint=document.getElementById("hint");
  function paint(){gap.className="gap";gap.textContent=val||" "}
  document.getElementById("ear").onclick=function(){say(q.full)};
  kb({
    onKey:function(k){if(lock||val.length>=12)return;val+=k;hint.textContent="";paint()},
    onDel:function(){if(lock)return;val=val.slice(0,-1);paint()},
    onOk:function(){if(lock||!val)return;
      if(val===q.w){lock=true;KB.enable(false);if(!missed){good++;star(true,q)}gap.className="gap ok";gap.textContent=q.w;hint.textContent="Bravo !";
        say(q.full,function(){i++;i<deck.length?show3():end()})}
      else{if(!missed)star(false,q);missed=true;tries++;lock=true;gap.className="gap ko shake";hint.textContent="Essaie encore ! Écoute bien la phrase.";if(tries>=2)say(q.full);
        setTimeout(function(){val="";paint();lock=false},700)}}
  });
  say(q.full);
}
// Conjugaison : être et avoir au présent, tableau à compléter ligne par ligne
var CONJ={etre:{n:"être",r:[["je","suis"],["tu","es"],["il, elle","est"],["nous","sommes"],["vous","êtes"],["ils, elles","sont"]]},
 avoir:{n:"avoir",r:[["j'","ai"],["tu","as"],["il, elle","a"],["nous","avons"],["vous","avez"],["ils, elles","ont"]]}};
var cjSeq,cjI,cjDone=0,cjGood=0,cjMix=false;
function conjMenu(){cjTok++;nokb();cjDone=0;bk.style.display=window.START?"none":"block";
 app.innerHTML='<h1>Conjugue au présent</h1><div class="menu" style="width:100%;display:flex;flex-direction:column;gap:14px"><button class="btn" data-v="etre">être</button><button class="btn" data-v="avoir">avoir</button><button class="btn btn2" data-v="mix">être et avoir</button></div>';
 app.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){var v=b.dataset.v;cjMix=v==="mix";cjSeq=cjMix?(Math.random()<.5?["etre","avoir"]:["avoir","etre"]):[v];cjI=0;cjGood=0;conjTable()}})}
function cjAnswer(ok,verb,row){try{if(parent!==window)parent.postMessage({type:"answer",game:"conj",ok:ok,diff:cjMix?1.25:1,k:CONJ[verb].n,item:row[0].replace(", elles","").replace(", elle","")+(row[0]==="j'"?"":" ")+row[1]},"*")}catch(e){}}
var cjTok=0;
function conjTable(){var tok=++cjTok,V=CONJ[cjSeq[cjI]],row=0,val="",lock=false,tries=0,missed=false;
 app.innerHTML='<p class="vt">Le verbe <b>'+V.n+'</b></p><div class="cj">'+V.r.map(function(r,i){return '<div class="r" id="cr'+i+'"><span class="p">'+r[0]+'</span><span class="v" id="cv'+i+'"></span></div>'}).join("")+'</div><div class="hint" id="hint"></div>';
 var hint=document.getElementById("hint");
 function el(i){return document.getElementById("cr"+i)}
 function paint(){document.getElementById("cv"+row).textContent=val;el(row).className="r on"}
 function activate(){tries=0;missed=false;val="";el(row).className="r on";paint();if(row===0)window.scrollTo(0,0);else el(row).scrollIntoView({block:"nearest",behavior:"smooth"})}
 kb({onKey:function(k){if(lock||val.length>=10)return;val+=k;hint.textContent="";paint()},
  onDel:function(){if(lock)return;val=val.slice(0,-1);paint()},
  onOk:function(){if(lock||!val)return;var r=V.r[row],full=r[0].split(",")[0]+(r[0]==="j'"?"":" ")+r[1];
   if(val===r[1]){lock=true;if(!missed){cjGood++;cjAnswer(true,cjSeq[cjI],r)}el(row).className="r ok";cjDone++;hint.textContent="Bravo !";
    say(full,function(){if(tok!==cjTok)return;lock=false;row++;if(row<V.r.length){hint.textContent="";activate()}else{cjI++;cjI<cjSeq.length?conjTable():conjEnd()}})}
   else{if(!missed)cjAnswer(false,cjSeq[cjI],r);missed=true;tries++;lock=true;el(row).className="r ko shake";hint.textContent="Essaie encore !";if(tries>=2)say(full);
    setTimeout(function(){if(tok!==cjTok)return;val="";el(row).className="r on";paint();lock=false},700)}}});
 activate()}
function conjEnd(){nokb();var tot=cjSeq.length*6;
 app.innerHTML='<h1>Bravo !</h1><div class="big">'+cjGood+' / '+tot+'</div><div class="cnt">du premier coup</div><button class="btn" id="re">Encore</button><button class="btn btn2" id="mn">Autre verbe</button>';
 say("Bravo ! "+cjGood+" sur "+tot);
 document.getElementById("re").onclick=function(){cjI=0;cjGood=0;if(cjMix)cjSeq.reverse();conjTable()};
 document.getElementById("mn").onclick=conjMenu}
function end(){
  nokb();
  var n=Math.round(good/deck.length*10*2)/2,s=String(n).replace(".",",");
  app.innerHTML='<h1>Bravo !</h1><div class="big">'+s+' / 10</div><div class="cnt">'+good+' / '+deck.length+' du premier coup</div><button class="btn" id="re">Rejouer</button><button class="btn btn2" id="mn">Menu</button>';
  document.getElementById("re").onclick=function(){startQ(cur)};
  document.getElementById("mn").onclick=home;
  say("Bravo ! "+s+" sur dix");
}
// bouton retour du téléphone : depuis un tableau de conjugaison, revient au choix du verbe
window.hubBack=function(){if(window.START==5&&!document.querySelector("[data-v]")){conjMenu();return true}return false};
window.START==5?conjMenu():window.START?startQ(window.START==4?4:3):home();
</script>
</body>
</html>
