<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Écris le mot</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3fbf6;--fg:#1d2b24;--mut:#5b6e64;--card:#fff;--bd:#d5e8dc;--fr:#22a861;--ok:#22a861;--bad:#e5484d;--syl:#9b6bff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#121b16;--fg:#eef6f1;--mut:#a3b8ad;--card:#1d2a23;--bd:#30453a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 18px;user-select:none;touch-action:manipulation}
body.withkb{padding-bottom:calc(var(--kbh,250px) + 70px)}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;color:var(--fg)}
[hidden]{display:none!important}
#top{width:100%;max-width:560px;display:flex;justify-content:flex-end;min-height:52px}
#lvlb{min-height:52px;padding:0 16px;border:3px solid var(--bd);background:var(--card);border-radius:16px;font-size:18px;font-weight:700}
#app{width:100%;max-width:440px;display:flex;flex-direction:column;gap:20px;align-items:center;margin-top:3vh}
.ear{background:var(--card);border:3px solid var(--bd);border-radius:50%;width:64px;height:64px;font-size:30px}
.q{font-size:27px;font-weight:600;line-height:1.4}
.q span{white-space:nowrap}
.gap{display:inline-block;min-width:3.4em;padding:0 .2em;border-bottom:4px solid var(--syl);color:var(--syl);font-weight:700;white-space:nowrap}
.gap.ok{color:var(--ok);border-color:var(--ok)}
.gap.ko{color:var(--bad);border-color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{color:var(--mut);font-size:20px;min-height:26px;font-weight:600}
.prog{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;gap:12px;padding:10px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);max-width:560px;margin:0 auto}
body.withkb .prog{bottom:var(--kbh,250px);padding-bottom:10px}
.bar{flex:1;height:14px;background:var(--bd);border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--fr);transition:width .3s}
.cnt{color:var(--mut);font-size:18px;font-weight:600;white-space:nowrap}
.big{font-size:64px;font-weight:700}
h1{margin:0;font-size:34px}
#again{min-width:220px;height:72px;border:0;border-radius:22px;background:var(--fr);color:#fff;font-size:24px;font-weight:700;box-shadow:0 5px 0 #17804a}
.sheet{position:fixed;inset:0;background:rgba(10,30,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.panel{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;text-align:left}
.panel h2{margin:0 0 4px;font-size:26px}
.opt{min-height:64px;border:3px solid var(--bd);background:var(--card);border-radius:18px;font-size:21px;font-weight:700;text-align:left;padding:8px 14px}
.opt small{display:block;font-size:16px;color:var(--mut);font-weight:600}.opt.on{border-color:var(--fr);box-shadow:0 0 0 3px var(--fr)}
#close{height:60px;border:0;border-radius:18px;background:var(--fr);color:#fff;font-size:21px;font-weight:700}
</style>
<script src="jeux/clavier.js"></script>
</head>
<body>
<div id="top"><button id="lvlb"></button></div>
<div id="app"></div>
<div class="sheet" id="sheet" hidden><div class="panel"><h2>Niveau</h2><div id="lvls" style="display:flex;flex-direction:column;gap:10px"></div><button id="close">Fermer</button></div></div>
<script>
(function(){
// Deux exercices de Français écrits au clavier maison (à la demande de l'utilisateur) :
// START 1 = « Les jours, les mois, les saisons » (jeu jours) ; START 2 = « Féminin et pluriel » (jeu femplu).
// Une question = un mot à écrire ; juste du premier coup = message « answer » ; partie de 10 (ou window.PATHN) ; roundEnd à la fin.
var $=function(i){return document.getElementById(i)};
var FP=window.START==2,GAME=FP?"femplu":"jours";
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function voiceFor(l){try{var v=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.indexOf(l)===0});return v.filter(function(x){return x.localService})[0]||v[0]||null}catch(e){return null}}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";var v=voiceFor("fr");if(v)u.voice=v;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
var ac=null;function tone(f,t,d){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C()}if(ac.state==="suspended")ac.resume();var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.16,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function nb(t){return esc(t).split(" ").map(function(w){return"<span>"+w+"</span>"}).join(" ")}
function plain(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim()}

/* ---------- Les jours, les mois, les saisons ---------- */
var J=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
var M=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
var S=["printemps","été","automne","hiver"],SA={"printemps":"le printemps","été":"l'été","automne":"l'automne","hiver":"l'hiver"};
var SF=[["En quelle saison tombe la neige ?","hiver"],["En quelle saison les feuilles des arbres tombent-elles ?","automne"],["En quelle saison les fleurs commencent-elles à pousser ?","printemps"],
 ["En quelle saison fait-il le plus chaud ?","été"],["En quelle saison fête-t-on Noël ?","hiver"],["En quelle saison va-t-on se baigner à la plage ?","été"]];
function nx(a,x,d){return a[(a.indexOf(x)+d+a.length)%a.length]}
function qJour(){var j=pick(J),t=Math.floor(Math.random()*4);
 if(t===0)return{q:"Quel jour vient après "+j+" ?",a:nx(J,j,1),k:"Les jours"};
 if(t===1)return{q:"Quel jour vient avant "+j+" ?",a:nx(J,j,-1),k:"Les jours"};
 if(t===2)return{q:"Aujourd'hui, c'est "+j+". Quel jour serons-nous demain ?",a:nx(J,j,1),k:"Les jours"};
 return{q:"Aujourd'hui, c'est "+j+". Quel jour étions-nous hier ?",a:nx(J,j,-1),k:"Les jours"}}
function qSaison(){if(Math.random()<.5){var f=pick(SF);return{q:f[0],a:f[1],k:"Les saisons"}}
 var s=pick(S),ap=Math.random()<.5;return{q:"Quelle saison vient "+(ap?"après ":"avant ")+SA[s]+" ?",a:nx(S,s,ap?1:-1),k:"Les saisons"}}
function qMois(){var m=pick(M),ap=Math.random()<.5;return{q:"Quel mois vient "+(ap?"après ":"avant ")+m+" ?",a:nx(M,m,ap?1:-1),k:"Les mois"}}
var LVJ=[null,{t:"Facile",d:"Les jours de la semaine",x:1,g:[qJour]},{t:"Moyen",d:"Les jours et les saisons",x:1.25,g:[qJour,qSaison]},{t:"Difficile",d:"Les jours, les saisons et les mois",x:1.5,g:[qJour,qSaison,qMois]}];

/* ---------- Féminin et pluriel ---------- */
// [début de phrase, mot de départ, début de la réponse, réponse, catégorie]
var PLM=["chat","chien","livre","ami","arbre","vélo","crayon","ballon","lapin","garçon","camion","stylo","cahier","train","mouton","canard","jouet","sac"];
var PLF=["fleur","pomme","poule","fille","maison","voiture","robe","porte","table","tortue","fraise","étoile","chaise","valise"];
var FEN=[["un ami","une","amie"],["un voisin","une","voisine"],["un cousin","une","cousine"],["un marchand","une","marchande"],["un client","une","cliente"],["un ours brun","une ourse","brune"]];
var FEA=["grand","petit","content","poli","fort","blond","prudent","joli","gourmand","lent"];
var HARDP=[["un oiseau","des","oiseaux"],["un gâteau","des","gâteaux"],["un cheval","des","chevaux"],["un jeu","des","jeux"],["un chapeau","des","chapeaux"],["un journal","des","journaux"],["un bateau","des","bateaux"],["un cadeau","des","cadeaux"]];
var HARDF=[["un chanteur","une","chanteuse"],["un danseur","une","danseuse"],["un boulanger","une","boulangère"],["un lion","une","lionne"],["un chien","une","chienne"],["un prince","une","princesse"],["un roi","une","reine"],["un fermier","une","fermière"]];
function qPl(){var f=Math.random()<.45,w=pick(f?PLF:PLM);return{q0:(f?"une ":"un ")+w,q1:"des",a:w+"s",base:w,k:"Le pluriel"}}
function qFe(){if(Math.random()<.5){var x=pick(FEN);return{q0:x[0],q1:x[1],a:x[2],base:x[0].split(" ").pop(),k:"Le féminin"}}
 var a=pick(FEA);return{q0:"il est "+a,q1:"elle est",a:a+"e",base:a,k:"Le féminin"}}
function qHard(){var p=Math.random()<.5,x=pick(p?HARDP:HARDF);return{q0:x[0],q1:x[1],a:x[2],base:x[0].split(" ").pop(),k:p?"Pluriels en x":"Féminins difficiles"}}
var LVF=[null,{t:"Facile",d:"Le pluriel : un chat → des chats",x:1,g:[qPl]},{t:"Moyen",d:"Le pluriel et le féminin : il est grand → elle est grande",x:1.25,g:[qPl,qFe]},{t:"Difficile",d:"Avec des mots qui changent : un cheval → des chevaux",x:1.5,g:[qPl,qFe,qHard]}];
function fpText(q){return q.q0+", "+q.q1+" "+q.a}

var LV=FP?LVF:LVJ;
var PK="@"+(window.PROFILE||"p1");function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var level=Math.min(3,Math.max(1,parseInt(ls(GAME+"_lvl"+PK))||1));
var N=window.PATHN||10,deck,qi,good,cur,val,miss,busy,KB=null;
function kbh(){var k=document.querySelector(".kb");if(k)document.body.style.setProperty("--kbh",k.offsetHeight+"px")}
window.addEventListener("resize",kbh);
function gen(){var seen={},d=[],k=0;while(d.length<N&&k++<500){var g=LV[level].g,q=g[d.length%g.length]();var id=(q.q||q.q0)+"|"+q.a;if(seen[id])continue;seen[id]=1;d.push(q)}return shuffle(d)}
function start(){$("lvlb").textContent="Niveau : "+LV[level].t;deck=gen();qi=0;good=0;
 if(!KB){KB=Clavier({acc:"éèêàçû",onKey:key,onDel:del,onOk:ok});document.body.classList.add("withkb");kbh();requestAnimationFrame(kbh)}KB.show();show()}
function show(){cur=deck[qi];val="";miss=0;busy=false;KB.enable(true);
 var h=FP?'<div class="q">'+nb(cur.q0)+'<br>→ '+nb(cur.q1)+' <span class="gap" id="gap">&nbsp;</span></div>':'<div class="q">'+nb(cur.q)+'</div><div class="q"><span class="gap" id="gap">&nbsp;</span></div>';
 $("app").innerHTML='<button class="ear" id="ear" aria-label="Réécouter">🔊</button>'+h+'<div class="hint" id="hint"></div><div class="prog"><div class="bar"><i style="width:'+(qi/deck.length*100)+'%"></i></div><div class="cnt">'+(qi+1)+" / "+deck.length+"</div></div>";
 $("ear").onclick=speak;setTimeout(speak,250)}
function speak(){say(FP?cur.q0+". "+cur.q1+" … ?":cur.q)}
function paint(){var g=$("gap");g.className="gap";g.innerHTML=val?esc(val):"&nbsp;"}
function key(k){if(busy||val.length>=16)return;val+=k;$("hint").textContent="";paint()}
function del(){if(busy)return;val=val.slice(0,-1);paint()}
function answer(ok){try{if(parent!==window)parent.postMessage({type:"answer",game:GAME,ok:ok,diff:LV[level].x,k:cur.k,item:FP?cur.q0+" → "+cur.q1+" "+cur.a:cur.q},"*")}catch(e){}}
function ok(){if(busy||!val)return;var g=$("gap");
 if(plain(val)===plain(cur.a)){busy=true;KB.enable(false);if(!miss){good++;answer(true)}g.className="gap ok";g.textContent=cur.a;tone(660,0,.12);tone(880,.1,.2);
  $("hint").textContent=val===cur.a?"Bravo !":"Bravo ! Attention aux accents : "+cur.a;say(FP?"Bravo ! "+fpText(cur):"Bravo ! "+cur.a);
  setTimeout(function(){qi++;if(qi<deck.length)show();else end()},2000);return}
 if(!miss)answer(false);miss++;g.className="gap ko";tone(220,0,.25);
 var h="Essaie encore !";
 if(FP&&plain(val)===plain(cur.base))h=cur.k.indexOf("pluriel")>=0||cur.q1==="des"?"N'oublie pas la marque du pluriel !":"N'oublie pas la marque du féminin !";
 if(miss>=2){h="Recopie : "+cur.a;say(FP?fpText(cur):cur.a)}
 $("hint").textContent=h;busy=true;setTimeout(function(){val="";paint();busy=false},700)}
function end(){KB.hide();document.body.classList.remove("withkb");
 $("app").innerHTML='<h1>🎉 Bravo !</h1><div class="big">'+good+" / "+deck.length+'</div><div class="cnt">du premier coup</div><button id="again">Encore</button>';
 $("again").onclick=start;[523,659,784,1047].forEach(function(f,k){tone(f,k*.1,.25)});say("Bravo ! "+good+" sur "+deck.length);
 try{if(parent!==window)parent.postMessage({type:"roundEnd"},"*")}catch(e){}}
$("lvlb").onclick=function(){$("lvls").innerHTML=[1,2,3].map(function(i){return '<button class="opt'+(i===level?" on":"")+'" data-l="'+i+'">'+LV[i].t+"<small>"+LV[i].d+"</small></button>"}).join("");$("sheet").hidden=false;if(KB)KB.hide()};
$("lvls").onclick=function(e){var b=e.target.closest("[data-l]");if(!b)return;level=+b.dataset.l;ls(GAME+"_lvl"+PK,level);$("sheet").hidden=true;start()};
$("close").onclick=function(){$("sheet").hidden=true;if(KB&&cur&&$("gap"))KB.show()};
window.hubBack=function(){if(!$("sheet").hidden){$("close").onclick();return true}return false};
window.__E={cur:function(){return cur&&cur.a}};
start();
})();
</script>
</body>
</html>
