<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les parties du corps</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3fbf6;--fg:#1d2b24;--mut:#5b6e64;--card:#fff;--bd:#d5e8dc;--fr:#22a861;--ok:#22a861;--ko:#e5484d;--syl:#9b6bff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#121b16;--fg:#eef6f1;--mut:#a3b8ad;--card:#1d2a23;--bd:#30453a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;user-select:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;color:var(--fg)}
[hidden]{display:none!important}
#inner{position:fixed;left:0;right:0;top:0;bottom:0;max-width:560px;margin:0 auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
body.withkb #inner{bottom:var(--kbh,250px)}
#top{display:flex;justify-content:space-between;gap:10px}
#lang{min-height:52px;padding:0 14px;border:3px solid var(--bd);background:var(--card);border-radius:16px;font-size:18px;font-weight:700}
#lvlb{min-height:52px;padding:0 16px;border:3px solid var(--bd);background:var(--card);border-radius:16px;font-size:18px;font-weight:700}
#ask{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--bd);border-radius:22px;padding:8px 12px}
#ear{flex:none;width:60px;height:60px;border:0;border-radius:18px;background:var(--fr);color:#fff;font-size:28px;box-shadow:0 4px 0 #17804a}
#name{flex:1;font-size:min(7vw,28px);font-weight:700;line-height:1.2}
#name span{white-space:nowrap}
#bw{flex:1;min-height:0;display:flex;justify-content:center}
#body{height:100%;max-width:100%}
#body .z{fill:transparent;cursor:pointer}
#body .z.ok{fill:rgba(34,168,97,.35);stroke:#22a861;stroke-width:6}
#body .z.ko{fill:rgba(229,72,77,.35);stroke:#e5484d;stroke-width:6}
#gapw{font-size:28px;font-weight:700;text-align:center;min-height:40px}
.gap{display:inline-block;min-width:4em;border-bottom:4px solid var(--syl);color:var(--syl);padding:0 .2em}
.gap.ok{color:var(--ok);border-color:var(--ok)}.gap.ko{color:var(--ko);border-color:var(--ko)}
#msg{min-height:28px;text-align:center;font-size:20px;font-weight:700}
#cnt{text-align:center;color:var(--mut);font-size:18px;font-weight:600}
#end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#end b{font-size:34px}#end p{font-size:22px;margin:0}
#again{min-width:220px;height:72px;border:0;border-radius:22px;background:var(--fr);color:#fff;font-size:24px;font-weight:700;box-shadow:0 5px 0 #17804a}
.sheet{position:fixed;inset:0;background:rgba(10,30,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.panel{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0 0 4px;font-size:26px}
.opt{min-height:64px;border:3px solid var(--bd);background:var(--card);border-radius:18px;font-size:21px;font-weight:700;text-align:left;padding:8px 14px}
.opt small{display:block;font-size:16px;color:var(--mut);font-weight:600}.opt.on{border-color:var(--fr);box-shadow:0 0 0 3px var(--fr)}
#close{height:60px;border:0;border-radius:18px;background:var(--fr);color:#fff;font-size:21px;font-weight:700}
</style>
<script src="jeux/clavier.js"></script>
</head>
<body>
<div id="inner">
  <div id="top"><button id="lang" aria-label="Langue"></button><button id="lvlb"></button></div>
  <div id="ask"><button id="ear" aria-label="Réécouter">🔊</button><span id="name"></span></div>
  <div id="bw"><svg id="body" viewBox="40 60 430 910"></svg></div>
  <div id="gapw" hidden><span class="gap" id="gap">&nbsp;</span></div>
  <div id="msg"></div>
  <div id="cnt"></div>
  <div id="end" hidden><b>🎉 Bravo !</b><p id="score"></p><button id="again">Encore</button></div>
</div>
<div class="sheet" id="sheet" hidden><div class="panel"><h2>Niveau</h2><div id="lvls" style="display:flex;flex-direction:column;gap:10px"></div><button id="close">Fermer</button></div></div>
<script>
(function(){
// Les parties du corps (Biologie, à la demande de l'utilisateur) : un enfant dessiné de face (image crayon).
// Facile / Moyen : « Où est le genou ? » → on touche la partie du corps (zones invisibles, plus grandes que le dessin pour les petites parties).
// Difficile : une flèche montre une partie, on écrit son nom avec le clavier maison.
var $=function(i){return document.getElementById(i)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function voiceFor(l){try{var v=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.indexOf(l)===0});return v.filter(function(x){return x.localService})[0]||v[0]||null}catch(e){return null}}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=DE?"de-DE":"fr-FR";var v=voiceFor(DE?"de":"fr");if(v)u.voice=v;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
var ac=null;function tone(f,t,d){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C()}if(ac.state==="suspended")ac.resume();var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.16,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
function plain(s){return s.toLowerCase().replace(/œ/g,"oe").normalize("NFD").replace(/[̀-ͯ]/g,"").trim()}
function nb(t){return t.split(" ").map(function(w){return"<span>"+w+"</span>"}).join(" ")}
// partie : [nom avec article, réponses écrites acceptées, pluriel ?, point visé par la flèche]
var P={tete:["la tête",["tête"],0,[255,135]],cheveux:["les cheveux",["cheveux"],1,[255,95]],yeux:["les yeux",["yeux","œil","oeil"],1,[223,191]],nez:["le nez",["nez"],0,[255,215]],
 bouche:["la bouche",["bouche"],0,[255,242]],oreille:["l'oreille",["oreille","oreilles"],0,[176,212]],cou:["le cou",["cou"],0,[255,280]],epaule:["l'épaule",["épaule","épaules"],0,[165,330]],
 bras:["le bras",["bras"],0,[385,500]],coude:["le coude",["coude","coudes"],0,[382,450]],main:["la main",["main","mains"],0,[418,565]],doigt:["le doigt",["doigt","doigts"],0,[425,600]],
 ventre:["le ventre",["ventre"],0,[255,470]],jambe:["la jambe",["jambe","jambes"],0,[300,800]],genou:["le genou",["genou","genoux"],0,[300,722]],pied:["le pied",["pied","pieds"],0,[330,930]]};
// en allemand (bouton 🇫🇷 / 🇩🇪, à la demande de l'utilisateur) : [nom avec article, réponses écrites acceptées (avec ou sans article), pluriel ?]
var PD={tete:["der Kopf",["Kopf"],0],cheveux:["die Haare",["Haare","Haar"],1],yeux:["die Augen",["Augen","Auge"],1],nez:["die Nase",["Nase"],0],bouche:["der Mund",["Mund"],0],
 oreille:["das Ohr",["Ohr","Ohren"],0],cou:["der Hals",["Hals"],0],epaule:["die Schulter",["Schulter","Schultern"],0],bras:["der Arm",["Arm","Arme"],0],coude:["der Ellbogen",["Ellbogen","Ellenbogen"],0],
 main:["die Hand",["Hand","Hände"],0],doigt:["der Finger",["Finger"],0],ventre:["der Bauch",["Bauch"],0],jambe:["das Bein",["Bein","Beine"],0],genou:["das Knie",["Knie"],0],pied:["der Fuß",["Fuß","Fuss","Füße"],0]};
var PKL="@"+(window.PROFILE||"p1"),DE=false;try{DE=localStorage.getItem("corps_lang"+PKL)==="de"}catch(e){}
function NM(k){var p=DE?PD[k]:P[k];return{n:p[0],a:p[1],pl:p[2]}}
function T(fr,de){return DE?de:fr}
var LV=[null,{t:"Facile",d:"Touche : la tête, le nez, la main, le pied…",p:["tete","cheveux","yeux","nez","bouche","oreille","bras","main","ventre","jambe","pied"],w:0,x:1},
 {t:"Moyen",d:"En plus : le cou, l'épaule, le coude, le genou, le doigt",p:["tete","cheveux","yeux","nez","bouche","oreille","bras","main","ventre","jambe","pied","cou","epaule","coude","genou","doigt"],w:0,x:1.25},
 {t:"Difficile",d:"Une flèche montre une partie : écris son nom",p:["tete","cheveux","yeux","nez","bouche","oreille","cou","epaule","bras","coude","main","ventre","jambe","genou","pied"],w:1,x:1.5}];
// dessin de l'enfant (de face) puis zones à toucher, des plus grandes aux plus petites (les petites passent devant)
// dessin de l'enfant : image crayon (Gemini, détourée, 506 × 1024) ; zones à toucher recalées sur l'image, des plus grandes aux plus petites
var ART='<image href="jeux/img/corps.webp" x="0" y="0" width="506" height="1024"/>';
var Z=[["tete",'<ellipse cx="255" cy="185" rx="92" ry="100"/>'],
 ["bras",'<polygon points="140,330 175,330 140,560 100,550"/><polygon points="335,330 370,330 410,550 370,560"/>'],
 ["jambe",'<rect x="172" y="640" width="80" height="240"/><rect x="258" y="640" width="80" height="240"/>'],
 ["ventre",'<rect x="185" y="410" width="140" height="130"/>'],
 ["pied",'<ellipse cx="180" cy="925" rx="48" ry="30"/><ellipse cx="328" cy="925" rx="48" ry="30"/>'],
 ["main",'<circle cx="95" cy="570" r="38"/><circle cx="415" cy="570" r="38"/>'],
 ["cheveux",'<polygon points="168,190 170,110 210,78 300,78 340,110 342,190 320,150 255,115 190,150"/>'],
 ["oreille",'<ellipse cx="176" cy="210" rx="18" ry="28"/><ellipse cx="336" cy="210" rx="18" ry="28"/>'],
 ["cou",'<rect x="225" y="262" width="60" height="32"/>'],
 ["epaule",'<circle cx="168" cy="322" r="26"/><circle cx="342" cy="322" r="26"/>'],
 ["coude",'<circle cx="128" cy="450" r="22"/><circle cx="382" cy="450" r="22"/>'],
 ["genou",'<circle cx="210" cy="722" r="26"/><circle cx="300" cy="722" r="26"/>'],
 ["doigt",'<rect x="55" y="580" width="60" height="40"/><rect x="395" y="580" width="60" height="40"/>'],
 ["yeux",'<circle cx="223" cy="191" r="16"/><circle cx="287" cy="191" r="16"/>'],
 ["nez",'<ellipse cx="255" cy="215" rx="13" ry="13"/>'],
 ["bouche",'<ellipse cx="255" cy="240" rx="28" ry="14"/>']];
var PK="@"+(window.PROFILE||"p1");function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var level=Math.min(3,Math.max(1,parseInt(ls("corps_lvl"+PK))||1));
var N=window.PATHN||10,deck,qi,good,cur,miss,busy,val="",KB=null;
function kbh(){var k=document.querySelector(".kb");if(k)document.body.style.setProperty("--kbh",k.offsetHeight+"px")}
window.addEventListener("resize",kbh);
function zones(L){return Z.filter(function(z){return L.w||L.p.indexOf(z[0])>=0||true}).map(function(z){return '<g class="z" data-k="'+z[0]+'">'+z[1]+"</g>"}).join("")}
function ask(){var p=NM(cur);return LV[level].w?T("Comment ça s'appelle ?","Wie heißt das?"):DE?(p.pl?"Wo sind ":"Wo ist ")+p.n+"?":(p.pl?"Où sont ":"Où est ")+p.n+" ?"}
function start(){var L=LV[level],d=[];while(d.length<N)d=d.concat(shuffle(L.p));deck=d.slice(0,N);qi=0;good=0;$("lvlb").textContent="Niveau : "+L.t;
 $("end").hidden=true;$("ask").hidden=$("bw").hidden=$("cnt").hidden=$("msg").hidden=false;$("gapw").hidden=!L.w;
 if(L.w&&KB&&KB.de!==DE){KB.destroy();KB=null}
 if(L.w&&!KB){KB=Clavier({acc:DE?"äöüß":"éèêàç",space:DE,onKey:function(k){if(busy||val.length>=12)return;val+=k;paint()},onDel:function(){if(busy)return;val=val.slice(0,-1);paint()},onOk:check});KB.de=DE;document.body.classList.add("withkb");kbh();requestAnimationFrame(kbh)}
 if(!L.w&&KB){KB.destroy();KB=null;document.body.classList.remove("withkb")}
 if(KB)KB.show();show()}
function arrow(t){var x=t[0],y=t[1],fx=x<253?x-90:x+90,fy=y-60;
 return '<g stroke="#9b6bff" stroke-width="10" stroke-linecap="round" fill="none"><path d="M'+fx+" "+fy+" L"+x+" "+y+'"/></g><circle cx="'+x+'" cy="'+y+'" r="13" fill="#9b6bff" stroke="#fff" stroke-width="4"/><circle cx="'+fx+'" cy="'+fy+'" r="9" fill="#9b6bff"/>'}
function show(){var L=LV[level];cur=deck[qi];miss=0;busy=false;val="";
 $("body").innerHTML=ART+zones(L)+(L.w?arrow(P[cur][3]):"");
 // en écriture (clavier affiché, moins de place) : on zoome sur la partie du corps montrée par la flèche
 var y=P[cur][3][1];$("body").setAttribute("viewBox",!L.w?"40 60 430 910":y<300?"110 30 290 300":y<650?"20 280 470 380":"110 560 300 420");$("msg").textContent="";
 $("name").innerHTML=nb(ask());$("cnt").textContent=(qi+1)+" / "+deck.length;if(L.w){paint();KB.enable(true)}
 setTimeout(function(){say(ask())},250)}
function paint(){var g=$("gap");g.className="gap";g.innerHTML=val?val.replace(/</g,""):"&nbsp;"}
$("ear").onclick=function(){if(cur)say(ask())};
function answer(ok){try{if(parent!==window)parent.postMessage({type:"answer",game:"corps",ok:ok,diff:LV[level].x,k:LV[level].w?"Écrire le nom":"Montrer",item:P[cur][0]+(DE?" · "+PD[cur][0]:"")},"*")}catch(e){}}
function win(){busy=true;tone(660,0,.12);tone(880,.1,.2);if(!miss){good++;answer(true)}var nm=NM(cur).n,t=nm.charAt(0).toUpperCase()+nm.slice(1);
 $("msg").textContent="✅ "+t;say(T("Bravo ! ","Super! ")+nm);setTimeout(function(){qi++;if(qi<deck.length)show();else end()},1800)}
$("body").addEventListener("click",function(e){var z=e.target.closest(".z");if(!z||busy||!cur||LV[level].w)return;var k=z.dataset.k;
 if(k===cur){z.classList.add("ok");win()}
 else{if(!miss)answer(false);miss++;z.classList.add("ko");tone(220,0,.25);var t=T("Ça, c'est ","Das ist ")+NM(k).n+".";$("msg").textContent=t;say(t);
  setTimeout(function(){z.classList.remove("ko")},900);
  if(miss>=2){var c=$("body").querySelector('.z[data-k="'+cur+'"]');if(c)c.classList.add("ok")}}});
function check(){if(busy||!val||!LV[level].w)return;var g=$("gap");
 var v=plain(val).replace(/^(der|die|das) /,"");if(NM(cur).a.some(function(a){return plain(a)===v})){g.className="gap ok";g.textContent=DE?NM(cur).n:NM(cur).a[0];KB.enable(false);win();return}
 if(!miss)answer(false);miss++;g.className="gap ko";tone(220,0,.25);busy=true;
 var t=miss>=2?T("Recopie : ","Schreib ab: ")+(DE?NM(cur).n:NM(cur).a[0]):T("Essaie encore !","Versuch es noch einmal!");$("msg").textContent=t;if(miss>=2)say(NM(cur).n);
 setTimeout(function(){val="";paint();busy=false},700)}
function end(){$("ask").hidden=$("bw").hidden=$("cnt").hidden=$("msg").hidden=$("gapw").hidden=true;if(KB)KB.hide();document.body.classList.remove("withkb");
 $("end").hidden=false;$("score").textContent=good+" / "+deck.length+" du premier coup";cur=null;
 [523,659,784,1047].forEach(function(f,k){tone(f,k*.1,.25)});
 try{if(parent!==window)parent.postMessage({type:"roundEnd"},"*")}catch(e){}}
function langBtn(){$("lang").textContent=DE?"🇩🇪 Deutsch":"🇫🇷 Français"}
$("lang").onclick=function(){DE=!DE;try{localStorage.setItem("corps_lang"+PKL,DE?"de":"fr")}catch(e){}langBtn();start()};
langBtn();
$("again").onclick=function(){if(KB)document.body.classList.add("withkb");start()};
$("lvlb").onclick=function(){$("lvls").innerHTML=[1,2,3].map(function(i){return '<button class="opt'+(i===level?" on":"")+'" data-l="'+i+'">'+LV[i].t+"<small>"+LV[i].d+"</small></button>"}).join("");$("sheet").hidden=false;if(KB)KB.hide()};
$("lvls").onclick=function(e){var b=e.target.closest("[data-l]");if(!b)return;level=+b.dataset.l;ls("corps_lvl"+PK,level);$("sheet").hidden=true;start()};
$("close").onclick=function(){$("sheet").hidden=true;if(KB&&cur)KB.show()};
window.hubBack=function(){if(!$("sheet").hidden){$("close").onclick();return true}return false};
window.__C={cur:function(){return cur},center:function(){return P[cur][3]}};
start();
})();
</script>
</body>
</html>
