<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retrouve le drapeau</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ea;--fg:#2b2440;--mut:#6c6487;--card:#fff;--bd:#eadfc8;--geo:#c08a1e;--ok:#22a861;--ko:#e5484d;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a2b;--fg:#f3effa;--mut:#b4abcc;--card:#2a2640;--bd:#3d3758}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;user-select:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
[hidden]{display:none!important}
#inner{position:fixed;inset:0;max-width:560px;margin:0 auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
#ask{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--bd);border-radius:22px;padding:10px 12px}
#ear{flex:none;width:64px;height:64px;border:0;border-radius:18px;background:var(--geo);color:#fff;font-size:30px;box-shadow:0 4px 0 #8a6210}
#name{flex:1;min-width:0;font-size:min(8vw,32px);font-weight:700;line-height:1.15;overflow-wrap:normal;word-break:keep-all} /* nom entier : retour à la ligne entre les mots, jamais dans un mot */
#grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:center}
#grid.g6{gap:10px}#grid.g6 .fl{aspect-ratio:4/3}
#top{display:flex;justify-content:flex-end}
#lvlb{min-height:52px;padding:0 16px;border:3px solid var(--bd);background:var(--card);color:var(--fg);border-radius:16px;font-size:18px;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(10,8,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.panel{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0 0 4px;font-size:26px}
.opt{min-height:64px;border:3px solid var(--bd);background:var(--card);color:var(--fg);border-radius:18px;font-size:21px;font-weight:700;text-align:left;padding:8px 14px}
.opt small{display:block;font-size:16px;color:var(--mut);font-weight:600}.opt.on{border-color:var(--geo);box-shadow:0 0 0 3px var(--geo)}
#close{height:60px;border:0;border-radius:18px;background:var(--geo);color:#fff;font-size:21px;font-weight:700}
.fl{aspect-ratio:3/2;border:4px solid var(--bd);border-radius:16px;background:var(--card);padding:6px;display:flex;align-items:center;justify-content:center;position:relative}
.fl img{width:100%;height:100%;object-fit:contain;border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.fl.ok{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok);animation:pop .4s}
.fl.ko{border-color:var(--ko);opacity:.45;animation:shake .35s}
.fl.ko::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:700;color:var(--ko)}
@keyframes pop{50%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#cnt{text-align:center;color:var(--mut);font-size:18px;font-weight:600}
#end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#end b{font-size:34px}#end p{font-size:22px;margin:0}
#again{min-width:220px;height:72px;border:0;border-radius:22px;background:var(--geo);color:#fff;font-size:24px;font-weight:700;box-shadow:0 5px 0 #8a6210}
</style>
</head>
<body>
<div id="inner">
  <div id="top"><button id="lvlb"></button></div>
  <div id="ask"><button id="ear" aria-label="Réécouter">🔊</button><span id="name"></span></div>
  <div id="grid"></div>
  <div id="cnt"></div>
  <div id="end" hidden><b>🎉 Bravo !</b><p id="score"></p><button id="again">Encore</button></div>
</div>
<div class="sheet" id="sheet" hidden><div class="panel"><h2>Niveau</h2><div id="lvls" style="display:flex;flex-direction:column;gap:10px"></div><button id="close">Fermer</button></div></div>
<script>
(function(){
// Retrouve le drapeau (matière Géographie) : la voix nomme un pays d'Europe, l'enfant touche son drapeau (3 niveaux, bouton Niveau).
// Partie de 10 pays ; un message « answer » par pays (juste du premier coup), roundEnd en fin de partie.
function fitName(t){var e=document.getElementById("name");e.style.fontSize="";e.innerHTML=t.split(" ").map(function(w){return '<span style="white-space:nowrap">'+w.replace(/</g,"&lt;")+"</span>"}).join(" ");var fs=parseFloat(getComputedStyle(e).fontSize);while((e.scrollWidth>e.clientWidth+1||e.offsetHeight>fs*1.15*2+2)&&fs>14){fs-=1;e.style.fontSize=fs+"px"}}window.__fitName=fitName; // nom toujours entièrement lisible
var $=function(i){return document.getElementById(i)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function voiceFor(l){try{var v=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.indexOf(l)===0});return v.filter(function(x){return x.localService})[0]||v[0]||null}catch(e){return null}}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";var v=voiceFor("fr");if(v)u.voice=v;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
var ac=null;function tone(f,t,d){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C()}if(ac.state==="suspended")ac.resume();var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.18,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
// Drapeaux : jeux/img/drapeaux/<code>.webp (paquet flag-icons, licence MIT, rendus en 320×240).
var C=[["fr","la France"],["de","l'Allemagne"],["it","l'Italie"],["es","l'Espagne"],["pt","le Portugal"],["be","la Belgique"],["nl","les Pays-Bas"],["lu","le Luxembourg"],["at","l'Autriche"],["ie","l'Irlande"],["gr","la Grèce"],["pl","la Pologne"],["se","la Suède"],["fi","la Finlande"],["dk","le Danemark"],["eu","l'Union européenne"],
 ["al","l'Albanie"],["ad","l'Andorre"],["by","la Biélorussie"],["ba","la Bosnie-Herzégovine"],["bg","la Bulgarie"],["hr","la Croatie"],["cy","Chypre"],["cz","la Tchéquie"],["ee","l'Estonie"],["hu","la Hongrie"],["is","l'Islande"],["lv","la Lettonie"],["li","le Liechtenstein"],["lt","la Lituanie"],["mt","Malte"],["md","la Moldavie"],["mc","Monaco"],["me","le Monténégro"],["mk","la Macédoine du Nord"],["no","la Norvège"],["ro","la Roumanie"],["ru","la Russie"],["sm","Saint-Marin"],["rs","la Serbie"],["sk","la Slovaquie"],["si","la Slovénie"],["ch","la Suisse"],["ua","l'Ukraine"],["gb","le Royaume-Uni"],["va","le Vatican"]];
// niveaux : Facile = 15 pays connus de l'UE + le drapeau européen, 4 drapeaux ; Moyen = toute l'Europe (45 pays), 4 drapeaux ; Difficile = toute l'Europe, 6 drapeaux
var LV=[null,{t:"Facile",d:"15 pays connus de l'Union européenne et son drapeau",n:16,c:4,x:1},{t:"Moyen",d:"Tous les pays d'Europe",n:C.length,c:4,x:1.5},{t:"Difficile",d:"Tous les pays d'Europe, 6 drapeaux",n:C.length,c:6,x:2}];
var PK="@"+(window.PROFILE||"p1");function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var level=Math.min(3,Math.max(1,parseInt(ls("drapeau_lvl"+PK))||1));
function img(x){return '<img src="jeux/img/drapeaux/'+x[0]+'.webp" alt="" draggable="false">'}
var N=10,deck,qi,good,cur,miss,busy,P;
function start(){P=C.slice(0,LV[level].n);deck=shuffle(P).slice(0,N);qi=0;good=0;$("lvlb").textContent="Niveau : "+LV[level].t;$("end").hidden=true;$("ask").hidden=$("grid").hidden=$("cnt").hidden=false;show()}
function show(){cur=deck[qi];miss=false;busy=false;var L=LV[level];
 var ch=shuffle([cur].concat(shuffle(P.filter(function(x){return x!==cur})).slice(0,L.c-1)));
 $("grid").className=L.c>4?"g6":"";
 $("grid").innerHTML=ch.map(function(x){return '<button class="fl" data-n="'+C.indexOf(x)+'" aria-label="drapeau">'+img(x)+"</button>"}).join("");
 fitName(cur[1].charAt(0).toUpperCase()+cur[1].slice(1));$("cnt").textContent=(qi+1)+" / "+N;
 setTimeout(function(){say(cur[1])},250)}
$("ear").onclick=function(){if(cur)say(cur[1])};
$("grid").addEventListener("click",function(e){var b=e.target.closest(".fl");if(!b||busy||b.classList.contains("ko"))return;var x=C[+b.dataset.n];
 if(x===cur){busy=true;b.classList.add("ok");tone(660,0,.12);tone(880,.1,.2);say("Bravo !");if(!miss)good++;
  try{if(parent!==window)parent.postMessage({type:"answer",game:"drapeau",ok:!miss,diff:LV[level].x,k:LV[level].t,item:cur[1]},"*")}catch(er){}
  setTimeout(function(){qi++;if(qi<N)show();else end()},1400)}
 else{miss=true;b.classList.add("ko");tone(220,0,.25)}});
function end(){$("ask").hidden=$("grid").hidden=$("cnt").hidden=true;$("end").hidden=false;$("score").textContent=good+" / "+N+" du premier coup";cur=null;
 [523,659,784,1047].forEach(function(f,k){tone(f,k*.1,.25)});
 try{if(parent!==window)parent.postMessage({type:"roundEnd"},"*")}catch(e){}}
$("again").onclick=start;
$("lvlb").onclick=function(){$("lvls").innerHTML=[1,2,3].map(function(i){return '<button class="opt'+(i===level?" on":"")+'" data-l="'+i+'">'+LV[i].t+"<small>"+LV[i].d+"</small></button>"}).join("");$("sheet").hidden=false};
$("lvls").onclick=function(e){var b=e.target.closest("[data-l]");if(!b)return;level=+b.dataset.l;ls("drapeau_lvl"+PK,level);$("sheet").hidden=true;start()};
$("close").onclick=function(){$("sheet").hidden=true};
window.hubBack=function(){if(!$("sheet").hidden){$("sheet").hidden=true;return true}return false};
window.__D={cur:function(){return cur&&cur[0]}};
start();
})();
</script>
</body>
</html>
