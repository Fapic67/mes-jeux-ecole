<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trouve le pays</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="jeux/europe-carte.js"></script>
<script src="jeux/monde-carte.js"></script>
<style>
:root{--bg:#fbf6ea;--fg:#2b2440;--mut:#6c6487;--card:#fff;--bd:#eadfc8;--geo:#c08a1e;--ok:#22a861;--ko:#e5484d;--sea:#bfe3f5;--land:#f3ead2;--ctx:#dcd8cf;--line:#9a8f78;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a2b;--fg:#f3effa;--mut:#b4abcc;--card:#2a2640;--bd:#3d3758;--sea:#28466a;--land:#d9cfb2;--ctx:#8e8a82;--line:#5c5444}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif;user-select:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
[hidden]{display:none!important}
#inner{position:fixed;inset:0;max-width:760px;margin:0 auto;padding:12px 10px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
#ask{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--bd);border-radius:22px;padding:10px 12px}
#ear{flex:none;width:64px;height:64px;border:0;border-radius:18px;background:var(--geo);color:#fff;font-size:30px;box-shadow:0 4px 0 #8a6210}
#name{flex:1;min-width:0;font-size:min(8vw,32px);font-weight:700;line-height:1.15;overflow-wrap:normal;word-break:keep-all} /* nom entier : retour à la ligne entre les mots, jamais dans un mot */
#mapw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#flag{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(46%,200px);aspect-ratio:4/3;border-radius:10px;box-shadow:0 0 0 3px #fff,0 6px 18px rgba(0,0,0,.35);pointer-events:none;animation:fin .25s}
@keyframes fin{from{opacity:0;transform:translateX(-50%) scale(.6)}}
#map{width:100%;height:100%;max-height:100%;border-radius:18px;border:3px solid var(--bd);background:var(--sea);touch-action:none}
#unzoom{position:absolute;right:10px;bottom:10px;width:56px;height:56px;border:3px solid var(--bd);border-radius:16px;background:var(--card);color:var(--fg);font-size:26px;box-shadow:0 3px 0 var(--bd)}
#map path{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#map path.c{fill:var(--ctx)}
#map path.e{fill:var(--land);cursor:pointer}
#map path.ok{fill:#6fcf86}
#map path.ko{fill:#f28b8b}
#map path.hint{fill:#ffd36b}
#map path.w{stroke-width:.6}
#map path.land{fill:var(--land);stroke:var(--line);stroke-width:.6}
#map path.w.ok{filter:brightness(1.12) saturate(1.3)}
#map path.w.hint{fill:#ffd36b!important}
#map path.w.ko{fill:#f28b8b!important}
#map text{font-size:44px;font-weight:700;fill:#2b2440;paint-order:stroke;stroke:#fff;stroke-width:6px;text-anchor:middle;pointer-events:none}
#top{display:flex;justify-content:flex-end}
#lvlb{min-height:52px;padding:0 16px;border:3px solid var(--bd);background:var(--card);color:var(--fg);border-radius:16px;font-size:18px;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(10,8,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.panel{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0 0 4px;font-size:26px}
.opt{min-height:64px;border:3px solid var(--bd);background:var(--card);color:var(--fg);border-radius:18px;font-size:21px;font-weight:700;text-align:left;padding:8px 14px}
.opt small{display:block;font-size:16px;color:var(--mut);font-weight:600}.opt.on{border-color:var(--geo);box-shadow:0 0 0 3px var(--geo)}
#close{height:60px;border:0;border-radius:18px;background:var(--geo);color:#fff;font-size:21px;font-weight:700}
#msg{min-height:26px;text-align:center;font-size:20px;font-weight:700}
#cnt{text-align:center;color:var(--mut);font-size:18px;font-weight:600}
#end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#end b{font-size:34px}#end p{font-size:22px;margin:0}
#map.lm path.e:not(.lit){opacity:.28}
#map path.w.lit{stroke:#2b2440!important;stroke-width:2.2}
#map path.lit:not(.w){fill:#ffc94a;animation:lit 1.2s ease-in-out infinite alternate}
@keyframes lit{to{fill:#ffa31a}}
#lflag{flex:none;width:78px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;box-shadow:0 0 0 2px rgba(0,0,0,.2)}
#fact{font-size:19px;line-height:1.35;font-weight:600;color:var(--fg);margin-top:4px}#fact:empty{display:none}
#nb{flex:1;min-width:0;display:flex;flex-direction:column}
#lbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
#lcnt{color:var(--mut);font-size:18px;font-weight:600}
#lnext{width:104px;height:68px;border:0;border-radius:22px;background:var(--geo);color:#fff;font-size:36px;font-weight:700;box-shadow:0 5px 0 #8a6210}
#lskip{height:56px;padding:0 14px;border:3px solid var(--bd);background:var(--card);color:var(--mut);border-radius:16px;font-size:18px;font-weight:700}
#again{min-width:220px;height:72px;border:0;border-radius:22px;background:var(--geo);color:#fff;font-size:24px;font-weight:700;box-shadow:0 5px 0 #8a6210}
</style>
</head>
<body>
<div id="inner">
  <div id="top"><button id="lvlb"></button></div>
  <div id="ask"><button id="ear" aria-label="Réécouter">🔊</button><div id="nb"><span id="name"></span><div id="fact"></div></div><img id="lflag" alt="" hidden></div>
  <div id="mapw"><svg id="map" preserveAspectRatio="xMidYMid meet"></svg><img id="flag" alt="" hidden><button id="unzoom" hidden aria-label="Voir toute la carte">🔍</button></div>
  <div id="msg"></div>
  <div id="lbar" hidden><button id="lskip">⏭ Jouer</button><span id="lcnt"></span><button id="lnext" aria-label="Suivant">→</button></div>
  <div id="cnt"></div>
  <div id="end" hidden><b>🎉 Bravo !</b><p id="score"></p><button id="again">Encore</button></div>
</div>
<div class="sheet" id="sheet" hidden><div class="panel"><h2>Niveau</h2><div id="lvls" style="display:flex;flex-direction:column;gap:10px"></div><button id="close">Fermer</button></div></div>
<script>
(function(){
// Trouve le pays (matière Géographie) : carte de l'Europe (EU_MAP, jeux/europe-carte.js) ; la voix nomme un pays, l'enfant le touche sur la carte.
// Trouve le pays : France, Allemagne, Espagne, Italie, Grande-Bretagne (drapeau du pays touché affiché) ; Moyen : carte du monde, les 7 continents. Chacun une fois par partie.
// Bon pays = vert (reste vert) ; autre pays = rouge un instant et la voix dit son nom ; après 2 erreurs, le bon pays clignote en jaune.
// Un message « answer » par pays (juste du premier coup), roundEnd en fin de partie.
function fitName(t){var e=document.getElementById("name");e.style.fontSize="";e.innerHTML=t.split(" ").map(function(w){return '<span style="white-space:nowrap">'+w.replace(/</g,"&lt;")+"</span>"}).join(" ");var fs=parseFloat(getComputedStyle(e).fontSize);while((e.scrollWidth>e.clientWidth+1||e.offsetHeight>fs*1.15*2+2)&&fs>14){fs-=1;e.style.fontSize=fs+"px"}}window.__fitName=fitName; // nom toujours entièrement lisible
var $=function(i){return document.getElementById(i)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function voiceFor(l){try{var v=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.indexOf(l)===0});return v.filter(function(x){return x.localService})[0]||v[0]||null}catch(e){return null}}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";var v=voiceFor("fr");if(v)u.voice=v;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
var ac=null;function tone(f,t,d){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C()}if(ac.state==="suspended")ac.resume();var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.18,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
// pays d'Europe (nom Natural Earth → nom français) ; les autres terres sont du décor (non cliquables)
var FR={"Albania":"l'Albanie","Andorra":"l'Andorre","Austria":"l'Autriche","Belarus":"la Biélorussie","Belgium":"la Belgique","Bosnia and Herz.":"la Bosnie-Herzégovine","Bulgaria":"la Bulgarie","Croatia":"la Croatie","Cyprus":"Chypre","N. Cyprus":"Chypre","Czechia":"la Tchéquie","Denmark":"le Danemark","Estonia":"l'Estonie","Finland":"la Finlande","Åland":"la Finlande","France":"la France","Germany":"l'Allemagne","Greece":"la Grèce","Hungary":"la Hongrie","Iceland":"l'Islande","Ireland":"l'Irlande","Italy":"l'Italie","Kosovo":"le Kosovo","Latvia":"la Lettonie","Liechtenstein":"le Liechtenstein","Lithuania":"la Lituanie","Luxembourg":"le Luxembourg","Malta":"Malte","Moldova":"la Moldavie","Monaco":"Monaco","Montenegro":"le Monténégro","Netherlands":"les Pays-Bas","Macedonia":"la Macédoine du Nord","Norway":"la Norvège","Poland":"la Pologne","Portugal":"le Portugal","Romania":"la Roumanie","Russia":"la Russie","San Marino":"Saint-Marin","Serbia":"la Serbie","Slovakia":"la Slovaquie","Slovenia":"la Slovénie","Spain":"l'Espagne","Sweden":"la Suède","Switzerland":"la Suisse","Ukraine":"l'Ukraine","United Kingdom":"la Grande-Bretagne","Vatican":"le Vatican"};
// Niveaux : Facile = carte de l'Europe, les 5 plus grands pays ; Moyen = carte du monde (WORLD_MAP, jeux/monde-carte.js), les 7 continents.
// drapeau affiché quand on touche un pays (images de Retrouve le drapeau)
var FLAG={"l'Albanie":"al","l'Andorre":"ad","l'Autriche":"at","la Biélorussie":"by","la Belgique":"be","la Bosnie-Herzégovine":"ba","la Bulgarie":"bg","la Croatie":"hr","Chypre":"cy","la Tchéquie":"cz","le Danemark":"dk","l'Estonie":"ee","la Finlande":"fi","la France":"fr","l'Allemagne":"de","la Grèce":"gr","la Hongrie":"hu","l'Islande":"is","l'Irlande":"ie","l'Italie":"it","la Lettonie":"lv","le Liechtenstein":"li","la Lituanie":"lt","le Luxembourg":"lu","Malte":"mt","la Moldavie":"md","Monaco":"mc","le Monténégro":"me","les Pays-Bas":"nl","la Macédoine du Nord":"mk","la Norvège":"no","la Pologne":"pl","le Portugal":"pt","la Roumanie":"ro","la Russie":"ru","Saint-Marin":"sm","la Serbie":"rs","la Slovaquie":"sk","la Slovénie":"si","l'Espagne":"es","la Suède":"se","la Suisse":"ch","l'Ukraine":"ua","la Grande-Bretagne":"gb","le Vatican":"va"};
function flag(k){var c=FLAG[k],f=$("flag");if(!c){f.hidden=true;return}f.hidden=true;f.src="jeux/img/drapeaux/"+c+".webp";void f.offsetWidth;f.hidden=false;clearTimeout(flag.t);flag.t=setTimeout(function(){f.hidden=true},cur&&k===cur?1500:1800)}
var CN={EU:"l'Europe",AS:"l'Asie",AF:"l'Afrique",NA:"l'Amérique du Nord",SA:"l'Amérique du Sud",OC:"l'Océanie",AN:"l'Antarctique"};
var CC={EU:"#8fb4ee",AS:"#f4cd6a",AF:"#ec9a74",NA:"#93d293",SA:"#c4a0e0",OC:"#6fd0d0",AN:"#d8e0e4"};
// Deux exercices dans ce fichier (à la demande de l'utilisateur) : « Trouve le pays » (START 1, carte de l'Europe) et « Trouve le continent » (START 2, carte du monde).
var CONT=window.START==2,OCE=window.START==3,GAME=OCE?"oceans":CONT?"continent":"pays";
// « Trouve l'océan » (START 3, à la demande de l'utilisateur) : les 5 océans sur la carte du monde
var ON={ATL:"l'océan Atlantique",PAC:"l'océan Pacifique",IND:"l'océan Indien",ARC:"l'océan Arctique",SOU:"l'océan Austral"};
var OC={ATL:"#5aa9e6",PAC:"#3d8bd4",IND:"#7cc4f0",ARC:"#a9dcf5",SOU:"#2f6fb5"};
var LV=OCE?[null,{t:"Océans",d:"Le monde : les 5 océans",map:"oceans",p:["l'océan Atlantique","l'océan Pacifique","l'océan Indien","l'océan Arctique","l'océan Austral"]}]:CONT?[null,{t:"Continents",d:"Le monde : les 7 continents",map:"world",p:["l'Europe","l'Asie","l'Afrique","l'Amérique du Nord","l'Amérique du Sud","l'Océanie","l'Antarctique"]}]
 :[null,{t:"Facile",d:"L'Europe : France, Allemagne, Espagne, Italie, Grande-Bretagne",map:"eu",p:["la France","l'Allemagne","l'Espagne","l'Italie","la Grande-Bretagne"]}];
var PK="@"+(window.PROFILE||"p1");function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var level=Math.min(LV.length-1,Math.max(1,parseInt(ls(GAME+"_lvl"+PK))||1));
if(LV.length<3)document.getElementById("top").hidden=true; // un seul niveau : pas de bouton Niveau
var map=$("map");
function esc(s){return s.replace(/"/g,"&quot;")}
/* zoom : pincer avec deux doigts (ou molette), glisser un doigt pour se déplacer quand on a zoomé ; 🔍 = toute la carte (à la demande de l'utilisateur) */
var VB0=[0,0,1000,500],VB=VB0.slice(),PT={},pinch=null,pan=null,moved=false;
function setVB0(v){VB0=v.slice();VB=v.slice();applyVB()}
function applyVB(){map.setAttribute("viewBox",VB.join(" "));$("unzoom").hidden=VB[2]>=VB0[2]-1}
function geom(vb){var r=map.getBoundingClientRect(),s=Math.min(r.width/vb[2],r.height/vb[3]);return{r:r,s:s,ox:(r.width-vb[2]*s)/2,oy:(r.height-vb[3]*s)/2}}
function toSvg(x,y,vb){var g=geom(vb);return[vb[0]+(x-g.r.left-g.ox)/g.s,vb[1]+(y-g.r.top-g.oy)/g.s]}
function clampVB(v){var w=Math.max(VB0[2]/4,Math.min(VB0[2],v[2])),h=w*VB0[3]/VB0[2];
 return[Math.max(VB0[0],Math.min(VB0[0]+VB0[2]-w,v[0])),Math.max(VB0[1],Math.min(VB0[1]+VB0[3]-h,v[1])),w,h]}
function zoomAt(cx,cy,P,w,base){var h=w*VB0[3]/VB0[2],v=[0,0,w,h],g=geom(v);v[0]=P[0]-(cx-g.r.left-g.ox)/g.s;v[1]=P[1]-(cy-g.r.top-g.oy)/g.s;VB=clampVB(v);applyVB()}
map.addEventListener("pointerdown",function(e){PT[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(PT);
 if(ids.length===2){var a=PT[ids[0]],b=PT[ids[1]],cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,w:VB[2],P:toSvg(cx,cy,VB)};pan=null;moved=true}
 else if(ids.length===1){moved=false;pan={x:e.clientX,y:e.clientY,vb:VB.slice()}}});
map.addEventListener("pointermove",function(e){if(!PT[e.pointerId])return;PT[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(PT);
 if(pinch&&ids.length>=2){var a=PT[ids[0]],b=PT[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y)||1;zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.P,pinch.w*pinch.d/d)}
 else if(pan&&VB[2]<VB0[2]-1){var dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;
  if(moved){var s=geom(pan.vb).s;VB=clampVB([pan.vb[0]-dx/s,pan.vb[1]-dy/s,pan.vb[2],pan.vb[3]]);applyVB()}}});
function up(e){var tap=e.type==="pointerup"&&!moved&&!pinch&&Object.keys(PT).length===1;delete PT[e.pointerId];if(tap)choose(e); // toucher sans glisser = réponse (pas d'événement click : il peut être avalé après un glissement)
 if(Object.keys(PT).length<2)pinch=null;if(!Object.keys(PT).length)pan=null}
map.addEventListener("pointerup",up);map.addEventListener("pointercancel",up);
map.addEventListener("wheel",function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,toSvg(e.clientX,e.clientY,VB),VB[2]*(e.deltaY>0?1.2:1/1.2))},{passive:false});
$("unzoom").onclick=function(){VB=VB0.slice();applyVB()};
function draw(){var L=LV[level];map.style.background="";
 if(L.map==="eu"){setVB0([205,95,690,675]); // cadrage resserré (à la demande de l'utilisateur) : de l'Islande à la mer Noire, du cap Nord à la Crète
  map.innerHTML=EU_MAP.f.map(function(x){var k=FR[x.n];return '<path d="'+x.d+'"'+(k?' class="e" data-k="'+esc(k)+'"':' class="c"')+"/>"}).join("")}
 else if(L.map==="oceans"){var W=WORLD_MAP,s='<path d="'+W.sphere+'" style="fill:#c9d6df;stroke:none"/>';map.style.background="var(--card)";/* fond neutre : seuls les océans sont bleus */setVB0([45,20,935,480]);
  for(var o in W.oc)s+='<path class="e w" data-k="'+esc(ON[o])+'" d="'+W.oc[o]+'" style="fill:'+OC[o]+';stroke:'+OC[o]+'"/>';
  s+='<path class="land" d="'+W.land+'"/>'; // terres par-dessus (toucher la terre ne compte pas)
  for(var o2 in W.ol)s+='<text x="'+W.ol[o2][0]+'" y="'+W.ol[o2][1]+'" data-l="'+esc(ON[o2])+'" hidden>'+ON[o2].replace(/^l'océan /,"")+"</text>";
  map.innerHTML=s}
 else{var W=WORLD_MAP,s='<defs><clipPath id="ce"><path d="'+W.clipEU+'"/></clipPath><clipPath id="ca"><path d="'+W.clipAS+'"/></clipPath></defs><path d="'+W.sphere+'" style="fill:var(--sea);stroke:none"/>';
  setVB0([45,20,935,480]); // monde : léger recadrage (océans des bords)
  function cp(k,d,clip){return '<path class="e w" data-k="'+esc(CN[k])+'" d="'+d+'" style="fill:'+CC[k]+';stroke:'+CC[k]+'"'+(clip?' clip-path="url(#'+clip+')"':"")+"/>"}
  for(var k in W.c)s+=cp(k,W.c[k]);s+=cp("EU",W.ru,"ce")+cp("AS",W.ru,"ca");
  for(var k2 in W.l)s+='<text x="'+W.l[k2][0]+'" y="'+W.l[k2][1]+'" data-l="'+esc(CN[k2])+'" hidden>'+cap(CN[k2]).replace(/^L'/,"")+"</text>";
  map.innerHTML=s}}
function paths(k){return Array.prototype.filter.call(map.querySelectorAll("path.e"),function(p){return p.dataset.k===k})}
// Apprentissage avant le jeu (à la demande de l'utilisateur, comme Lerne neue Wörter) : chaque lieu de la partie s'allume sur la carte,
// avec son nom, une phrase à retenir (et le drapeau pour un pays), dite à voix haute ; flèche → = suivant ; toucher un autre lieu dit son nom.
var FACT={"la France":"Sa capitale est Paris. C'est là que se trouve la tour Eiffel.","l'Allemagne":"Sa capitale est Berlin. On y parle allemand.",
 "l'Espagne":"Sa capitale est Madrid. On y parle espagnol.","l'Italie":"Sa capitale est Rome. Elle a la forme d'une botte !","la Grande-Bretagne":"C'est une grande île. Sa capitale est Londres et on y parle anglais.",
 "l'Europe":"C'est notre continent : la France est en Europe.","l'Asie":"C'est le plus grand continent. Les pandas vivent en Asie.",
 "l'Afrique":"Il y fait très chaud. Les lions et les girafes vivent en Afrique.","l'Amérique du Nord":"On y trouve le Canada et les États-Unis.",
 "l'Amérique du Sud":"On y trouve la grande forêt d'Amazonie.","l'Océanie":"On y trouve l'Australie, où vivent les kangourous.",
 "l'Antarctique":"C'est le continent le plus froid, tout couvert de glace. Les manchots y vivent.",
 "l'océan Atlantique":"Il est entre l'Europe, l'Afrique et l'Amérique. Il borde la France.","l'océan Pacifique":"C'est le plus grand océan du monde.",
 "l'océan Indien":"Il est au sud de l'Asie, entre l'Afrique et l'Australie.","l'océan Arctique":"Il est tout au nord, autour du pôle Nord. Il est souvent gelé : c'est là que vivent les ours polaires.",
 "l'océan Austral":"Il est tout au sud, autour de l'Antarctique."};
var LEARN=false,li=0;
function voici(k){return "Voici "+k+". "+(FACT[k]||"")}
function unlit(){map.querySelectorAll("path.lit").forEach(function(q){q.classList.remove("lit")});map.querySelectorAll("text[data-l]").forEach(function(x){x.setAttribute("hidden","")})}
function card(){var k=deck[li];unlit();paths(k).forEach(function(q){q.classList.add("lit")});var t=map.querySelector('text[data-l="'+k+'"]');if(t)t.removeAttribute("hidden");
 var lf=$("lflag");lf.hidden=!FLAG[k];if(FLAG[k])lf.src="jeux/img/drapeaux/"+FLAG[k]+".webp";
 fitName(cap(k));$("fact").textContent=FACT[k]||"";$("lcnt").textContent="📖 "+(li+1)+" / "+deck.length;
 setTimeout(function(){say(voici(k))},250)}
function learn(){LEARN=true;map.classList.add("lm");li=0;cur=null;$("cnt").hidden=$("msg").hidden=true;$("lbar").hidden=false;card()}
function quiz(){LEARN=false;map.classList.remove("lm");$("lflag").hidden=true;unlit();$("fact").textContent="";$("flag").hidden=true;$("lbar").hidden=true;$("cnt").hidden=$("msg").hidden=false;qi=0;show()}
$("lnext").onclick=function(){if(!LEARN)return;li++;if(li<deck.length)card();else quiz()};
$("lskip").onclick=function(){if(LEARN)quiz()};
var deck,qi,good,cur,miss,busy;
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function start(){draw();deck=shuffle(LV[level].p);if(window.PATHN)deck=deck.slice(0,window.PATHN);qi=0;good=0;$("lvlb").textContent="Niveau : "+LV[level].t;
 $("end").hidden=true;$("ask").hidden=$("mapw").hidden=false;learn()}
function show(){cur=deck[qi];miss=0;busy=false;$("msg").textContent="";$("flag").hidden=true;fitName(ask(cur));$("cnt").textContent=(qi+1)+" / "+deck.length;setTimeout(function(){say(ask(cur))},250)}
// la question est posée sous forme de question (à la demande de l'utilisateur) : « Où se situe la France ? »
function ask(k){return "Où se situe "+k+"\u00a0?"}
$("ear").onclick=function(){if(LEARN)say(voici(deck[li]));else if(cur)say(ask(cur))};
function choose(e){var p=e.target.closest&&e.target.closest("path.e");
 if(LEARN){if(p){var k0=p.dataset.k;if(k0===deck[li])say(voici(k0));else{say("Ça, c'est "+k0);flag(k0)}}return} // apprentissage : toucher un lieu dit son nom
 if(!p||busy||!cur)return;var k=p.dataset.k;
 if(k===cur){busy=true;paths(cur).forEach(function(q){q.classList.remove("hint");q.classList.add("ok")});var t=map.querySelector('text[data-l="'+cur+'"]');if(t)t.removeAttribute("hidden");
  tone(660,0,.12);tone(880,.1,.2);say("Bravo !");$("msg").textContent="✅ "+cap(cur);flag(cur);if(!miss)good++;
  try{if(parent!==window)parent.postMessage({type:"answer",game:GAME,ok:!miss,diff:1,k:LV[level].t,item:cur},"*")}catch(er){}
  setTimeout(function(){qi++;if(qi<deck.length)show();else end()},1500)}
 else if(!p.classList.contains("ok")){miss++;var w=paths(k);w.forEach(function(q){q.classList.add("ko")});tone(220,0,.25);
  $("msg").textContent="Ça, c'est "+k;flag(k);say("Ça, c'est "+k);
  setTimeout(function(){w.forEach(function(q){q.classList.remove("ko")})},900);
  if(miss>=2)paths(cur).forEach(function(q){q.classList.add("hint")})}}
function end(){$("ask").hidden=$("mapw").hidden=$("cnt").hidden=$("msg").hidden=true;$("end").hidden=false;$("score").textContent=good+" / "+deck.length+" du premier coup";cur=null;
 [523,659,784,1047].forEach(function(f,k){tone(f,k*.1,.25)});
 try{if(parent!==window)parent.postMessage({type:"roundEnd"},"*")}catch(e){}}
$("again").onclick=start;
$("lvlb").onclick=function(){$("lvls").innerHTML=LV.map(function(L,i){return L?'<button class="opt'+(i===level?" on":"")+'" data-l="'+i+'">'+L.t+"<small>"+L.d+"</small></button>":""}).join("");$("sheet").hidden=false};
$("lvls").onclick=function(e){var b=e.target.closest("[data-l]");if(!b)return;level=+b.dataset.l;ls(GAME+"_lvl"+PK,level);$("sheet").hidden=true;start()};
$("close").onclick=function(){$("sheet").hidden=true};
window.hubBack=function(){if(!$("sheet").hidden){$("sheet").hidden=true;return true}return false};
window.__P={cur:function(){return cur},click:function(k){var p=paths(k)[0];if(p)choose({target:p})}};
start();
})();
</script>
