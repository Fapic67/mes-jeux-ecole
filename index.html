<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5b6cff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Jeux d'école">
<title>Mes jeux d'école</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ff;--card:#fff;--ink:#22204a;--soft:#6e6a99;--line:#e2ddf7;--math:#4a7cff;--de:#ff5c7a;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#16152b;--card:#232142;--ink:#f2f0ff;--soft:#a5a1cf;--line:#36335f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);user-select:none}
.view{display:none;min-height:100%;max-width:520px;margin:0 auto;padding:20px 18px 28px;flex-direction:column;gap:16px}
.view.on{display:flex}
h1{margin:6px 0 0;font-size:32px;font-weight:700}
.sub{color:var(--soft);font-size:18px;margin:0}
.tile{display:flex;align-items:center;gap:16px;width:100%;border:0;border-radius:24px;padding:22px 20px;color:#fff;font:600 26px "Fredoka",sans-serif;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.15);cursor:pointer}
.tile:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.tile .ic{font-size:46px;line-height:1}
.tile small{display:block;font-size:15px;font-weight:500;opacity:.9}
.math{background:var(--math)}.de{background:var(--de)}
.game{display:flex;align-items:center;gap:14px;width:100%;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:16px;font:600 22px "Fredoka",sans-serif;text-align:left;cursor:pointer}
.game:active{transform:scale(.98)}
.game .ic{font-size:38px}
.game small{display:block;font-size:14px;font-weight:500;color:var(--soft)}
.top{display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font:600 17px "Fredoka",sans-serif;cursor:pointer}
.name{display:flex;gap:8px;align-items:center;margin-top:auto;color:var(--soft);font-size:15px}
.name input{flex:1;min-width:0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 10px;font:500 16px "Fredoka",sans-serif;user-select:text}
#play{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#play.on{display:flex}
#play .bar{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line)}
#play .bar b{font-size:17px}
#frame{flex:1;width:100%;border:0;background:transparent}
</style>
</head>
<body>

<section class="view" id="v-home">
  <h1 id="hello">Bonjour ! 👋</h1>
  <p class="sub">Choisis une matière</p>
  <button class="tile math" data-go="maths"><span class="ic">🧮</span><span>Mathématiques<small>Calcul, téléphone</small></span></button>
  <button class="tile de" data-go="allemand"><span class="ic">🇩🇪</span><span>Allemand<small>Der · Die · Das, mots en images</small></span></button>
  <label class="name">Prénom : <input id="prenom" maxlength="20" placeholder="pour les bravos" autocomplete="off"></label>
</section>

<section class="view" id="v-maths">
  <div class="top"><button class="back" data-go="">← Matières</button></div>
  <h1>🧮 Mathématiques</h1>
  <button class="game" data-play="calcul"><span class="ic">➕</span><span>Calcul malin<small>Additions, soustractions, compléments · voix en allemand</small></span></button>
  <button class="game" data-play="telephone"><span class="ic">📞</span><span>Le téléphone magique<small>Écoute les nombres et compose le numéro</small></span></button>
</section>

<section class="view" id="v-allemand">
  <div class="top"><button class="back" data-go="">← Matières</button></div>
  <h1>🇩🇪 Allemand</h1>
  <button class="game" data-play="article"><span class="ic">🔤</span><span>Der · Die · Das<small>Trouve le bon article</small></span></button>
  <button class="game" data-play="mot"><span class="ic">🖼️</span><span>Finde das Wort<small>Une image, trois mots</small></span></button>
</section>

<div id="play"><div class="bar"><button class="back" id="pback">←</button><b id="ptitle"></b></div><iframe id="frame" allow="autoplay; publickey-credentials-get *; publickey-credentials-create *"></iframe></div>

<script>
var GAMES={
 calcul:{t:"Calcul malin",app:"calcul",subj:"maths"},
 telephone:{t:"Le téléphone magique",app:"telephone",subj:"maths"},
 article:{t:"Der · Die · Das",app:"deutsch",start:1,subj:"allemand"},
 mot:{t:"Finde das Wort",app:"deutsch",start:2,subj:"allemand"}
};
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return ""}}
var cache={},loadTok=0;
function load(app){return cache[app]||(cache[app]=fetch("jeux/"+app+".html").then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).catch(function(e){delete cache[app];throw e}))}
function src(g,h){
 var pre="<script>window.START="+(g.start||0)+";window.PRENOM="+JSON.stringify(ls("hub_prenom")).replace(/</g,"\\u003c")+"<\/script>";
 return h.replace("<head>","<head>"+pre)}
function stopGame(){loadTok++;var f=$("frame");try{f.contentWindow&&f.contentWindow.speechSynthesis&&f.contentWindow.speechSynthesis.cancel()}catch(e){}f.removeAttribute("srcdoc");f.src="about:blank";$("play").classList.remove("on")}
function route(){
 var h=location.hash.replace("#","");
 document.querySelectorAll(".view").forEach(function(v){v.classList.remove("on")});
 if(GAMES[h]){var g=GAMES[h];$("v-"+g.subj).classList.add("on");$("ptitle").textContent=g.t;$("play").classList.add("on");var tok=++loadTok;load(g.app).then(function(h){if(tok===loadTok)$("frame").srcdoc=src(g,h)},function(){if(tok===loadTok)$("frame").srcdoc="<p style=\"font:20px sans-serif;padding:20px\">Impossible de charger le jeu. Vérifie la connexion puis réessaie.</p>"});return}
 stopGame();
 ($("v-"+h)||$("v-home")).classList.add("on");
 var p=ls("hub_prenom");$("hello").textContent=p?"Bonjour "+p+" ! 👋":"Bonjour ! 👋"}
function go(h){if(("#"+h)===location.hash||(!h&&!location.hash)){route();return}location.hash=h;if(!h){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}route()}}
document.addEventListener("click",function(e){var b=e.target.closest("[data-go],[data-play]");if(!b)return;
 if(b.dataset.play!==undefined)go(b.dataset.play);else go(b.dataset.go)});
$("pback").onclick=function(){var h=location.hash.replace("#","");go(GAMES[h]?GAMES[h].subj:"")};
window.addEventListener("message",function(e){if(e.data==="hub-back")$("pback").onclick()});
window.addEventListener("hashchange",route);
$("prenom").value=ls("hub_prenom");
$("prenom").addEventListener("input",function(){ls("hub_prenom",this.value.trim());var p=this.value.trim();$("hello").textContent=p?"Bonjour "+p+" ! 👋":"Bonjour ! 👋"});
route();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
</body>
</html>
